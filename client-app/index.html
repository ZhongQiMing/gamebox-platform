<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <!--
      整页等比缩放：固定按 430 宽排版，再由浏览器整体缩到屏宽。

      界面里的字号、间距、圆角全是写死的 px，照设计稿画的。这些数字原样落到 360 宽的机器上
      （1080×1920 @480dpi 就是这种）每个元素都超额占位，看上去就是「什么都被放大了」，
      功能格子还会溢出卡片。写死一个布局宽度，字号、间距、描边、图片就按同一个比例一起缩，
      版式跟设计稿严丝合缝，也不用去动几千处 px。

      这里刻意不做「按设备宽度判断要不要缩放」的分支：之前那版用 screen.width 判断，
      安卓 WebView 上直接回退成设备宽度，等于整个缩放没生效，且毫无报错。固定值最省心。
      想让界面整体再小一点，把 430 调大即可（调小则变大）。

      安卓侧还需要 MainActivity 里的 setUseWideViewPort(true) + setLoadWithOverviewMode(true)，
      否则 WebView 会忽略这里的 width。改这行前先看那边的注释。
    -->
    <meta name="viewport" content="width=430, user-scalable=no, viewport-fit=cover">
    <!--
      本地字体（原 Google Fonts），见 public/fonts/。
      不在这里用 <link rel="stylesheet">：那样会阻塞首屏渲染，而这张分片表 gzip 后仍有
      160KB，在大陆到香港的线路上要 6 秒，期间整页是黑的。改由 main.ts 在首屏画完后挂载，
      表里每条 @font-face 都是 font-display: swap，先系统字体后切换即可。
    -->
    <title>金御汇</title>
    <!--
      进场画面。写在 index.html 里而不是做成 Vue 组件：这样浏览器解析到就能画，
      不用等 JS 下载、解析、挂载，冷启动那一两秒不再是黑屏。
      （安卓 12 起系统开屏被锁成「纯色底+中心图标」，整屏品牌图只能由这里铺。）
    -->
    <style>
      #app-intro {
        position: fixed;
        inset: 0;
        z-index: 3000;
        background: #0d0a08 url('/images/app-intro.webp') center / cover no-repeat;
        transition: opacity 450ms ease;
      }
      #app-intro.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app-intro"></div>
    <div id="app"></div>
    <!--
      必须是独立文件：玩家站 script-src 只允许本站脚本，行内脚本会被拦住，
      开屏层就一直盖住登录页。
    -->
    <script src="/app-intro.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
