# 单镜像、三监听端口：宿主机分别把玩家/后台/游戏域名转发到 8080/8081/8082。
# __PLAYER_ORIGIN__ 与 __GAME_ORIGIN__ 在镜像构建时替换，禁止运行时通配。
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 玩家 SPA
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/wasm;
    gzip_static on;

    set $player_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' __GAME_ORIGIN__ data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src __GAME_ORIGIN__; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $player_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /uploads/cs/ { return 404; }
    location /uploads/ {
        proxy_pass http://server:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /socket.io/ {
        proxy_pass http://server:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # H5 与后台必须经各自独立 Origin，玩家 Origin 不提供兼容副本。
    location ^~ /games-assets/ { return 404; }
    location ^~ /legacy/ { return 404; }
    location ^~ /admin/ { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|woff2?|ttf|mp3|ogg|m4a|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $player_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 管理后台 SPA
server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_static on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    set $admin_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $admin_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ^~ /uploads/cs/ { return 404; }
    location /uploads/ {
        proxy_pass http://server:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /games-assets/ { return 404; }
    location ^~ /legacy/ { return 404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Security-Policy $admin_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 无凭证 H5 游戏静态域；不反代任何 API。
server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    set $game_csp "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors __PLAYER_ORIGIN__ capacitor://localhost http://localhost https://localhost";
    add_header Content-Security-Policy $game_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location ^~ /api/ { return 404; }
    location ^~ /uploads/ { return 404; }
    location ^~ /admin/ { return 404; }

    # 游戏字体与游戏页同 Origin 提供；只读，入口 CSS 短缓存，内容寻址字体长缓存。
    location = /fonts/gamebox-fonts.css {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Content-Security-Policy $game_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location ^~ /fonts/files/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $game_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location ^~ /fonts/ { return 404; }

    location ~* ^/(games-assets|legacy)/.*\.(js|css|json|html)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Content-Security-Policy $game_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    location ~* ^/(games-assets|legacy|images|audio)/.*\.(png|jpg|jpeg|gif|webp|svg|woff2?|ttf|mp3|ogg|m4a|wav|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
    }

    location /games-assets/ { try_files $uri =404; }
    location /legacy/ { try_files $uri =404; }
    location /images/ { try_files $uri =404; }
    location /audio/ { try_files $uri =404; }
    location / { return 404; }
}
