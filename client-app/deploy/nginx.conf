# TLS 在宿主机 Nginx 终止，这里只透传它给出的协议；直连本容器时回落到 $scheme
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 与后端 main.ts 的 12mb body 上限对齐；nginx 默认 1m 会把客服收款码上传提前 413 掉
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # CSP：token 存在 localStorage，一个能执行的 XSS 就等于把会话交出去。
    # 'unsafe-inline' 暂时留着——Vue 运行时注入 <style>、Element Plus 也写内联样式，
    # 去掉会整站白屏。script-src 不含 unsafe-eval，第三方脚本源一律不放。
    # H5 游戏在 iframe 里跑，同源，走同一条策略。
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    add_header Content-Security-Policy $csp always;

    # 后端 API：反代到 gamebox-server 容器（docker 内部网络，域名即服务名）
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # 后端本地存储的上传件（客服收款码、头像），由 server 静态托管
    location /uploads/ {
        proxy_pass http://server:3001/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # WebSocket：Socket.IO 需要 Upgrade 头
    location /socket.io/ {
        proxy_pass http://server:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # 仅 vite 产物带内容哈希（含 /admin/assets），改文件必改名，可长缓存且无需回源
    location ~* ^/(admin/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # games-assets/legacy 是裸路径无哈希，游戏逻辑热修必须当天触达，禁止 immutable
    location ~* ^/(games-assets|legacy)/.*\.(js|css)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    # 图片/音频/字体同样无哈希，长缓存但保留回源校验，换素材不必等过期
    location ~* \.(png|jpg|jpeg|gif|webp|svg|woff2?|ttf|mp3|ogg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # add_header 不跨 location 继承，此处须重述安全头，否则主文档裸奔
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $csp always;
    }

    # 后台的 SPA 壳同样不能缓存：壳被缓存住会去要上一版的 assets 文件名，
    # 那些文件发版后已经被清掉，结果就是发完版后台白屏
    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy $csp always;
    }

    # 管理后台：独立 SPA，回退到自己的 index.html
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # SPA 路由回退；games-assets/images/audio 等静态文件优先按真实路径返回
    location / {
        try_files $uri $uri/ /index.html;
    }
}
