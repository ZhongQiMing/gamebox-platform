            oddsRows: [
              ['庄 / 闲', '押中牌型更大的一方', '1 : ' + BET_ODDS.banker + '（净得）'],
              ['小牛牛', '赢方为五小牛', '1 : ' + BET_ODDS.small + '（净得）'],
              ['牛牛', '赢方为牛牛（不含炸弹/五小/五花）', '1 : ' + BET_ODDS.niuniu + '（含本）'],
              ['牛7-牛9', '赢方为牛七 / 牛八 / 牛九', '1 : ' + BET_ODDS.niu79 + '（含本）'],
              ['无牛-牛6', '赢方为无牛或牛一至牛六', '1 : ' + BET_ODDS.niu06 + '（含本）'],
              ['五花牛', '赢方为五花牛', '1 : ' + BET_ODDS.flower + '（净得）'],
            ],
            notes: [
              '请理性投注，量力而行。',
              '最终以当局开牌结果与系统结算为准。',
            ],
          })
        : '<p>玩法规则加载失败，请刷新重试。</p>';
      openSheet('玩法规则', html);
    });

    /* 设置：背景音乐 / 音效开关 */
    var setBtn = document.getElementById('railSettings');
    if (setBtn) setBtn.addEventListener('click', function () {
      var html = window.TableShell
        ? TableShell.buildAudioSettingsHtml(audioPref)
        : '<p>设置加载失败</p>';
      openSheet('设置', html);
      if (window.TableShell) {
        TableShell.bindAudioSettings({
          onMusic: function (on) { if (typeof unlockAudio === 'function') unlockAudio(); setMusicOn(on); },
          onSfx: function (on) { if (typeof unlockAudio === 'function') unlockAudio(); setSfxOn(on); },
        });
      }
    });

    /* 右侧五钮：默认收起，点三角展开/收起 */
    (function initRailLadder() {
      var KEY = 'dn_rail_collapsed';
      var rail = document.getElementById('dnRail');
      var btn = document.getElementById('btnRailToggle');
      if (!rail || !btn) return;
      /* 清掉旧版假人定位残留的 inline 样式 */
      rail.style.left = '';
      rail.style.top = '';
      rail.style.transform = '';
      var collapsed = true;
      try {
        var saved = localStorage.getItem(KEY);
        if (saved === '0') collapsed = false;
        if (saved === '1') collapsed = true;
      } catch (e) { /* ignore */ }
      function apply() {
        rail.classList.toggle('is-rail-collapsed', collapsed);
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.title = collapsed ? '展开菜单' : '收起菜单';
        var arrow = btn.querySelector('.dn-rail-ladder__arrow');
        if (arrow) arrow.textContent = collapsed ? '▼' : '▲';
        try { localStorage.setItem(KEY, collapsed ? '1' : '0'); } catch (e2) { /* ignore */ }
      }
      apply();
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        collapsed = !collapsed;
        apply();
      });
    })();
  })();

  /* ---------- 气氛人数（桌边右侧，非实时在线） ---------- */
  var playersBox = document.getElementById('playersBox');
  if (playersBox) {
    playersBox.setAttribute('aria-label', '气氛人数（非实时在线）');
    playersBox.setAttribute('title', '桌面气氛人数，非实时在线');
  }
  var playersCountEl = document.getElementById('playersCount');
  var onlinePlayers = 36 + Math.floor(Math.random() * 28);

  function paintPlayers() {
    if (playersCountEl) playersCountEl.textContent = String(onlinePlayers);
  }

  function tickPlayers() {
    var d = Math.floor(Math.random() * 5) - 2;
    onlinePlayers = Math.max(18, Math.min(99, onlinePlayers + d));
    paintPlayers();
  }

  paintPlayers();
  if (window.__dnPlayersTimer) clearInterval(window.__dnPlayersTimer);
  window.__dnPlayersTimer = setInterval(tickPlayers, 8000);

  /* 全部变量就绪后再开局 + 启动唯一倒计时 */
  hideAllCards();
  /*
   * 先拉一份快照把时钟对上，再让心跳接管。
   * 对不上也不要紧：roundPosition 会先用本地墙钟顶着，下一份快照到手自动切回来。
   */
  function bootFromServer() {
    if (!window.App || !App.fetchTableSnapshot) return;
    var sentAt = Date.now();
    App.fetchTableSnapshot(SERVER_GAME).then(function (snap) {
      if (!snap) return;
      applyServerSnap(snap, { sentAt: sentAt, recvAt: Date.now() });
      if (snap.outcome && drawClock && !drawClock.outcome) bindDrawOutcome(snap);
      tick();
    }).catch(function () { /* 忽略：心跳会继续尝试 */ });
  }
  bootFromServer();
  if (window.__dnTickTimer) clearInterval(window.__dnTickTimer);
  window.__dnTickTimer = setInterval(tick, 200);
  if (window.TableShell && TableShell.startSnapshotPoll) {
    /*
     * 轮询只干两件事：给时钟校时、把开奖结果补进来。
     * 它不再有权切换相位——以前它和心跳各自判断「该开奖了/该下注了」，
     * 两边抢着切，网络一抖就打架。
     */
    window.__dnSnapTimer = TableShell.startSnapshotPoll(SERVER_GAME, function (snap, meta) {
      applyServerSnap(snap, meta);
      if (snap && snap.outcome && drawClock && !drawClock.outcome) {
        bindDrawOutcome(snap);
        advanceDrawClock();
      }
    }, {
      intervalMs: 1000,
      shouldPoll: function () { return true; },
    });
  }

  /** 切回前台：重新对时并把画面跳到当前应有的位置 */
  function onShellResume() {
    try { flyLayer.innerHTML = ''; } catch (eR) { /* ignore */ }
    if (drawClock) {
      drawClock.dealStarted = {};
      drawClock.flipStarted = {};
      drawClock.forceSeek = true;
    }
    if (!window.App || !App.fetchTableSnapshot) {
      tick();
      return;
    }
    var sentAt = Date.now();
    App.fetchTableSnapshot(SERVER_GAME).then(function (snap) {
      if (snap) {
        applyServerSnap(snap, { sentAt: sentAt, recvAt: Date.now() });
        if (snap.outcome && drawClock && !drawClock.outcome) bindDrawOutcome(snap);
      }
      tick();
    }).catch(function () { tick(); });
  }

  window.addEventListener('message', function (ev) {
    if (!ev || !ev.origin || ev.origin !== ((window.App && App.parentOrigin) || location.origin) || ev.source !== window.parent) return;
    var data = ev && ev.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'assets-game-pause') {
      try { flyLayer.innerHTML = ''; } catch (eP) { /* ignore */ }
      persistTableChips();
      return;
    }
    if (data.type === 'assets-game-resume') {
      onShellResume();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      try { flyLayer.innerHTML = ''; } catch (eH) { /* ignore */ }
      persistTableChips();
      return;
    }
    onShellResume();
  });

  window.addEventListener('pagehide', function () { persistTableChips(); });
  window.addEventListener('beforeunload', function () { persistTableChips(); });

  window.__dnBooted = true;

})();
</script>

</body>
</html>
