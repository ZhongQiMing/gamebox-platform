  <script>
    (function () {
      if (window.parent !== window) document.documentElement.classList.add('dn-in-iframe');
      var DESIGN_W = 1024, DESIGN_H = 1536;
      function applyScale() {
        var head = document.querySelector('.dn-head');
        var headH = head ? head.offsetHeight : 56;
        var availW = window.innerWidth;
        var availH = Math.max(120, window.innerHeight - headH);
        var s = Math.min(1, availW / DESIGN_W, availH / DESIGN_H);
        document.documentElement.style.setProperty('--dn-scale', String(s));
      }
      window.addEventListener('resize', applyScale);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyScale);
      } else {
        applyScale();
      }
    })();
  </script>

<script>
(function () {
  /* 防重复注入：先清旧定时器；成功跑完再打标 */
  if (window.__dnTickTimer) { clearInterval(window.__dnTickTimer); window.__dnTickTimer = null; }
  if (window.__dnSnapTimer) { clearInterval(window.__dnSnapTimer); window.__dnSnapTimer = null; }
  if (window.__dnPlayersTimer) { clearInterval(window.__dnPlayersTimer); window.__dnPlayersTimer = null; }
  if (window.__dnBooted) return;

  /* 总周期 66s：下注 + 开奖流程(10 张发牌翻牌报牌≈17s) + 派奖 4s */
  /* 下注统一 45s；发牌/派奖时长本游戏不变；整局 = 45+17+4=66s */
  var BETTING_SEC = 45;
  var DRAW_EST_SEC = 17;
  var PAYOUT_SECS = 4;
  var ROUND_SEC = BETTING_SEC + DRAW_EST_SEC + PAYOUT_SECS;
  var TOTAL = BETTING_SEC;
  var SERVER_GAME = 'douniu';

  var serverClock = (window.TableShell && TableShell.createServerClock)
    ? TableShell.createServerClock()
    : { phase: '', secondsLeft: 0, syncedAt: 0, roundNo: '', timing: null };

  /*
   * ───────── 时间基准 ─────────
   *
   * 整局时序只认服务端的钟：每一局的绝对起点由局号唯一确定，界面永远只回答
   * 「按服务端的钟，现在走到本局第几毫秒」，本地不再自己累加倒计时。
   * 这样丢包、慢网、切后台、机器卡顿都只影响画面追赶的快慢，不会让流程错乱。
   *
   * 本游戏整局 66s（下注 45 + 开奖 17 + 派奖 4），具体数值以服务端 timing 为准。
   */
  function localFallbackPosition() {
    var cycleMs = ROUND_SEC * 1000;
    var bettingMs = TOTAL * 1000;
    var now = Date.now();
    var startAt = Math.floor(now / cycleMs) * cycleMs;
    var tIn = now - startAt;
    var drawMs = DRAW_EST_SEC * 1000;
    var phase = tIn < bettingMs
      ? 'BETTING'
      : (tIn < bettingMs + drawMs ? 'DRAWING' : 'SETTLED');
    return {
      startAt: startAt,
      tIn: tIn,
      cycleMs: cycleMs,
      phase: phase,
      betLeftMs: phase === 'BETTING' ? bettingMs - tIn : 0,
      drawElapsedMs: phase === 'BETTING' ? 0 : tIn - bettingMs,
    };
  }

  function roundPosition() {
    if (window.TableShell && TableShell.roundPositionOf) {

  function buildDeck() {
    var deck = [];

        }
      }
    }

  function isFlower(cards) {

  function evalHand(cards) {
    if (isSmallBull(cards)) {

    }
    if (isBomb(cards)) {

    }
    if (isFlower(cards)) {
      return { type: 'flower', label: '五花牛', tier: 80, niu: 11, special: 'flower', tenIdx: null };
    }
    var vals = cards.map(function (c) { return c.niuVal; });
    for (var i = 0; i < 3; i++) {
      for (var j = i + 1; j < 4; j++) {
        for (var k = j + 1; k < 5; k++) {

  /* 凑十：能凑十 → 三张并一组、另两张并一组（中间留空不重叠）；凑不到 → 完全不动 */
  function applyMakeTenSplit(prefix, cards, ev) {
    var hand = prefix === 'b' ? bankerHand : playerHand;
    if (!hand) return Promise.resolve();

    hand.classList.remove('is-split');
    for (var c = 0; c < 5; c++) {
      var clearSlot = room.querySelector('.dn-card[data-slot="' + prefix + (c + 1) + '"]');
      if (clearSlot) clearSlot.removeAttribute('data-group');

    if (!ev || !ev.tenIdx || ev.tenIdx.length !== 3 || !cards || cards.length !== 5) {
      return delay(40);

    var tenSum = cards[ev.tenIdx[0]].niuVal + cards[ev.tenIdx[1]].niuVal + cards[ev.tenIdx[2]].niuVal;
    if (tenSum % 10 !== 0) {
      return delay(40);
    }

    var ordered = [];
    var used = {};
    for (var t = 0; t < 3; t++) {
      used[ev.tenIdx[t]] = true;
      ordered.push(cards[ev.tenIdx[t]]);
    }
    for (var r = 0; r < 5; r++) {
      if (!used[r]) ordered.push(cards[r]);
    }

    for (var i = 0; i < 5; i++) {
      var sid = prefix + (i + 1);
      if (roundCards) roundCards[sid] = ordered[i];
      setSlotFace(sid, ordered[i]);
      var slot = room.querySelector('.dn-card[data-slot="' + sid + '"]');

    hand.classList.add('is-split');

  function dealTen(forced) {
    var banker;
    var player;
    if (forced && forced.banker && forced.player) {
      banker = forced.banker.map(function (c) {
        return (c && c.niuVal != null) ? c : makeCard(c.suit, c.rank);
      });
      player = forced.player.map(function (c) {
        return (c && c.niuVal != null) ? c : makeCard(c.suit, c.rank);
      });
    } else {
      var deck = buildDeck();
      banker = [deck[0], deck[2], deck[4], deck[6], deck[8]];
      player = [deck[1], deck[3], deck[5], deck[7], deck[9]];
    }
    roundCards = {
      b1: banker[0], b2: banker[1], b3: banker[2], b4: banker[3], b5: banker[4],
      p1: player[0], p2: player[1], p3: player[2], p4: player[3], p5: player[4]
    };
    for (var i = 0; i < DEAL_ORDER.length; i++) {
      setSlotFace(DEAL_ORDER[i], roundCards[DEAL_ORDER[i]]);
    }
    var idx = 0;
    function next() {
      if (idx >= DEAL_ORDER.length) return Promise.resolve();
      var id = DEAL_ORDER[idx++];
      return flyOne(id).then(function () {
        return delay(GAP_MS);
      }).then(next);
    }
    return next().then(function () {
      return { banker: banker, player: player };
    });
  }

    var idx = 0;
    function next() {

      var id = DEAL_ORDER[idx++];
      return flipOne(id).then(function () {
        return delay(FLIP_GAP_MS);
      }).then(next);
    }
    return next();
  }

  /* 翻完后：庄凑十+报牌 → 闲凑十+报牌（牌型优先用服务端 outcome） */
  function revealMakeTenAndVoice(hands, serverOutcome) {
    var bt = (serverOutcome && serverOutcome.bankerType && serverOutcome.bankerType.label)
      ? serverOutcome.bankerType
      : evalHand(hands.banker);
    var pt = (serverOutcome && serverOutcome.playerType && serverOutcome.playerType.label)
      ? serverOutcome.playerType
      : evalHand(hands.player);
    return applyMakeTenSplit('b', hands.banker, bt)
      .then(function () {
        revealTypeLabel(bankerTypeEl, bt.label);
        return playHandVoice(bt);
      })
      .then(function () {
        return applyMakeTenSplit('p', hands.player, pt);
      })
      .then(function () {
        revealTypeLabel(playerTypeEl, pt.label);
        return playHandVoice(pt);
      })
      .then(function () {
        return { bankerEval: bt, playerEval: pt, outcome: serverOutcome || null };
      });
  }

  function showCompare(bankerEval, playerEval, banker, player, serverOutcome) {
    var bt = bankerEval || evalHand(banker);
    var pt = playerEval || evalHand(player);
    var result = 'banker';
    if (serverOutcome && (serverOutcome.result === 'banker' || serverOutcome.result === 'player')) {
      result = serverOutcome.result;
    } else {
      var cmp = compareHands(bt, pt, banker, player);
      result = cmp > 0 ? 'banker' : 'player';
    }
    if (bankerHand) bankerHand.classList.remove('is-winner', 'is-loser');
    if (playerHand) playerHand.classList.remove('is-winner', 'is-loser');
    if (result === 'banker') {
      if (bankerHand) bankerHand.classList.add('is-winner');
      if (playerHand) playerHand.classList.add('is-loser');
    } else {
      if (playerHand) playerHand.classList.add('is-winner');
      if (bankerHand) bankerHand.classList.add('is-loser');
    }
    revealTypeLabel(bankerTypeEl, bt.label);
    revealTypeLabel(playerTypeEl, pt.label);
    return { result: result, bankerType: bt, playerType: pt };
  }

  function layerRect(el) {
    var layer = payoutFlyLayer.getBoundingClientRect();
    var er = el.getBoundingClientRect();
    return {
      left: er.left - layer.left,
      top: er.top - layer.top,
      width: er.width,
      height: er.height,
      cx: er.left - layer.left + er.width / 2,
      cy: er.top - layer.top + er.height / 2
    };
  }

  function handHitsSide(ev, key) {
    if (!ev) return false;
    if (key === 'small') return ev.special === 'small';
    if (key === 'flower') return ev.special === 'flower';
    if (key === 'niuniu') return ev.special == null && ev.niu === 10;
    if (key === 'niu79') return ev.special == null && ev.niu >= 7 && ev.niu <= 9;
    if (key === 'niu06') return ev.special == null && ev.niu >= 0 && ev.niu <= 6;
    return false;
  }

  /** 牌型副注：只认赢方牌型（斗牛无和局） */
  function sideBetHit(key, bt, pt, result) {
    if (result === 'banker') return handHitsSide(bt, key);
    if (result === 'player') return handHitsSide(pt, key);
    return false;
  }

  /* ---------- 下注注单日志（供“下注记录”页 /bets?game=douniu 读取） ---------- */
  var PLAY_LABELS = {
    banker: '庄', player: '闲',
    small: '小牛牛', niuniu: '牛牛', niu79: '牛7-牛9',
    niu06: '无牛-牛6', flower: '五花牛'
  };
  var currentBetIssue = '';
  var lastSettledRoundNo = '';
  var roundNoLabel = document.getElementById('roundNoLabel');

  function setRoundNoLabel(no) {
    /* 顶栏短显当日序号；下注/验算仍用完整 roundNo */
    var full = no ? String(no) : '';
    var m = full.match(/^[A-Z]{2,4}\d{8}-(\d{1,6})$/i);
    var text = m ? ('0000' + m[1]).slice(-4) : (full || '—');
    if (roundNoLabel) roundNoLabel.textContent = text;
  }

  function pad3(n) { return n < 10 ? '00' + n : (n < 100 ? '0' + n : '' + n); }
  function ymd() {
    var d = new Date();
    return '' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  }
  function nextBetIssue() {
    var day = ymd();
    var rec = null;
    try { rec = JSON.parse(localStorage.getItem('dn_issue') || 'null'); } catch (e) { rec = null; }
    if (!rec || rec.day !== day) rec = { day: day, seq: 0 };
    rec.seq += 1;
    try { localStorage.setItem('dn_issue', JSON.stringify(rec)); } catch (e) { /* ignore */ }
    return day + '-' + pad3(rec.seq);
  }
  function betLogUid() { return (user && user.uid) ? user.uid : '100000001'; }
  function betLogKey() { return 'dn_bet_log_' + betLogUid(); }
  function loadBetLog() {
    try { return JSON.parse(localStorage.getItem(betLogKey())) || []; } catch (e) { return []; }
  }
  function saveBetLog(list) {
    try { localStorage.setItem(betLogKey(), JSON.stringify(list.slice(0, 120))); } catch (e) { /* ignore */ }
    try { window.dispatchEvent(new CustomEvent('dn-bet-log-updated')); } catch (e) { /* ignore */ }
  }
  function findBetGroup(log, issue) {
    for (var i = 0; i < log.length; i++) { if (log[i].issue === issue) return log[i]; }
    return null;
  }
  function appendBetLog(playKey, amount) {
    if (!currentBetIssue) currentBetIssue = nextBetIssue();
    var log = loadBetLog();
    var group = findBetGroup(log, currentBetIssue);
    if (!group) {
      group = {
        game: 'douniu', issue: currentBetIssue, createdAt: new Date().toISOString(),
        settled: false, bets: [], totalAmount: 0, totalProfit: 0
      };
      log.unshift(group);
    }
    group.bets.push({
      play: PLAY_LABELS[playKey] || playKey, key: playKey,
      amount: amount, status: 'PENDING', profit: 0, winAmount: 0, hit: ''
    });
    group.totalAmount += amount;
    saveBetLog(log);
  }
  function settleBetLog(issue, result, bankerCards, playerCards) {
    if (!issue) return;
    var log = loadBetLog();
    var group = findBetGroup(log, issue);
    if (!group || group.settled) return;
    var bt = evalHand(bankerCards);
    var pt = evalHand(playerCards);
    var resName = result === 'player' ? '闲赢' : '庄赢';
    group.drawSummary = '庄 ' + bt.label + ' · 闲 ' + pt.label + ' · ' + resName;
    var totalProfit = 0;
    for (var i = 0; i < group.bets.length; i++) {
      var b = group.bets[i];
      var key = b.key;
      var odds = BET_ODDS[key];
      var win = false;
      if (key === 'banker') win = result === 'banker';
      else if (key === 'player') win = result === 'player';
      else win = sideBetHit(key, bt, pt, result);
      var ret = win ? payoutFor(b.amount, key, odds) : 0;
      b.winAmount = ret;
      b.profit = ret - b.amount;
      if (win) { b.status = 'WON'; b.hit = (PLAY_LABELS[key] || '') + ' 中'; }
      else { b.status = 'LOST'; b.hit = ''; }
      totalProfit += b.profit;
    }
    group.settled = true;
    group.settledAt = new Date().toISOString();
    group.totalProfit = totalProfit;
    saveBetLog(log);
  }

  function calcSettlement(result, bankerCards, playerCards) {
    var bt = evalHand(bankerCards);
    var pt = evalHand(playerCards);
    var stakeTotal = 0;
    var returnTotal = 0;
    var keys = Object.keys(betTotals);
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var stake = betTotals[key] || 0;
      if (stake <= 0) continue;
      stakeTotal += stake;
      var odds = BET_ODDS[key];
      if (typeof odds !== 'number') continue;
      var win = false;
      if (key === 'banker') win = result === 'banker';
      else if (key === 'player') win = result === 'player';
      else win = sideBetHit(key, bt, pt, result);
      if (win) returnTotal += payoutFor(stake, key, odds);
    }
    return {
      stakeTotal: stakeTotal,
      returnTotal: returnTotal,
      profit: returnTotal - stakeTotal
    };
  }

  function flyChipAbs(srcRect, dstRect, srcUrl, duration, endScale) {
    return new Promise(function (resolve) {
      var size = Math.max(12, Math.min(srcRect.width, srcRect.height));
      var startX = srcRect.cx - size / 2;
      var startY = srcRect.cy - size / 2;
      var endSize = size * (endScale || 1);
      var endX = dstRect.cx - endSize / 2;
      var endY = dstRect.cy - endSize / 2;
      var fly = document.createElement('div');
      fly.className = 'dn-fly-chip dn-fly-chip--payout';
      fly.style.width = size + 'px';
      fly.style.height = size + 'px';
      fly.style.left = startX + 'px';
      fly.style.top = startY + 'px';
      fly.style.transitionDuration = duration + 'ms';
      fly.style.setProperty('--fly-x', (endX - startX) + 'px');
      fly.style.setProperty('--fly-y', (endY - startY) + 'px');
      fly.style.setProperty('--fly-scale', String(endScale || 1));
      fly.innerHTML = '<img src="' + srcUrl + '" alt="" draggable="false">';
      payoutFlyLayer.appendChild(fly);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          fly.classList.add('is-flying');
        });
      });
      setTimeout(function () {
        fly.remove();
        resolve();
      }, duration);
    });
  }

  function showScorePop(amount) {
    if (!amount) return;
    var target = document.getElementById('statBalance');
    var host = document.querySelector('.dn-head') || document.body;
    if (!target || !host) return;
    var tr = target.getBoundingClientRect();
    var hr = host.getBoundingClientRect();
    var pop = document.createElement('div');
    pop.className = 'dn-score-pop';
    pop.textContent = (amount > 0 ? '+' : '') + amount.toLocaleString('en-US');
    /* 挂在顶栏内，向下飘，避免被 overflow 裁掉 */
    pop.style.left = (tr.left + tr.width / 2 - hr.left) + 'px';
    pop.style.top = (tr.bottom - hr.top + 2) + 'px';
    host.appendChild(pop);
    setTimeout(function () { pop.remove(); }, 1450);
  }

  function applySettlement(settlement) {
    if (!settlement) return;
    /* 真派彩已由大脑完成；本地只更新展示统计 */
    if (!user) return;
    var st = getStats(user.uid);
    st.turnover = (st.turnover || 0) + (settlement.stakeTotal || 0);
    st.winloss = (st.winloss || 0) + (settlement.profit || 0);
    st.rebate = (st.rebate || 0) + ((window.App && App.calcRebate) ? App.calcRebate(settlement.stakeTotal || 0) : 0);
    try {
      localStorage.setItem('dn_stats_' + user.uid, JSON.stringify(st));
    } catch (e) { /* ignore */ }
    refreshStats();
    if (window.App && App.refreshBalance) {
      App.refreshBalance().then(function () { refreshStats(); });
    }
    if (settlement.returnTotal > 0) showScorePop(settlement.returnTotal);
  }

  function betBtn(key) {
    return betArea.querySelector('.dn-bet-btn[data-bet="' + key + '"]');
  }

  function chipsOn(key) {
    var btn = betBtn(key);
    if (!btn) return [];
    return Array.prototype.slice.call(btn.querySelectorAll('.dn-bet-btn__chips img'));
  }

  function getWinLoseKeys(result) {
    var bt = lastHands ? evalHand(lastHands.banker) : { type: '' };
    var pt = lastHands ? evalHand(lastHands.player) : { type: '' };
    var all = ['banker', 'player', 'small', 'niuniu', 'niu79', 'niu06', 'flower'];
    var win = [];
    var lose = [];
    /* 主胜区始终作为飞入目标（即使该区暂无筹码） */
    if (result === 'banker') win.push('banker');
    else if (result === 'player') win.push('player');
    for (var i = 0; i < all.length; i++) {
      var k = all[i];
      var has = chipsOn(k).length > 0;
      var isWin = false;
      if (k === 'banker') isWin = result === 'banker';
      else if (k === 'player') isWin = result === 'player';
      else isWin = sideBetHit(k, bt, pt, result);
      if (isWin) {
        if (win.indexOf(k) < 0 && (has || k === 'banker' || k === 'player')) win.push(k);
      } else if (has) {
        lose.push(k);
      }
    }
    return { win: win, lose: lose };
  }

  function clearWinBetHighlight() {
    var btns = document.querySelectorAll('.dn-bet-btn.is-win');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('is-win');
  }

  /* 比牌后点亮所有中奖下注区边框（不限是否有人下注） */
  function highlightWinBets(result, bankerEval, playerEval) {
    clearWinBetHighlight();
    var bt = bankerEval || (lastHands ? evalHand(lastHands.banker) : null);
    var pt = playerEval || (lastHands ? evalHand(lastHands.player) : null);
    var keys = [];
    if (result === 'banker') keys.push('banker');
    else if (result === 'player') keys.push('player');
    var sides = ['small', 'niuniu', 'niu79', 'niu06', 'flower'];
    for (var i = 0; i < sides.length; i++) {
      if (sideBetHit(sides[i], bt, pt, result)) keys.push(sides[i]);
    }
    for (var j = 0; j < keys.length; j++) {
      var btn = betBtn(keys[j]);
      if (btn) btn.classList.add('is-win');
    }
  }

  function clearBetVisual(key) {
    var btn = betBtn(key);
    if (!btn) return;
    var box = btn.querySelector('.dn-bet-btn__chips');
    if (box) box.innerHTML = '';
  }

  function collectPayout(result, settlement) {
    return new Promise(function (resolve) {
      stopOtherBetting();
      /* 庄赢/闲赢/和已在比牌时报过，这里播飞筹结算音 */
      if (settlement && settlement.returnTotal > 0) sfx('payout', { vol: 0.65 });
      else if (settlement && settlement.stakeTotal > 0) sfx('result-lose', { vol: 0.55 });
      if (!payoutFlyLayer) {
        applySettlement(settlement);
        resolve();
        return;
      }
      payoutFlyLayer.innerHTML = '';

      var scoreEl = document.getElementById('statBalance') || statsBar;
      var playersIcon = document.querySelector('.dn-players__icon') || document.getElementById('playersBox');
      var scoreRect = scoreEl ? layerRect(scoreEl) : null;
      var playersRect = playersIcon ? layerRect(playersIcon) : null;
      var landSize = barChipSize() * CHIP_LAND_SCALE;
      var wl = getWinLoseKeys(result);
      var winKeys = wl.win;
      var loseKeys = wl.lose;

      /* 收集输方筹码（保留归属） */
      var moving = [];
      for (var li = 0; li < loseKeys.length; li++) {
        var limgs = chipsOn(loseKeys[li]);
        for (var j = 0; j < limgs.length; j++) {
          moving.push({
            img: limgs[j],
            owner: limgs[j].getAttribute('data-owner') || 'other',
            value: parseInt(limgs[j].getAttribute('data-value'), 10) || 1,
            src: limgs[j].getAttribute('src') || CHIP_SRC[1]
          });
        }
      }

      var phase1 = [];
      if (moving.length && winKeys.length) {
        for (var mi = 0; mi < moving.length; mi++) {
          (function (chip, idx) {
            var targetKey = winKeys[idx % winKeys.length];
            var winBtn = betBtn(targetKey);
            if (!winBtn) return;
            var winBox = winBtn.querySelector('.dn-bet-btn__chips') || winBtn;
            var winArea = layerRect(winBox);
            var src = layerRect(chip.img);
            var jx = (Math.random() - 0.5) * winArea.width * 0.55;
            var jy = (Math.random() - 0.5) * winArea.height * 0.45;
            var dst = { cx: winArea.cx + jx, cy: winArea.cy + jy, width: landSize, height: landSize };
            var slot = pickSlot(targetKey);
            phase1.push(delay(idx * 35).then(function () {
              chip.img.style.opacity = '0';
              return flyChipAbs(
                src, dst, chip.src, COLLECT_MS,
                landSize / Math.max(12, Math.min(src.width, src.height) || landSize)
              ).then(function () {
                /* 收来的筹码：自己在该赢区有注→算自己赢的；否则归他人→飞人数 */
                var potOwner = (betTotals[targetKey] || 0) > 0 ? 'me' : 'other';
                placeChipOnBtn(winBtn, chip.value, slot, landSize, potOwner);
              });
            }));
          })(moving[mi], mi);
        }
      } else if (moving.length && playersRect) {
        /* 无赢方：全部飞回人数图标消失 */
        for (var oi = 0; oi < moving.length; oi++) {
          (function (chip, idx) {
            var src = layerRect(chip.img);
            phase1.push(delay(idx * 30).then(function () {
              chip.img.style.opacity = '0';
              return flyChipAbs(src, playersRect, chip.src, TO_SCORE_MS, 0.35);
            }));
          })(moving[oi], oi);
        }
      }

      Promise.all(phase1).then(function () {
        for (var c = 0; c < loseKeys.length; c++) clearBetVisual(loseKeys[c]);

        /* 赢方区：自己的→积分，别人的→人数图标 */
        var meList = [];
        var otherList = [];
        for (var w = 0; w < winKeys.length; w++) {
          var wimgs = chipsOn(winKeys[w]);
          for (var n = 0; n < wimgs.length; n++) {
            if ((wimgs[n].getAttribute('data-owner') || 'other') === 'me') meList.push(wimgs[n]);
            else otherList.push(wimgs[n]);
          }
        }

        function trimList(arr, maxN) {
          if (arr.length <= maxN) return arr;
          var step = Math.ceil(arr.length / maxN);
          return arr.filter(function (_, i) { return i % step === 0; }).slice(0, maxN);
        }
        meList = trimList(meList, 12);
        otherList = trimList(otherList, 12);

        var phase2 = [];
        meList.forEach(function (img, idx) {
          if (!scoreRect) return;
          phase2.push(delay(idx * 38).then(function () {
            var src = layerRect(img);
            var srcUrl = img.getAttribute('src') || CHIP_SRC[1];
            img.style.opacity = '0';
            return flyChipAbs(src, scoreRect, srcUrl, TO_SCORE_MS, 0.42);
          }));
        });
        otherList.forEach(function (img, idx) {
          if (!playersRect) return;
          phase2.push(delay(idx * 38).then(function () {
            var src = layerRect(img);
            var srcUrl = img.getAttribute('src') || CHIP_SRC[1];
            img.style.opacity = '0';
            return flyChipAbs(src, playersRect, srcUrl, TO_SCORE_MS, 0.35);
          }));
        });

        return Promise.all(phase2).then(function () {
          /* 清空桌面筹码视觉，结算只计自己 */
          var allKeys = ['banker', 'player', 'small', 'niuniu', 'niu79', 'niu06', 'flower'];
          for (var a = 0; a < allKeys.length; a++) clearBetVisual(allKeys[a]);
          if (settlement && settlement.returnTotal > 0) sfx('win', { vol: 0.85 });
          applySettlement(settlement);
          resolve();
        });
      }).catch(function () {
        applySettlement(settlement);
        resolve();
      });
    });
  }

  var roomEl = document.querySelector('.dn-room');

  function paint(doBeat) {
    box.classList.remove('is-urgent', 'is-critical', 'is-draw', 'is-payout');
    timeEl.classList.remove('is-beat');

  var bannerStartImg = document.getElementById('phaseBannerStart');
  var bannerStopImg = document.getElementById('phaseBannerStop');
  if (window.TableShell && TableShell.warmBannerImages) {
    TableShell.warmBannerImages([bannerStartImg, bannerStopImg]);
  }

  /** 立刻收掉横幅（进维护、异常复位时用），不走淡出动画 */
  function hidePhaseBanner() {
    var box = document.getElementById('phaseBanner');
    if (!box) return;
    if (box._bannerTimer) { clearTimeout(box._bannerTimer); box._bannerTimer = null; }
    if (box._bannerHideTimer) { clearTimeout(box._bannerHideTimer); box._bannerHideTimer = null; }
    box.classList.remove('is-show', 'is-hide');
    box.setAttribute('aria-hidden', 'true');
    if (bannerStartImg) bannerStartImg.hidden = true;
    if (bannerStopImg) bannerStopImg.hidden = true;
  }

  /**
   * 两张横幅图各自常驻一个 <img>，这里只切换哪个可见，绝不改 src。
   * 改 src 是异步的，新图解码完成前元素还在画上一张，会出现「报开始下注、显示停止下注」。
   */
  function showPhaseBanner(kind) {
    var box = document.getElementById('phaseBanner');
    if (!box || !bannerStartImg || !bannerStopImg) return Promise.resolve();
    var isStop = kind === 'stop';
    if (box._bannerTimer) {
      clearTimeout(box._bannerTimer);
      box._bannerTimer = null;
    }
    if (box._bannerHideTimer) {
      clearTimeout(box._bannerHideTimer);
      box._bannerHideTimer = null;
    }
    bannerStartImg.hidden = isStop;
    bannerStopImg.hidden = !isStop;
    box.classList.remove('is-show', 'is-hide');
    void box.offsetWidth;
    box.classList.add('is-show');
    box.setAttribute('aria-hidden', 'false');
    /*
     * 两句都走 voice 通道：playVoice 会先掐掉上一句，正好把上一局没播完的报牌尾音
     * 收干净。走 sfx 通道的话两路各播各的，会和报点数叠在一起。
     * 停止下注另配一声提示音（stop-bet），跟龙虎/百家乐一致。
     */
    if (isStop) {
      sfx('stop-bet', { vol: 0.95, dedupeMs: 800 });
      if (!document.hidden) playVoice('voice/stop-bet');
    } else {
      playVoice('voice/start-bet');
    }
    /*
     * 停止下注固定 BANNER_MS：发牌基准就锚在它后面，改了会把整条开奖时间轴一起挪。
     * 开始下注不参与时间轴，让图标至少留到语音说完（本游戏这句 2.2 秒，比横幅长）。
     */
    var holdMs = isStop
      ? BANNER_MS
      : Math.max(BANNER_MS, VOICE_MS['voice/start-bet'] || 0);
    return new Promise(function (resolve) {
      box._bannerTimer = setTimeout(function () {
        box.classList.remove('is-show');
        box.classList.add('is-hide');
        box._bannerHideTimer = setTimeout(function () {
          box.classList.remove('is-hide');
          box.setAttribute('aria-hidden', 'true');
          box._bannerTimer = null;
          box._bannerHideTimer = null;
        }, 340);
        resolve();
      }, holdMs);
    });
  }

  /* ───────── 单一驱动：换局只由时间基准触发 ───────── */

  /** 当前这一局的绝对起点（服务端钟）；靠它识别换局，不靠倒计时归零 */
  var curRoundStartAt = 0;

  /**
   * 本局局号。服务端给的那个必须确认属于当前这一局才用，
   * 否则迟到的快照会把上一局号带进来。
   */
  function roundNoAt(pos) {
    var rn = (serverClock && serverClock.roundNo) ? String(serverClock.roundNo) : '';
    if (!rn) return '';
    if (window.TableShell && TableShell.roundStartAtOf) {
      var startAt = TableShell.roundStartAtOf(rn, pos.cycleMs);
      if (startAt != null && startAt !== pos.startAt) return '';
    }
    return rn;
  }

  /**
   * 进入新的一局。
   *
   * 这是整局唯一的复位入口：以前下注开始有三条路能进（本地倒计时、快照轮询、
   * 切回前台），三方各按各的时间判断，网络一抖就互相打架。现在只认时间基准。
   */
  function enterRound(pos) {
    curRoundStartAt = pos.startAt;
    roundSeq += 1;
    drawClock = null;
    roundBusy = false;
    phase = 'bet';
    payoutLeft = 0;
    payoutDeadline = 0;
    lastBeatSec = -1;
    currentBetIssue = roundNoAt(pos);
    try { flyLayer.innerHTML = ''; } catch (eFly) { /* ignore */ }
    hideAllCards();
    clearWinBetHighlight();
    /* 同局刷新保留 session 假筹缓存；换局才清空 */
    var keepPersist = !!(currentBetIssue && peekPersistedChipRound() === currentBetIssue);
    commitRoundBets({ keepPersist: keepPersist });
    if (currentBetIssue) {
      setRoundNoLabel(currentBetIssue);
      ensureChipsHydrated(currentBetIssue);
    }
    ensureBgm(true);
    syncActionButtons();
    if (pos.phase === 'BETTING') {
      startOtherBetting();
      /*
       * 只有真从头开始下注才弹「开始下注」：中途进房、切回前台不该看到这块牌子。
       * 这一局是刚开始还是进行中，由时间基准直接给出，不需要再猜。
       */
      if (pos.tIn < 1200) showPhaseBanner('start');
    }
  }

  /** 下注期每帧刷新：倒计时纯粹是「服务端还剩多少」的显示 */
  function runBetting(pos) {
    if (phase !== 'bet') {
      phase = 'bet';
      roundBusy = false;
      syncActionButtons();
    }
    left = Math.max(0, Math.ceil(pos.betLeftMs / 1000));
    var doBeat = left !== lastBeatSec;
    if (doBeat) lastBeatSec = left;
    paint(doBeat);
  }

  /* ---------- 开奖时间轴：墙上时钟 seek（刷新/进注单按服务端进度对齐） ---------- */
  var drawClock = null;

  function dealAnimTotalMs() {
    var n = DEAL_ORDER.length;
    return n * FLY_MS + Math.max(0, n - 1) * GAP_MS;
  }
  function flipAnimTotalMs() {
    var n = DEAL_ORDER.length;
    return n * FLIP_MS + Math.max(0, n - 1) * FLIP_GAP_MS;
  }
  function sideMakeTenMs(ev, cards) {
    if (!ev || !ev.tenIdx || ev.tenIdx.length !== 3 || !cards || cards.length !== 5) return 40;
    var tenSum = cards[ev.tenIdx[0]].niuVal + cards[ev.tenIdx[1]].niuVal + cards[ev.tenIdx[2]].niuVal;
    return (tenSum % 10 === 0) ? SPLIT_MS : 40;
  }
  function handVoiceMs(ev) {
    var key = handVoiceKey(ev);
    if (!key) return 200;
    return (VOICE_MS[key] || 1400) + 400;
  }
  function makeTenPhaseMs(bt, pt, banker, player) {
    return sideMakeTenMs(bt, banker) + handVoiceMs(bt) + sideMakeTenMs(pt, player) + handVoiceMs(pt);
  }
  function voiceAnimTotalMs(bt, pt, result, banker, player) {
    var rk = result === 'player' ? 'voice/player-win' : 'voice/banker-win';
    return makeTenPhaseMs(bt, pt, banker, player) + (VOICE_MS[rk] || 1700) + 400;
  }

  function drawElapsedMsFromSnap(snap) {
    if (!snap) return 0;
    var drawMs = (snap.timing && snap.timing.drawMs) || DRAW_EST_SEC * 1000;
    var settleMs = (snap.timing && snap.timing.settleMs) || PAYOUT_SECS * 1000;
    var leftMs = Math.max(0, (Number(snap.secondsLeft) || 0) * 1000);
    if (snap.phase === 'DRAWING') return Math.max(0, drawMs - leftMs);
    if (snap.phase === 'SETTLED') return drawMs + Math.max(0, settleMs - leftMs);
    return 0;
  }

  var BET_CHIP_KEYS = ['banker', 'player', 'small', 'niuniu', 'niu79', 'niu06', 'flower'];
  var CHIP_CACHE_KEY = 'dn_table_chips_v1';
  var chipsHydratedRound = '';
  var chipsHydratePromise = Promise.resolve();
  var persistChipsTimer = null;
  var restoringChips = false;

  function peekPersistedChipRound() {
    try {
      var data = JSON.parse(sessionStorage.getItem(CHIP_CACHE_KEY) || 'null');
      return data && data.roundNo ? String(data.roundNo) : '';
    } catch (ePeek) {
      return '';
    }
  }

  function tableHasChipVisuals() {
    for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
      if (chipsOn(BET_CHIP_KEYS[i]).length) return true;
    }
    return false;
  }

  function currentChipRoundNo() {
    if (drawClock && drawClock.roundNo) return String(drawClock.roundNo);
    if (currentBetIssue) return String(currentBetIssue);
    if (serverClock && serverClock.roundNo) return String(serverClock.roundNo);
    return '';
  }

  function persistTableChips(forceRound) {
    var rn = forceRound ? String(forceRound) : currentChipRoundNo();
    if (!rn) return;
    var chips = [];
    for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
      var key = BET_CHIP_KEYS[i];
      var imgs = chipsOn(key);
      for (var j = 0; j < imgs.length; j++) {
        var img = imgs[j];
        chips.push({
          key: key,
          value: parseInt(img.getAttribute('data-value'), 10) || 1,
          owner: img.getAttribute('data-owner') || 'other',
          x: parseFloat(img.style.getPropertyValue('--chip-x')) || 50,
          y: parseFloat(img.style.getPropertyValue('--chip-y')) || 50,
          w: parseFloat(img.style.getPropertyValue('--chip-w')) || 24,
          z: parseInt(img.style.getPropertyValue('--chip-z'), 10) || 10
        });
      }
    }
    try {
      sessionStorage.setItem(
        CHIP_CACHE_KEY,
        JSON.stringify({ roundNo: rn, chips: chips, at: Date.now() })
      );
    } catch (ePer) { /* ignore quota */ }
  }

  function schedulePersistTableChips() {
    if (persistChipsTimer) clearTimeout(persistChipsTimer);
    persistChipsTimer = setTimeout(function () {
      persistChipsTimer = null;
      persistTableChips();
    }, 80);
  }

  function clearPersistedTableChips() {
    try { sessionStorage.removeItem(CHIP_CACHE_KEY); } catch (eClr) { /* ignore */ }
  }

  function restorePersistedTableChips(roundNo) {
    var rn = roundNo ? String(roundNo) : '';
    if (!rn) return false;
    var data = null;
    try {
      data = JSON.parse(sessionStorage.getItem(CHIP_CACHE_KEY) || 'null');
    } catch (eParse) {
      return false;
    }
    if (!data || String(data.roundNo) !== rn || !data.chips || !data.chips.length) return false;
    var landSize = hydrateLandSize();
    restoringChips = true;
    try {
      for (var c = 0; c < BET_CHIP_KEYS.length; c++) clearBetVisual(BET_CHIP_KEYS[c]);
      for (var i = 0; i < data.chips.length; i++) {
        var item = data.chips[i];
        var btn = betBtn(item.key);
        if (!btn) continue;
        var slot = {
          x: Number(item.x) || 50,
          y: Number(item.y) || 50,
          layer: Math.max(0, (Number(item.z) || 10) - 10)
        };
        var w = Number(item.w) || landSize;
        placeChipOnBtn(btn, item.value, slot, Math.max(22, w), item.owner || 'other');
      }
      chipsHydratedRound = rn;
    } finally {
      restoringChips = false;
    }
    return true;
  }

  function summaryAmount(summary, key) {
    if (!summary) return 0;
    var want = String(key || '').toLowerCase();
    var total = 0;
    var keys = Object.keys(summary);
    for (var i = 0; i < keys.length; i++) {
      if (String(keys[i]).toLowerCase() === want) {
        total += Math.floor(Number(summary[keys[i]]) || 0);
      }
    }
    return Math.max(0, total);
  }

  function splitAmountToChips(amount) {
    var left = Math.max(0, Math.floor(Number(amount) || 0));
    if (left <= 0) return [];
    var dens = [2000, 1000, 500, 100, 50, 10, 5, 1];
    var out = [];
    for (var i = 0; i < dens.length; i++) {
      while (left >= dens[i] && out.length < 20) {
        out.push(dens[i]);
        left -= dens[i];
      }
    }
    if (!out.length) out.push(1);
    return out;
  }

  function hydrateLandSize() {
    var scale = typeof CHIP_LAND_SCALE === 'number' ? CHIP_LAND_SCALE : 2 / 3;
    var raw = 48;
    try {
      if (typeof barChipSize === 'function') raw = barChipSize() || 48;
    } catch (eSz) { /* ignore */ }
    return Math.max(22, raw * scale);
  }

  function paintChipsForSide(key, mineAmt, otherAmt) {
    var btn = betBtn(key);
    if (!btn) return;
    clearBetVisual(key);
    var landSize = hydrateLandSize();
    function placeList(list, owner) {
      if (!list.length) return;
      var maxN = 8;
      var step = list.length > maxN ? Math.ceil(list.length / maxN) : 1;
      var placed = 0;
      for (var i = 0; i < list.length && placed < maxN; i += step) {
        placeChipOnBtn(btn, list[i], pickSlot(key), landSize, owner);
        placed += 1;
      }
    }
    placeList(splitAmountToChips(otherAmt), 'other');
    placeList(splitAmountToChips(mineAmt), 'me');
    betTotals[key] = Math.max(0, Math.floor(Number(mineAmt) || 0));
    updateStakeUI(btn, betTotals[key]);
  }

  function fetchMineBySide(rn) {
    if (!window.App || !App.fetchMyTableBets || !rn) return Promise.resolve({});
    return App.fetchMyTableBets(SERVER_GAME, rn)
      .then(function (mine) {
        var map = {};
        var bets = (mine && mine.bets) || [];
        for (var b = 0; b < bets.length; b++) {
          var side = String(bets[b].betType || '').toLowerCase();
          if (!side) continue;
          map[side] = (map[side] || 0) + Math.floor(Number(bets[b].amount) || 0);
        }
        return map;
      })
      .catch(function () {
        return {};
      });
  }

  function applyMineTotals(mineBySide) {
    mineBySide = mineBySide || {};
    roundPlacements = [];
    for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
      var key = BET_CHIP_KEYS[i];
      var mine = Math.max(0, Math.floor(Number(mineBySide[key]) || 0));
      betTotals[key] = mine;
      if (mine > 0) roundPlacements.push({ key: key, value: mine });
      var btn = betBtn(key);
      if (btn) updateStakeUI(btn, mine);
    }
  }

  function hydrateTableChips(snap) {
    var rn = snap && snap.roundNo ? String(snap.roundNo) : '';
    if (rn && chipsHydratedRound === rn && tableHasChipVisuals()) {
      return Promise.resolve();
    }
    var summary = (snap && snap.betSummary) || {};

    if (rn && restorePersistedTableChips(rn)) {
      chipsHydratePromise = fetchMineBySide(rn).then(function (mineBySide) {
        applyMineTotals(mineBySide);
        schedulePersistTableChips();
      });
      return chipsHydratePromise;
    }

    function applyMineMap(mineBySide) {
      mineBySide = mineBySide || {};
      roundPlacements = [];
      var any = false;
      for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
        var key = BET_CHIP_KEYS[i];
        var total = summaryAmount(summary, key);
        var mine = Math.max(0, Math.floor(Number(mineBySide[key]) || 0));
        if (mine > total) total = mine;
        var other = Math.max(0, total - mine);
        if (mine > 0) roundPlacements.push({ key: key, value: mine });
        if (total <= 0) {
          clearBetVisual(key);
          betTotals[key] = 0;
          var emptyBtn = betBtn(key);
          if (emptyBtn) updateStakeUI(emptyBtn, 0);
          continue;
        }
        any = true;
        paintChipsForSide(key, mine, other);
      }
      if (any || roundPlacements.length) chipsHydratedRound = rn || chipsHydratedRound;
      if (tableHasChipVisuals()) schedulePersistTableChips();
    }

    chipsHydratePromise = fetchMineBySide(rn).then(applyMineMap);
    return chipsHydratePromise;
  }

  function ensureChipsHydrated(roundNo, snap) {
    var rn = roundNo ? String(roundNo) : '';
    if (rn && chipsHydratedRound === rn && tableHasChipVisuals()) {
      return Promise.resolve();
    }
    if (snap) return hydrateTableChips(snap);
    if (window.App && App.fetchTableSnapshot) {
      return App.fetchTableSnapshot(SERVER_GAME).then(function (s) {
        if (s) applyServerSnap(s);
        return hydrateTableChips(s || { roundNo: rn, betSummary: {} });
      });
    }
    return hydrateTableChips({ roundNo: rn, betSummary: {} });
  }

  function normalizeDnCards(list) {
    return (list || []).slice(0, 5).map(function (c) {
      return (c && c.niuVal != null) ? c : makeCard(c.suit, c.rank);
    });
  }

  function bindDrawOutcome(snap) {
    if (!drawClock || !snap || !snap.outcome) return false;
    if (drawClock.outcome) return true;
    var rn = snap.roundNo ? String(snap.roundNo) : drawClock.roundNo;
    if (rn) {
      drawClock.roundNo = rn;
      currentBetIssue = rn;
      setRoundNoLabel(rn);
    }
    var forced = snap.outcome;
    var banker = normalizeDnCards(forced.banker);
    var player = normalizeDnCards(forced.player);
    if (banker.length < 5 || player.length < 5) return false;
    drawClock.outcome = forced;
    drawClock.hands = { banker: banker, player: player };
    lastHands = drawClock.hands;
    roundCards = {
      b1: banker[0], b2: banker[1], b3: banker[2], b4: banker[3], b5: banker[4],
      p1: player[0], p2: player[1], p3: player[2], p4: player[3], p5: player[4]
    };
    for (var i = 0; i < DEAL_ORDER.length; i++) {
      setSlotFace(DEAL_ORDER[i], roundCards[DEAL_ORDER[i]]);
    }
    if (!drawClock.dealBaseAt) {
      drawClock.dealBaseAt = drawClock.anchorAt + BANNER_MS;
    }
    return true;
  }

  function applyMakeTenSplitNow(prefix, cards, ev) {
    var hand = prefix === 'b' ? bankerHand : playerHand;
    if (!hand) return;
    hand.classList.remove('is-split');
    for (var c = 0; c < 5; c++) {
      var clearSlot = room.querySelector('.dn-card[data-slot="' + prefix + (c + 1) + '"]');
      if (clearSlot) clearSlot.removeAttribute('data-group');
    }
    if (!ev || !ev.tenIdx || ev.tenIdx.length !== 3 || !cards || cards.length !== 5) return;
    var tenSum = cards[ev.tenIdx[0]].niuVal + cards[ev.tenIdx[1]].niuVal + cards[ev.tenIdx[2]].niuVal;
    if (tenSum % 10 !== 0) return;
    var ordered = [];
    var used = {};
    for (var t = 0; t < 3; t++) {
      used[ev.tenIdx[t]] = true;
      ordered.push(cards[ev.tenIdx[t]]);
    }
    for (var r = 0; r < 5; r++) {
      if (!used[r]) ordered.push(cards[r]);
    }
    for (var i = 0; i < 5; i++) {
      var sid = prefix + (i + 1);
      if (roundCards) roundCards[sid] = ordered[i];
      setSlotFace(sid, ordered[i]);
      var slot = room.querySelector('.dn-card[data-slot="' + sid + '"]');
      if (slot) slot.setAttribute('data-group', i < 3 ? 'ten' : 'niu');
    }
    void hand.offsetWidth;
    hand.classList.add('is-split');
  }

  function syncDealFlipByClock(t, jumping) {
    if (!drawClock || !drawClock.hands) return;
    var step = FLY_MS + GAP_MS;
    var i, id, slot, start;
    var layoutOk = true;
    try {
      var shoeR = shoe.getBoundingClientRect();
      if (shoeR.width < 2 || shoeR.height < 2) layoutOk = false;
    } catch (eLay) { layoutOk = false; }
    var instant = jumping || !layoutOk || document.hidden;
    for (i = 0; i < DEAL_ORDER.length; i++) {
      id = DEAL_ORDER[i];
      slot = room.querySelector('.dn-card[data-slot="' + id + '"]');
      if (!slot) continue;
      start = i * step;
      if (t < start) {
        slot.classList.remove('is-dealt', 'is-flipped');
        continue;
      }
      if (instant || t >= start + FLY_MS || drawClock.dealStarted[id] === 'done') {
        slot.classList.add('is-dealt');
        if (t < dealAnimTotalMs() + DEAL_HOLD_MS) slot.classList.remove('is-flipped');
        drawClock.dealStarted[id] = 'done';
      } else if (!drawClock.dealStarted[id]) {
        drawClock.dealStarted[id] = 'flying';
        (function (sid) {
          flyOne(sid).then(function () {
            if (drawClock) drawClock.dealStarted[sid] = 'done';
          });
        })(id);
      }
    }
    if (t >= dealAnimTotalMs()) {
      try { flyLayer.innerHTML = ''; } catch (e1) { /* ignore */ }
    }

    var holdEnd = dealAnimTotalMs() + DEAL_HOLD_MS;
    if (t < holdEnd) return;
    var fstep = FLIP_MS + FLIP_GAP_MS;
    for (i = 0; i < DEAL_ORDER.length; i++) {
      id = DEAL_ORDER[i];
      slot = room.querySelector('.dn-card[data-slot="' + id + '"]');
      if (!slot) continue;
      start = holdEnd + i * fstep;
      slot.classList.add('is-dealt');
      if (t < start) {
        slot.classList.remove('is-flipped');
        continue;
      }
      if (instant || t >= start + FLIP_MS || drawClock.flipStarted[id] === 'done') {
        slot.classList.add('is-flipped');
        drawClock.flipStarted[id] = 'done';
      } else if (!drawClock.flipStarted[id]) {
        drawClock.flipStarted[id] = 'flying';
        (function (sid) {
          flipOne(sid).then(function () {
            if (drawClock) drawClock.flipStarted[sid] = 'done';
          });
        })(id);
      }
    }
  }

  function evalsFromOutcome(hands, outcome) {
    var bt = (outcome && outcome.bankerType && outcome.bankerType.label)
      ? outcome.bankerType
      : evalHand(hands.banker);
    var pt = (outcome && outcome.playerType && outcome.playerType.label)
      ? outcome.playerType
      : evalHand(hands.player);
    return { bankerEval: bt, playerEval: pt };
  }

  function beginDrawPayout(dc, jumping) {
    if (!dc || dc.flags.payout) return;
    dc.flags.payout = true;
    var result = dc.compared ? dc.compared.result : 'banker';
    var hands = dc.hands;
    var settlement = calcSettlement(result, hands.banker, hands.player);
    var roundIssue = dc.roundNo || '';

    function finishBusy() {
      if (window.App && App.refreshBalance) {
        App.refreshBalance().then(function () { refreshStats(); });
      } else if (typeof refreshStats === 'function') {
        refreshStats();
      }
      roundBusy = false;
      paint(false);
    }

    function applyMine() {
      settleBetLog(roundIssue, result, hands.banker, hands.player);
      phase = 'payout';
      var remainPayout = Math.max(0.4, PAYOUT_SECS - 0.05);
      if (jumping) remainPayout = Math.min(Math.max(remainPayout, 2.2), PAYOUT_SECS);
      payoutLeft = Math.ceil(remainPayout);
      payoutDeadline = Date.now() + remainPayout * 1000;
      paint(false);
      syncActionButtons();
      if (document.hidden) {
        for (var a = 0; a < BET_CHIP_KEYS.length; a++) clearBetVisual(BET_CHIP_KEYS[a]);
        applySettlement(settlement);
        finishBusy();
        return Promise.resolve();
      }
      return ensureChipsHydrated(roundIssue).then(function () {
        return new Promise(function (resolve) {
          requestAnimationFrame(function () {
            resolve(collectPayout(result, settlement).then(finishBusy));
          });
        });
      });
    }

    var run = function () {
      if (window.App && App.fetchMyTableBets && roundIssue) {
        return App.fetchMyTableBets(SERVER_GAME, roundIssue).then(function (mine) {
          if (mine && typeof mine.totalPayout === 'number') {
            settlement.returnTotal = Math.floor(mine.totalPayout);
            if (typeof mine.totalStake === 'number') settlement.stakeTotal = mine.totalStake;
            settlement.profit = settlement.returnTotal - settlement.stakeTotal;
          }
          return applyMine();
        }).catch(function () { return applyMine(); });
      }
      return applyMine();
    };
    run().catch(function (err) {
      console.error(err);
      finishBusy();
    });
  }

  function advanceDrawClock() {
    if (!drawClock || drawClock.seq !== roundSeq) return;
    /*
     * 时间一律取服务端的钟。仪式的每一步都是「本局第几毫秒该发生什么」，
     * 所以慢一帧、卡一下、切后台回来，都只是下一帧直接跳到正确位置，
     * 不会像以前那样把整条时间轴往后推。
     */
    var now = (window.TableShell && TableShell.serverNow)
      ? TableShell.serverNow(serverClock)
      : Date.now();
    /* 跳点：主动 seek，或两帧间隔过大（后台/卡顿），此时略过动画直接落位 */
    var jumping = !!drawClock.forceSeek ||
      (!!drawClock.lastAdvAt && (now - drawClock.lastAdvAt) > 420);
    drawClock.forceSeek = false;
    drawClock.lastAdvAt = now;

    if (!drawClock.outcome) {
      paint(false);
      return;
    }

    var t = now - drawClock.dealBaseAt;
    if (t < 0) {
      paint(false);
      return;
    }

    var dealEnd = dealAnimTotalMs();
    var holdEnd = dealEnd + DEAL_HOLD_MS;
    var flipEnd = holdEnd + flipAnimTotalMs();
    syncDealFlipByClock(t, jumping);

    var hands = drawClock.hands;
    var evals = evalsFromOutcome(hands, drawClock.outcome);
    var bt = evals.bankerEval;
    var pt = evals.playerEval;
    var splitBEnd = flipEnd + sideMakeTenMs(bt, hands.banker);
    var voiceBEnd = splitBEnd + handVoiceMs(bt);
    var splitPEnd = voiceBEnd + sideMakeTenMs(pt, hands.player);
    var voicePEnd = splitPEnd + handVoiceMs(pt);
    var makeTenEnd = voicePEnd;

    /*
     * 牌型标签必须跟本家报点数同一刻出现（先拆牌凑十，再「亮牌型 + 报点数」）。
     *
     * 原先庄家标签的条件是 `t >= splitBEnd && !flags.types`，而 flags.types 在
     * t >= flipEnd 就被置真，splitBEnd 又必定晚于 flipEnd，于是这个分支永远进不去：
     * 庄家报了点数却不亮牌型，要等最后 showCompare 才和闲家标签一起冒出来。
     * 闲家则相反，标签比语音早亮一步。
     */
    if (t >= flipEnd && !drawClock.flags.splitB) {
      drawClock.flags.splitB = true;
      applyMakeTenSplitNow('b', hands.banker, bt);
    }
    if (t >= splitBEnd && drawClock.flags.splitB && !drawClock.flags.typesB) {
      drawClock.flags.typesB = true;
      revealTypeLabel(bankerTypeEl, bt.label);
      if (!jumping && !document.hidden) playHandVoice(bt);
    }
    if (t >= voiceBEnd && !drawClock.flags.splitP) {
      drawClock.flags.splitP = true;
      applyMakeTenSplitNow('p', hands.player, pt);
    }
    if (t >= splitPEnd && drawClock.flags.splitP && !drawClock.flags.typesP) {
      drawClock.flags.typesP = true;
      revealTypeLabel(playerTypeEl, pt.label);
      if (!jumping && !document.hidden) playHandVoice(pt);
    }

    if (t >= makeTenEnd && !drawClock.flags.compared) {
      drawClock.compared = showCompare(bt, pt, hands.banker, hands.player, drawClock.outcome);
      lastRoundResult = drawClock.compared.result;
      if (drawClock.roundNo) lastSettledRoundNo = String(drawClock.roundNo);
      drawClock.voiceMs = voiceAnimTotalMs(
        bt, pt, drawClock.compared.result, hands.banker, hands.player
      );
      drawClock.flags.compared = true;
    }

    if (t >= makeTenEnd && drawClock.compared && !drawClock.flags.road) {
      pushRoad(drawClock.compared.result, drawClock.roundNo);
      highlightWinBets(drawClock.compared.result, drawClock.compared.bankerType, drawClock.compared.playerType);
      drawClock.flags.road = true;
    }

    var resultVoiceMs = 0;
    if (drawClock.compared) {
      var rk = drawClock.compared.result === 'player' ? 'voice/player-win' : 'voice/banker-win';
      resultVoiceMs = (VOICE_MS[rk] || 1700) + 400;
    }
    var voiceEnd = makeTenEnd + resultVoiceMs;
    if (t >= makeTenEnd && drawClock.compared && !drawClock.flags.voice) {
      drawClock.flags.voice = true;
      if (!jumping && !document.hidden) {
        announceResult(drawClock.compared.result);
      }
    }

    if (t >= voiceEnd && !drawClock.flags.payout) {
      beginDrawPayout(drawClock, jumping);
    }

    paint(false);
    syncActionButtons();
  }

  /**
   * 建立本局的开奖时间轴。
   *
   * 关键：仪式锚在服务端的开奖起点（开局时刻 + 下注时长），跟客户端什么时候
   * 察觉到封盘完全无关。以前锚的是「本地发现的那一刻」，于是发现得早晚不同，
   * 整段发牌翻牌凑十报牌就整体漂移，跟服务端对不上。
   */
  function ensureDrawClock(pos) {
    if (drawClock && drawClock.startAt === pos.startAt) return;
    stopOtherBetting();
    /* 封盘瞬间落盘（含气氛假筹），开奖中刷新也能还原 */
    persistTableChips(currentBetIssue || currentChipRoundNo());
    roundBusy = true;
    phase = 'draw';
    hideAllCards();
    var drawStartAt = pos.startAt + Number(BETTING_SEC) * 1000;
    drawClock = {
      seq: ++roundSeq,
      startAt: pos.startAt,
      /* 仪式基准：开奖起点之后先亮横幅，再开始发牌 */
      anchorAt: drawStartAt,
      dealBaseAt: drawStartAt + BANNER_MS,
      lastAdvAt: 0,
      roundNo: currentBetIssue || '',
      outcome: null,
      hands: null,
      compared: null,
      voiceMs: 4000,
      dealStarted: {},
      flipStarted: {},
      outcomeAsked: false,
      flags: {
        splitB: false, splitP: false, typesB: false, typesP: false,
        compared: false, road: false, voice: false, payout: false
      }
    };
    /* 刚封盘才亮牌子；中途进来牌都发一半了就别弹 */
    if (pos.drawElapsedMs < BANNER_MS) showPhaseBanner('stop');
    syncActionButtons();
    requestOutcome(drawClock);
  }

  /** 取本局开奖结果。失败不改流程，只是让下一帧重试 */
  function requestOutcome(dc) {
    if (!dc || dc.outcomeAsked) return;
    if (!window.App || !App.waitTableOutcome) return;
    dc.outcomeAsked = true;
    var seq = dc.seq;
    App.waitTableOutcome(SERVER_GAME, {
      timeoutMs: 25000,
      roundNo: dc.roundNo || undefined,
    }).then(function (snap) {
      if (!drawClock || drawClock.seq !== seq) return;
      if (!snap || !snap.outcome) throw new Error('开奖结果缺失');
      bindDrawOutcome(snap);
      advanceDrawClock();
    }).catch(function () {
      if (!drawClock || drawClock.seq !== seq) return;
      /*
       * 拿不到就下一帧再要，轮询那边拿到同样能补上，本局时间轴不受影响。
       * 这里不报错：开奖结果晚到几百毫秒是正常的，刷日志反而盖住真问题。
       */
      drawClock.outcomeAsked = false;
    });
  }

  /**
   * 牌桌维护（每天 04:00–06:01，或管理端手动下架）。
   *
   * 维护期服务端不开局，但时间基准照样一轮轮往前走。不拦住的话画面会每 66 秒
   * 空转一次「开奖中」，牌却永远发不出来，玩家只能干看两个小时。
   */
  function enterPaused() {
    if (phase === 'paused') return;
    phase = 'paused';
    roundBusy = false;
    drawClock = null;
    /* 清掉本局标记：维护结束后要当作全新一局重新进入 */
    curRoundStartAt = 0;
    stopOtherBetting();
    hideAllCards();
    clearWinBetHighlight();
    hidePhaseBanner();
    syncActionButtons();
    paint(false);
  }

  /**
   * 唯一的心跳。
   *
   * 每一帧只做三件事：问时间基准现在是本局第几毫秒、必要时换局、
   * 然后照着这个位置渲染。没有任何「等某个 setTimeout 到点再切相位」的逻辑，
   * 所以丢包、卡顿、切后台回来都只是画面追赶，不会把流程带偏。
   */
  function tick() {
    if (serverClock && serverClock.phase === 'PAUSED') {
      enterPaused();
      return;
    }
    var pos = roundPosition();
    if (pos.startAt !== curRoundStartAt) enterRound(pos);
    if (pos.phase === 'BETTING') {
      runBetting(pos);
      return;
    }
    ensureDrawClock(pos);
    if (drawClock && !drawClock.outcome) requestOutcome(drawClock);
    advanceDrawClock();
  }

  /* 心跳在全文末尾、所有变量就绪后再启动 */

  var betArea = document.getElementById('betArea');
  function pressBtn(btn, on) {
    if (!btn) return;
    if (on) btn.classList.add('is-pressed');
    else btn.classList.remove('is-pressed');
  }
  betArea.addEventListener('pointerdown', function (e) {
    var btn = e.target.closest('.dn-bet-btn');
    if (!btn) return;
    pressBtn(btn, true);
  });
  function clearPress(e) {
    var btn = e.target.closest ? e.target.closest('.dn-bet-btn') : null;
    if (btn) pressBtn(btn, false);
    var all = betArea.querySelectorAll('.dn-bet-btn.is-pressed');
    for (var i = 0; i < all.length; i++) all[i].classList.remove('is-pressed');
  }
  betArea.addEventListener('pointerup', clearPress);
  betArea.addEventListener('pointercancel', clearPress);
  betArea.addEventListener('pointerleave', clearPress);
  betArea.addEventListener('lostpointercapture', clearPress);

  /* ---------- 筹码选择 + 下注飞入 ---------- */
  var CHIP_FLY_MS = 420;
  var CHIP_LAND_SCALE = 2 / 3;
  var CHIP_SRC = {
    1: './assets/ui/chips/chip-1.webp?v=4',
    5: './assets/ui/chips/chip-5.webp?v=4',
    10: './assets/ui/chips/chip-10.webp?v=4',
    50: './assets/ui/chips/chip-50.webp?v=4',
    100: './assets/ui/chips/chip-100.webp?v=4',
    500: './assets/ui/chips/chip-500.webp?v=4',
    1000: './assets/ui/chips/chip-1000.webp?v=1',
    2000: './assets/ui/chips/chip-2000.webp?v=1',
    3000: './assets/ui/chips/chip-3000.webp?v=1',
    4000: './assets/ui/chips/chip-4000.webp?v=1',
    5000: './assets/ui/chips/chip-5000.webp?v=1',
    10000: './assets/ui/chips/chip-10000.webp?v=1'
  };
  var CHIP_PAGES = [
    [1, 5, 10, 50, 100, 500],
    [1000, 2000, 3000, 4000, 5000, 10000]
  ];
  var chipPage = 0;
  /* 落点数量：庄/闲较密，边注略疏 */
  var SLOT_COUNT = {
    banker: 20, player: 20,
    small: 16, niuniu: 12, niu79: 12, niu06: 12, flower: 16
  };
  var selectedChip = 1;
  var betTotals = {};
  var slotStacks = {}; /* key -> 每个落点已叠层数 */
  var roundPlacements = []; /* 本局每次落筹 {key,value} */
  var lastRoundPlacements = []; /* 仅上一局，不能隔局 */
  var rebetting = false;
  var undoing = false;   /* 撤销请求在途，避免连点重复提交 */
  var usedRebet = false; /* 当局续押仅一次 */
  var chipBar = document.getElementById('chipBar');
  var actionBar = document.getElementById('actionBar');
  var slotCache = {};

  function buildSlots(count) {
    /* 真正散落：随机撒点 + 最小间距，避免网格感 */
    var slots = [];
    var minDist = count >= 20 ? 14 : 18;
    var padX = 8;
    var padY = 10;
    var tries = 0;
    var maxTries = count * 80;
    while (slots.length < count && tries < maxTries) {
      tries++;
      var x = padX + Math.random() * (100 - padX * 2);
      var y = padY + Math.random() * (100 - padY * 2);
      var ok = true;
      for (var i = 0; i < slots.length; i++) {
        var dx = x - slots[i].x;
        var dy = y - slots[i].y;
        if (dx * dx + dy * dy < minDist * minDist) {
          ok = false;
          break;
        }
      }
      if (ok) slots.push({ x: x, y: y });
    }
    /* 若随机不够，放宽间距补齐 */
    while (slots.length < count) {
      minDist *= 0.85;
      var filled = false;
      for (var t = 0; t < 40 && slots.length < count; t++) {
        var x2 = padX + Math.random() * (100 - padX * 2);
        var y2 = padY + Math.random() * (100 - padY * 2);
        var ok2 = true;
        for (var j = 0; j < slots.length; j++) {
          var dx2 = x2 - slots[j].x;
          var dy2 = y2 - slots[j].y;
          if (dx2 * dx2 + dy2 * dy2 < minDist * minDist) {
            ok2 = false;
            break;
          }
        }
        if (ok2) {
          slots.push({ x: x2, y: y2 });
          filled = true;
        }
      }
      if (!filled) {
        slots.push({
          x: padX + Math.random() * (100 - padX * 2),
          y: padY + Math.random() * (100 - padY * 2)
        });
      }
    }
    return slots;
  }

  function getSlots(key) {
    if (!slotCache[key]) {
      slotCache[key] = buildSlots(SLOT_COUNT[key] || 10);
    }
    return slotCache[key];
  }

  function pickSlot(key) {
    var slots = getSlots(key);
    var idx = Math.floor(Math.random() * slots.length);
    if (!slotStacks[key]) slotStacks[key] = [];
    var stack = slotStacks[key];
    var layer = stack[idx] || 0;
    stack[idx] = layer + 1;
    var base = slots[idx];
    /* 每次再抖一点，同点叠层也更自然 */
    var rx = (Math.random() - 0.5) * 6;
    var ry = (Math.random() - 0.5) * 5;
    return {
      idx: idx,
      layer: layer,
      x: Math.max(5, Math.min(95, base.x + rx + (layer % 3) * 0.9)),
      y: Math.max(6, Math.min(94, base.y + ry - layer * 2.1))
    };
  }

  function fmtStake(n) {
    /* 千分位完整数字，避免「0.1万」这种难看增量 */
    return Number(n).toLocaleString('en-US');
  }

  function paintChipPage(keepVal) {
    var page = CHIP_PAGES[chipPage] || CHIP_PAGES[0];
    var want = page.indexOf(keepVal) >= 0 ? keepVal : page[0];
    var btns = chipBar.querySelectorAll('.dn-chip');
    for (var i = 0; i < btns.length; i++) {
      var val = page[i];
      if (typeof val !== 'number') continue;
      btns[i].setAttribute('data-chip', String(val));
      btns[i].setAttribute('aria-label', String(val));
      var img = btns[i].querySelector('img');
      if (img) {
        img.src = CHIP_SRC[val] || CHIP_SRC[1];
        img.alt = String(val);
      }
      btns[i].classList.toggle('is-selected', val === want);
    }
    selectedChip = want;
    var more = document.getElementById('chipPageBtn');
    if (more) {
      more.classList.toggle('is-page2', chipPage === 1);
      more.setAttribute('aria-label', chipPage === 0 ? '切换到大额筹码' : '切换到小额筹码');
    }
  }

  /* 已发出但未回执的下注额，连点时不能重复占用同一笔余额 */
  var inFlightStake = 0;

  function availableBalance() {
    if (!window.App || !App.getBalance || !user) return Infinity;
    var bal = App.getBalance(user.uid);
    if (typeof bal !== 'number' || !isFinite(bal)) return Infinity;
    return bal - inFlightStake;
  }

  function largestAffordableChip(bal) {
    return TableShell.affordableChip(CHIP_PAGES, bal);
  }

  function selectChipValue(val) {
    if (!val || val === selectedChip) return;
    for (var p = 0; p < CHIP_PAGES.length; p++) {
      if (CHIP_PAGES[p].indexOf(val) < 0) continue;
      if (p !== chipPage) {
        chipPage = p;
        paintChipPage(val);
        return;
      }
      break;
    }
    selectedChip = val;
    var all = chipBar.querySelectorAll('.dn-chip');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.toggle('is-selected', Number(all[i].getAttribute('data-chip')) === val);
    }
  }

  /** 余额跌破当前筹码时自动降档，只降不升 */
  function syncChipToBalance() {
    var bal = availableBalance();
    if (!isFinite(bal) || selectedChip <= bal) return;
    var next = largestAffordableChip(bal);
    if (next) selectChipValue(next);
  }

  function clearBets(opts) {
    betTotals = {};
    slotStacks = {};
    roundPlacements = [];
    chipsHydratedRound = '';
    if (!opts || !opts.keepPersist) clearPersistedTableChips();
    var btns = betArea.querySelectorAll('.dn-bet-btn');
    for (var i = 0; i < btns.length; i++) {
      var chips = btns[i].querySelector('.dn-bet-btn__chips');
      var stake = btns[i].querySelector('.dn-bet-btn__stake');
      if (chips) chips.innerHTML = '';
      if (stake) {
        stake.textContent = '0';
        stake.hidden = true;
      }
    }
  }

  function canUndo() {
    /* 真账已提交，不可撤销；按钮恒灰，点击仅提示 */
    return false;
  }

  function canRebet() {
    /* 上一局有注、本局还没下过、当局未用过续押 */
    return !isClosed() && !rebetting && !usedRebet &&
      lastRoundPlacements.length > 0 && roundPlacements.length === 0;
  }

  function canUndo() {
    return !isClosed() && !rebetting && roundPlacements.length > 0;
  }

  function syncActionButtons() {
    var undoBtn = actionBar.querySelector('[data-action="undo"]');
    var rebetBtn = actionBar.querySelector('[data-action="rebet"]');
    var r = canRebet();
    if (undoBtn) TableShell.syncUndoButton(undoBtn, canUndo(), undoing);
    if (rebetBtn) {
      rebetBtn.classList.toggle('is-disabled', !r);
      rebetBtn.setAttribute('aria-disabled', r ? 'false' : 'true');
    }
  }

  /* 开奖结束进入新一轮：只记本局为上一局（没下过则清空，不能隔局） */
  function commitRoundBets(opts) {
    lastRoundPlacements = roundPlacements.map(function (p) {
      return { key: p.key, value: p.value };
    });
    clearBets(opts);
    undoing = false;
    usedRebet = false;
    rebetting = false;
    syncActionButtons();
  }

  /** 撤销本局我的全部下注：服务端只在封盘前受理，退款由服务端原路退回 */
  function undoAllBets() {
    if (undoing || !canUndo()) return;
    if (!window.App || !App.cancelTableBets) {
      if (window.App && App.toast) App.toast('请从大厅进入游戏');
      return;
    }
    undoing = true;
    syncActionButtons();
    App.cancelTableBets(SERVER_GAME).then(function (res) {
      undoing = false;
      /* 只清自己的筹码，别人的气氛筹码留在桌上 */
      TableShell.removeMyChipVisuals(betArea, '.dn-bet-btn__chips');
      roundPlacements = [];
      for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
        var k = BET_CHIP_KEYS[i];
        betTotals[k] = 0;
        var btn = betBtn(k);
        if (btn) updateStakeUI(btn, 0);
      }
      slotStacks = {};
      if (typeof schedulePersistTableChips === 'function') schedulePersistTableChips();
      refreshStats();
      syncChipToBalance();
      syncActionButtons();
      if (window.App && App.toast) {
        App.toast('已撤销本局下注，退回 ' + fmtStake(res && res.refunded || 0));
      }
    }).catch(function (e) {
      undoing = false;
      syncActionButtons();
      if (window.App && App.toast) App.toast((e && e.message) || '撤销失败');
    });
  }

  function rebetLastRound() {
    if (!canRebet()) return;
    var list = lastRoundPlacements.slice();
    var n = list.length;
    var need = 0;
    for (var t = 0; t < n; t++) need += list[t].value;
    /* 续押是往本局已有筹码上再加一轮，可能把某一边顶过限红 */
    if (sideLimits) {
      var after = {};
      for (var q = 0; q < n; q++) {
        after[list[q].key] = (after[list[q].key] || betTotals[list[q].key] || 0) + list[q].value;
      }
      var overKey = Object.keys(after).find(function (k) { return !!sideLimits.reject(k, after[k]); });
      if (overKey) {
        if (window.App && App.toast) App.toast(sideLimits.reject(overKey, after[overKey]));
        return;
      }
    }
    if (window.App && App.getBalance && user) {
      if (App.getBalance(user.uid) < need) {
        if (App.toast) App.toast('积分不足');
        return;
      }
    }
    if (!window.App || !App.placeTableBet) {
      if (window.App && App.toast) App.toast('请从大厅进入游戏');
      return;
    }
    usedRebet = true;
    rebetting = true;
    syncActionButtons();
    var landSize = barChipSize() * CHIP_LAND_SCALE;
    var flyMs = n <= 1 ? 360 : Math.min(320, Math.floor(700 / Math.max(1, Math.ceil(n / 6))));
    var gap = n <= 1 ? 0 : Math.max(12, Math.floor((1000 - flyMs) / (n - 1)));
    var chain = Promise.resolve();
    list.forEach(function (p) {
      chain = chain.then(function () {
        return App.placeTableBet(SERVER_GAME, p.key, p.value).then(function () {
          var btn = betArea.querySelector('.dn-bet-btn[data-bet="' + p.key + '"]');
          if (btn) {
            var slot = pickSlot(p.key);
            betTotals[p.key] = (betTotals[p.key] || 0) + p.value;
            roundPlacements.push({ key: p.key, value: p.value });
            appendBetLog(p.key, p.value);
            updateStakeUI(btn, betTotals[p.key]);
            flyChipToBet(btn, p.value, slot, landSize, flyMs, 'me');
            sfx('bet', { vol: 0.75 });
          }
          return delay(gap);
        });
      });
    });
    chain.then(function () {
      rebetting = false;
      refreshStats();
      if (window.App && App.refreshBalance) App.refreshBalance().then(function () { refreshStats(); });
      syncActionButtons();
    }).catch(function (e) {
      rebetting = false;
      if (window.App && App.toast) App.toast((e && e.message) || '续押失败');
      refreshStats();
      if (window.App && App.refreshBalance) App.refreshBalance().then(function () { refreshStats(); });
      syncActionButtons();
    });
  }

  function updateStakeUI(btn, total) {
    var stake = btn.querySelector('.dn-bet-btn__stake');
    if (!stake) return;
    if (total > 0) {
      stake.textContent = fmtStake(total);
      stake.hidden = false;
      var digits = String(total).length;
      stake.classList.toggle('is-long', digits >= 5);
      stake.classList.toggle('is-xl', digits >= 6);
    } else {
      stake.textContent = '0';
      stake.hidden = true;
      stake.classList.remove('is-long', 'is-xl');
    }
  }

  function barChipSize() {
    var srcChip = chipBar.querySelector('.dn-chip.is-selected') ||
      chipBar.querySelector('.dn-chip');
    if (!srcChip) return 48;
    var r = localRect(srcChip);
    return Math.min(r.width, r.height);
  }

  function placeChipOnBtn(btn, value, slot, landSize, owner) {
    var box = btn.querySelector('.dn-bet-btn__chips');
    if (!box) return;
    var img = document.createElement('img');
    img.src = CHIP_SRC[value] || CHIP_SRC[1];
    img.alt = '';
    img.draggable = false;
    img.setAttribute('data-owner', owner || 'me');
    img.setAttribute('data-value', String(value));
    img.style.setProperty('--chip-x', slot.x + '%');
    img.style.setProperty('--chip-y', slot.y + '%');
    img.style.setProperty('--chip-w', landSize + 'px');
    img.style.setProperty('--chip-z', String(10 + slot.layer));
    box.appendChild(img);
    if (!restoringChips && typeof schedulePersistTableChips === 'function') {
      schedulePersistTableChips();
    }
  }

  function flyChipToBet(btn, value, slot, landSize, flyMs, owner) {
    var srcChip = chipBar.querySelector('.dn-chip[data-chip="' + value + '"]') ||
      chipBar.querySelector('.dn-chip.is-selected');
    if (!srcChip || !btn) return;
    var duration = typeof flyMs === 'number' ? flyMs : CHIP_FLY_MS;
    var who = owner || 'me';

    var from = localRect(srcChip);
    var chipBox = btn.querySelector('.dn-bet-btn__chips');
    var area = chipBox ? localRect(chipBox) : localRect(btn);

    var size = Math.min(from.width, from.height);
    var startX = from.left + from.width / 2 - size / 2;
    var startY = from.top + from.height / 2 - size / 2;
    var endCX = area.left + area.width * (slot.x / 100);
    var endCY = area.top + area.height * (slot.y / 100);
    var endX = endCX - size / 2;
    var endY = endCY - size / 2;
    var dx = endX - startX;
    var dy = endY - startY;
    var scale = landSize / size;

    var fly = document.createElement('div');
    fly.className = 'dn-fly-chip';
    fly.style.width = size + 'px';
    fly.style.height = size + 'px';
    fly.style.left = startX + 'px';
    fly.style.top = startY + 'px';
    fly.style.transitionDuration = duration + 'ms';
    fly.style.setProperty('--fly-x', dx + 'px');
    fly.style.setProperty('--fly-y', dy + 'px');
    fly.style.setProperty('--fly-scale', String(scale));
    fly.innerHTML = '<img src="' + (CHIP_SRC[value] || CHIP_SRC[1]) + '" alt="" draggable="false">';
    flyLayer.appendChild(fly);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        fly.classList.add('is-flying');
      });
    });

    setTimeout(function () {
      fly.remove();
      placeChipOnBtn(btn, value, slot, landSize, who);
    }, duration);
  }

  /* ---------- 本房间其他人：从人数图标飞出下注 ---------- */

  function flyChipFromPlayers(btn, value, slot, landSize) {

  function spawnOtherBet() {
    if (phase !== 'bet' || roundBusy) return;
    var pace = otherBetPace();
    var key = OTHER_BET_KEYS[Math.floor(Math.random() * OTHER_BET_KEYS.length)];
    if (Math.random() < 0.58) key = Math.random() < 0.5 ? 'banker' : 'player';

    var slot = pickSlot(key);

  function startOtherBetting() {
    stopOtherBetting();
    function schedule() {
      if (phase !== 'bet') return;
      var pace = otherBetPace();
      if (pace.burstMax <= 0) {
        otherBetTimer = setTimeout(schedule, pace.minWait + Math.random() * pace.spanWait);
        return;
      }
      var wait = pace.minWait + Math.random() * pace.spanWait;
      otherBetTimer = setTimeout(function () {
        if (phase !== 'bet') return;
        var span = Math.max(0, pace.burstMax - pace.burstMin);
        var n = pace.burstMin + Math.floor(Math.random() * (span + 1));
        for (var i = 0; i < n; i++) {
          setTimeout(spawnOtherBet, i * 120);
        }
        schedule();
      }, wait);
    }
    schedule();
  }

  function placeBet(btn) {
    if (isClosed() || rebetting) return;
    var key = btn.getAttribute('data-bet');
    if (!key) return;
    var value = selectedChip || 1;
    /* 余额不够就降到能下的最大一档，这一手即按新筹码下注 */
    var bal = availableBalance();
    if (value > bal) {
      var fallback = largestAffordableChip(bal);
      if (!fallback) {
        if (window.App && App.toast) App.toast('积分不足');
        return;
      }
      selectChipValue(fallback);
      value = fallback;

    if (sideLimits) {
      var capMsg = sideLimits.reject(key, (betTotals[key] || 0) + value);
      if (capMsg) {
        if (window.App && App.toast) App.toast(capMsg);

    }
    if (!window.App || !App.placeTableBet) {
      if (window.App && App.toast) App.toast('请从大厅进入游戏');
      return;
    }
    inFlightStake += value;
    App.placeTableBet(SERVER_GAME, key, value).then(function (res) {
      inFlightStake = Math.max(0, inFlightStake - value);
      if (res && res.roundNo) {

      var slot = pickSlot(key);

      roundPlacements.push({ key: key, value: value });
      appendBetLog(key, value);
      updateStakeUI(btn, betTotals[key]);
      flyChipToBet(btn, value, slot, landSize, undefined, 'me');
      sfx('bet', { vol: 0.9 });

  function applyServerRoad(packed) {
    if (!packed) return;
    var incoming = (packed.seq || []).slice().map(function (r) {
      return r === 'player' ? 'player' : 'banker';
    });
    if (roadHistory.length > incoming.length) return;
    roadHistory = incoming;
    roadStats = { banker: 0, player: 0 };
    var st = packed.stats || {};
    roadStats.banker = st.banker || 0;
    roadStats.player = st.player || 0;
    roadRoundNos = {};
    (packed.roundNos || []).forEach(function (rn) {
      if (rn) roadRoundNos[String(rn)] = 1;

  function countRoad(hist) {

  function pct(n, total) {
    if (!total) return '0%';

  /** 大路：同色连下，换色新列；和局挂在上一颗上 */
  function buildBigRoad(history) {
    var cols = [];
    var lastSide = null;
    var pendingTies = 0;

    function place(side, ties) {
      var col = cols.length ? cols[cols.length - 1] : null;
      var canDown = col && col.side === side && col.cells.length < ROAD_ROWS && !col.dragon;
      if (!canDown) {
        col = { side: side, cells: [], dragon: false };
        cols.push(col);
      }
      if (col.cells.length >= ROAD_ROWS) {
        col.dragon = true;
        cols.push({ side: side, cells: [{ side: side, ties: ties }], dragon: true });
        return;
      }
      col.cells.push({ side: side, ties: ties });
    }

    for (var i = 0; i < history.length; i++) {
      var r = history[i];
      if (r === 'tie') {
        if (!cols.length) {
          pendingTies += 1;
        } else {
          var lastCol = cols[cols.length - 1];
          var lastCell = lastCol.cells[lastCol.cells.length - 1];
          lastCell.ties += 1;
        }
        continue;
      }
      place(r, pendingTies);
      pendingTies = 0;
      lastSide = r;
    }
    return cols;
  }

  function measureRoadViewCols(scrollEl) {
    if (window.TableShell && TableShell.measureRoadViewCols) {
      return TableShell.measureRoadViewCols(scrollEl, ROAD_ROWS);
    }
    return 12;
  }

  function resetRoadForNewDay(roundNo) {
    if (!roundNo || !window.TableShell) return;
    var ymd = TableShell.roundNoYmd(roundNo);
    if (!ymd) return;
    var keys = Object.keys(roadRoundNos);
    if (!keys.length) return;
    var prev = TableShell.roundNoYmd(keys[0]);
    if (prev && prev !== ymd) {
      roadHistory = [];
      roadRoundNos = {};
      roadStats = { banker: 0, player: 0 };
    }
  }

  function renderBead() {
    if (!beadGrid) return;
    var viewCols = measureRoadViewCols(beadScroll);
    var viewSeq = window.TableShell
      ? TableShell.roadBeadViewSeq(roadHistory, viewCols, ROAD_ROWS)
      : roadHistory.slice();
    var filledCols = Math.ceil(viewSeq.length / ROAD_ROWS) || 0;
    var cols = viewCols;
    var lastIdx = viewSeq.length - 1;
    var html = '';
    for (var c = 0; c < cols; c++) {
      for (var r = 0; r < ROAD_ROWS; r++) {
        var idx = c * ROAD_ROWS + r;
        if (idx < viewSeq.length) {
          var kind = viewSeq[idx];
          var latest = idx === lastIdx ? ' is-latest' : '';
          html += '<span class="dn-bead dn-bead--' + kind + latest + '" role="listitem" title="' + ROAD_NAMES[kind] + '" aria-label="' + ROAD_NAMES[kind] + '">' +
            ROAD_LABELS[kind] + '</span>';
        } else {
          html += '<span class="dn-bead dn-bead--empty" aria-hidden="true"></span>';
        }
      }
    }
    beadGrid.innerHTML = html;
    beadGrid.style.setProperty('--road-cols', String(cols));
    beadGrid.setAttribute('data-filled-cols', String(filledCols));
    syncRoadGridWidth(beadGrid, cols);
    if (beadScroll) beadScroll.scrollLeft = 0;
  }

  function renderBig() {
    if (!bigGrid) return;
    var viewCols = measureRoadViewCols(bigScroll);
    var colsData = buildBigRoad(roadHistory);
    if (window.TableShell) colsData = TableShell.roadBigViewCols(colsData, viewCols);
    var filledCols = colsData.length;
    var cols = viewCols;
    var html = '';
    var lastCol = filledCols - 1;
    var lastRow = lastCol >= 0 ? colsData[lastCol].cells.length - 1 : -1;

    for (var c = 0; c < cols; c++) {
      var col = colsData[c];
      for (var r = 0; r < ROAD_ROWS; r++) {
        if (col && r < col.cells.length) {
          var cell = col.cells[r];
          var latest = (c === lastCol && r === lastRow) ? ' is-latest' : '';
          var tieHtml = '';
          if (cell.ties > 0) {
            var n = cell.ties > 9 ? 9 : cell.ties;
            var label = n > 1 ? String(n) : '';
            tieHtml = '<i class="dn-big__tie" data-n="' + n + '">' + label + '</i>';
          }
          html += '<span class="dn-big dn-big--' + cell.side + latest + '" role="listitem">' +
            tieHtml + '</span>';
        } else {
          html += '<span class="dn-big dn-big--empty" aria-hidden="true"></span>';
        }
      }

    bigGrid.innerHTML = html;

    bigGrid.setAttribute('data-filled-cols', String(filledCols));
    syncRoadGridWidth(bigGrid, cols);
    if (bigScroll) bigScroll.scrollLeft = 0;
  }

  /** 按列数写死宽度 */
  function syncRoadGridWidth(grid, cols) {
    if (!grid || !cols) return;
    var sample = grid.querySelector('.dn-bead, .dn-big');
    var gap = 2;
    var cell = sample ? sample.getBoundingClientRect().width : 0;
    if (!(cell > 4)) {
      var sc = grid.closest('.dn-roadmap__scroll');
      var h = sc ? sc.clientHeight : 0;
      cell = h > 8 ? (h - 6 - 5 * gap) / 6 : 22;
    }
    grid.style.width = (cols * (cell + gap) - gap) + 'px';
  }
