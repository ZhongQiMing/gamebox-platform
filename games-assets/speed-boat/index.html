<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="preload" as="style" href="/fonts/gamebox-fonts.css"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/fonts/gamebox-fonts.css"></noscript>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>幸运飞艇</title>
  <link rel="stylesheet" href="/legacy/css/common.css">
<link rel="stylesheet" href="./css/jsb.css?v=45">
  <script>
    /* 大厅 iframe 嵌入标记 */
    (function () {
      if (window.parent !== window) {
        document.documentElement.classList.add('jsb-in-iframe');
      }
    })();
  </script>
</head>
<body class="jsb-body jsb-bg">

<div class="jsb-room">
  <div class="jsb-room-glow" aria-hidden="true"></div>
  <!-- 顶：返回+标题 | 统计 2×2 -->
  <header class="jsb-head">
    <div class="jsb-head__brand">
      <button type="button" class="jsb-head-back" id="backBtn" aria-label="返回"></button>
      <h1 class="jsb-head-title">幸运飞艇</h1>
    </div>
    <div class="jsb-stats" id="statsBar">
      <div class="jsb-stat"><span class="k">积分</span><span class="v" id="statBalance">0</span></div>
      <div class="jsb-stat"><span class="k">输赢</span><span class="v" id="statWinloss">0</span></div>
      <div class="jsb-stat"><span class="k">流水</span><span class="v" id="statTurnover">0</span></div>
      <div class="jsb-stat"><span class="k">回水</span><span class="v" id="statRebate">0</span></div>
    </div>
  </header>

  <!-- 期号行：一行 · 期号 + 倒计时 + 按钮 -->
  <section class="jsb-issue-card">
    <div class="jsb-issue-card__top">
      <div class="jsb-issue-card__left">
        <em class="jsb-cur-issue__tag">当前期</em>
        <span class="jsb-cur-issue" id="curIssue" title="">--------</span>
      </div>
      <div class="jsb-issue-card__mid">
        <div class="jsb-timer" id="countdownBox" aria-label="倒计时">
          <span class="jsb-timer__lbl" id="cdLabel">距封盘</span>
          <div class="jsb-timer__digits" id="cdDigits" aria-label="倒计时">
            <div class="jsb-timer__group">
              <span class="jsb-timer__cell">0</span>
              <span class="jsb-timer__cell">0</span>
            </div>
            <span class="jsb-timer__sep" aria-hidden="true">:</span>
            <div class="jsb-timer__group">
              <span class="jsb-timer__cell">0</span>
              <span class="jsb-timer__cell">0</span>
            </div>
          </div>
          <span class="jsb-timer__prep" id="cdPrep" hidden>封盘中 · 准备开奖</span>
        </div>
      </div>
      <div class="jsb-issue-card__acts">
        <button type="button" class="jsb-issue-btn" id="btnLong">长龙</button>
        <button type="button" class="jsb-issue-btn" id="btnPredict">预测</button>
      </div>
    </div>
  </section>

  <!-- 开奖下拉栏 -->
  <section class="jsb-draw-bar" id="drawBar">
    <button type="button" class="jsb-draw-bar__main" id="drawToggle" aria-expanded="false">
      <span class="jsb-draw-bar__issue"><em class="jsb-draw-bar__issue-tag">上期</em><span id="barIssue">--------</span></span>
      <span class="jsb-draw-bar__balls" id="barBalls"></span>
      <span class="jsb-draw-bar__meta" id="barSummary">---</span>
      <span class="jsb-draw-bar__arrow" id="drawArrow">▼</span>
    </button>
    <div class="jsb-draw-panel" id="drawPanel">
      <div class="jsb-draw-table-wrap">
        <table class="jsb-draw-table">
          <colgroup>
            <col class="col-issue">
            <col class="col-ball" span="10">
            <col class="col-gy">
            <col class="col-lh">
          </colgroup>
          <thead>
            <tr>
              <th>期数</th>
              <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th>
              <th>六</th><th>七</th><th>八</th><th>九</th><th>十</th>
              <th>冠亚</th>
              <th>龙虎</th>
            </tr>
          </thead>
          <tbody id="drawTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 聊天区 + 右侧快捷按钮 -->
  <div class="jsb-chat-wrap">
    <div class="jsb-chat-wrap">
    <main class="jsb-chat" id="chatFeed" role="log" aria-live="polite"></main>
    <div class="jsb-chat-dock" id="chatDock" hidden></div>
  </div>
      </div>

    <!-- 右侧浮钮：梯子收起 / 展开 客服·规则·记录·玩法 -->
  <aside class="jsb-rail" aria-label="快捷操作">
    <button
      type="button"
      class="jsb-rail-ladder"
      id="btnRailToggle"
      title="展开菜单"
      aria-expanded="false"
      aria-controls="jsbRailStack"
    >
      <span class="jsb-rail-ladder__arrow" aria-hidden="true">▼</span>
    </button>
    <div class="jsb-rail-stack" id="jsbRailStack">
      <button type="button" class="jsb-rail-btn" id="btnCs" title="客服">
        <img class="jsb-rail-ic" src="/images/chat-rail/cs.webp?v=1" alt="" draggable="false">
        <span class="jsb-rail-lb">客服</span>
      </button>
      <button type="button" class="jsb-rail-btn" id="btnRules" title="规则">
        <img class="jsb-rail-ic" src="/images/chat-rail/rules.webp?v=1" alt="" draggable="false">
        <span class="jsb-rail-lb">规则</span>
      </button>
      <button type="button" class="jsb-rail-btn" id="btnRecords" title="记录">
        <img class="jsb-rail-ic" src="/images/chat-rail/records.webp?v=1" alt="" draggable="false">
        <span class="jsb-rail-lb">记录</span>
      </button>
      <button type="button" class="jsb-rail-btn jsb-rail-btn--play" id="btnExpand" title="玩法">
        <img class="jsb-rail-ic jsb-rail-ic--play" src="/images/chat-rail/play.webp?v=1" alt="" draggable="false">
        <span class="jsb-rail-lb">玩法</span>
      </button>
    </div>
  </aside>


    <!-- 底部输入：输入框 + / 玩法 -->
  <footer class="jsb-composer">
    <input type="text" class="jsb-input" id="chatInput" placeholder="输入玩法/金额" autocomplete="off" enterkeyhint="send">
    <button type="button" class="jsb-composer-btn" id="plusBtn" aria-label="更多">
      <img class="jsb-composer-btn__img" id="plusBtnImg" src="/images/chat-rail/plus.webp?v=1" alt="" draggable="false">
    </button>
    <button type="button" class="jsb-composer-btn jsb-composer-btn--play" id="btnComposerPlay" title="玩法" aria-label="玩法">
      <img class="jsb-composer-btn__img jsb-composer-btn__img--play" src="/images/chat-rail/play.webp?v=1" alt="" draggable="false">
    </button>
  </footer>

  <!-- 投注键盘 -->
  <div class="jsb-keypad" id="keypad" hidden>
    <div class="jsb-keypad__tools">
      <button type="button" data-cmd="topup">上分</button>
      <button type="button" data-cmd="cancel">取消</button>
      <button type="button" data-cmd="allin">梭哈</button>
      <button type="button" data-cmd="repeat">重复</button>
      <button type="button" data-cmd="withdraw">下分</button>
    </div>
    <div class="jsb-keypad__grid" id="keyGrid"></div>
  </div>

  <!-- + 菜单：2 行 × 3 列 = 6 项 -->
  <div class="jsb-menu-mask" id="menuMask" hidden></div>
  <div class="jsb-plus-menu" id="plusMenu" hidden>
    <button type="button" data-link="recharge">上下分</button>
    <button type="button" data-link="apply-records">申请记录</button>
    <button type="button" data-link="bet-records">竞猜报表</button>
    <button type="button" data-link="rebate">自助回水</button>
    <button type="button" data-link="activities">福利活动</button>
    <button type="button" data-link="settings">我的账户</button>
  </div>

  <!-- 玩法展开：左玩法名 · 右选项 · 底金额投注 -->
  <div class="jsb-play-mask" id="playMask" hidden></div>
  <div class="jsb-play-sheet" id="playSheet" hidden>
    <div class="jsb-play-sheet__head">
      <span>全部玩法</span>
      <div class="jsb-play-sheet__head-actions">
        <button type="button" class="jsb-play-sheet__rules" id="playSheetRules" title="游戏规则">
          <span class="jsb-play-sheet__rules-ic" aria-hidden="true">i</span>
          <span>游戏规则</span>
        </button>
        <button type="button" id="playSheetClose" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="jsb-play-sheet__main">
      <nav class="jsb-play-nav" id="playNav" aria-label="玩法分类"></nav>
      <div class="jsb-play-panel">
        <p class="jsb-play-panel__hint" id="playHint"></p>
        <div class="jsb-play-panel__sub" id="playSub" hidden></div>
        <div class="jsb-play-panel__grid" id="playGrid"></div>
      </div>
    </div>
    <footer class="jsb-play-sheet__foot">
      <div class="jsb-play-foot__chiprow">
        <div class="jsb-play-foot__chips" id="playAmountChips"></div>
        <input type="number" class="jsb-play-foot__input" id="playAmount" value="100" min="1" inputmode="numeric" aria-label="单注金额">
        <button type="button" class="jsb-play-foot__allin" id="playAmountAllin">梭哈</button>
      </div>
      <div class="jsb-play-foot__action">
        <button type="button" class="jsb-play-foot__clear" id="playClear">清空</button>
        <div class="jsb-play-foot__summary">
          <div class="jsb-play-foot__total">投注金额: <strong id="playBetTotal">0</strong></div>
          <div class="jsb-play-foot__bal">账户余额: <strong id="playFootBalance">0</strong></div>
        </div>
        <button type="button" class="jsb-play-foot__repeat" id="playRepeat">重复</button>
        <button type="button" class="jsb-play-foot__submit" id="playSubmit">投注</button>
      </div>
      <div class="jsb-play-foot__tip" id="playSelected" hidden></div>
    </footer>
  </div>

  
    <!-- 游戏规则（底部金黑面板，与时时彩同款） -->
  <div class="jsb-rules-mask" id="rulesMask" hidden></div>
  <div class="jsb-rules-sheet" id="rulesSheet" hidden>
    <div class="jsb-rules-sheet__head">
      <span id="rulesTitle">游戏规则</span>
      <button type="button" id="rulesSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="jsb-rules-sheet__body" id="rulesBody"></div>
  </div>

<!-- 长龙统计 -->
  <div class="jsb-long-mask" id="longMask" hidden></div>
  <div class="jsb-long-sheet" id="longSheet" hidden>
    <div class="jsb-long-sheet__handle" aria-hidden="true"></div>
    <div class="jsb-long-sheet__head">
      <div class="jsb-long-sheet__title-wrap">
        <span class="jsb-long-sheet__title">长龙统计</span>
        <span class="jsb-long-sheet__sub" id="longSummary">连续 2 期及以上</span>
      </div>
      <button type="button" id="longSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="jsb-long-sheet__tabs" id="longTabs">
      <button type="button" class="is-active" data-tab="side">两面</button>
      <button type="button" data-tab="lhh">龙虎</button>
      <button type="button" data-tab="gy">冠亚</button>
    </div>
    <div class="jsb-long-sheet__body" id="longBody"></div>
  </div>

  <!-- 智能预测 -->
  <div class="jsb-long-mask" id="predictMask" hidden></div>
  <div class="jsb-long-sheet jsb-predict-sheet" id="predictSheet" hidden>
    <div class="jsb-long-sheet__handle" aria-hidden="true"></div>
    <div class="jsb-long-sheet__head">
      <div class="jsb-long-sheet__title-wrap">
        <span class="jsb-long-sheet__title">智能预测</span>
        <span class="jsb-predict-sheet__issue" id="predictSummary">下一期 · --------</span>
      </div>
      <button type="button" id="predictSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="jsb-long-sheet__tabs" id="predictTabs">
      <button type="button" class="is-active" data-tab="side">双面</button>
      <button type="button" data-tab="gy">冠亚</button>
      <button type="button" data-tab="num">艇号</button>
    </div>
    <div class="jsb-long-sheet__body" id="predictBody"></div>
    <div class="jsb-predict-foot">基于近期开奖走势统计，仅供参考</div>
  </div>
</div>

<script src="/legacy/js/jquery-3.7.1.min.js"></script>
<script src="/legacy/js/games-common.js?v=35"></script>
<script src="/games-assets/_lottery-common/room-chat.js?v=31"></script>
<link rel="stylesheet" href="/games-assets/_lottery-common/hold-drawing-tip.css?v=4">
<script src="/games-assets/_lottery-common/hold-drawing-tip.js?v=4"></script>
<link rel="stylesheet" href="/games-assets/_lottery-common/card-sfx-toggle.css?v=8">
<script src="/games-assets/_lottery-common/app-audio-level.js?v=1"></script>
<script src="/games-assets/_lottery-common/card-sfx-toggle.js?v=5"></script>
<script src="/games-assets/_lottery-common/server-clock.js?v=1"></script>
<script src="./js/result-card.js?v=11"></script>
<script src="./js/jsb-audio.js?v=8"></script>
<script src="./js/jsb.js?v=143"></script>
<script>
(function () {
  function boot() {
    if (!window.LotteryCardSfx) return;
    LotteryCardSfx.install({
      audio: window.JsbAudio,
      cardSelector: '.jsb-race-card',
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
