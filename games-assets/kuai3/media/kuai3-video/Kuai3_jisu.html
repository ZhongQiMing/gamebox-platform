<script>
/* embed-hide-loading: 进页即藏 LOADING，避免刷新续播先闪字 */
(function () {
  if (!/[?&]embed=1(?:&|$)/.test(location.search || '') && !/[?&]settle=1(?:&|$)/.test(location.search || '')) return;
  document.documentElement.classList.add('is-embed');
  var s = document.createElement('style');
  s.textContent = '.loading,.loading .loadtxt,#preloader{display:none!important;visibility:hidden!important}';
  (document.head || document.documentElement).appendChild(s);
})();
</script>
