<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="preload" as="style" href="/fonts/gamebox-fonts.css"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="/fonts/gamebox-fonts.css"></noscript>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>1分快三</title>
  <link rel="stylesheet" href="/legacy/css/common.css">
<link rel="stylesheet" href="./css/k3.css?v=49">
  <script>
    (function () {
      if (window.parent !== window) {
        document.documentElement.classList.add('k3-in-iframe');
      }
    })();
  </script>
</head>
<body class="k3-body k3-bg">

<div class="k3-room">
  <div class="k3-room-glow" aria-hidden="true"></div>
  <header class="k3-head">
    <div class="k3-head__brand">
      <button type="button" class="k3-head-back" id="backBtn" aria-label="返回"></button>
      <h1 class="k3-head-title">1分快三</h1>
    </div>
    <div class="k3-stats" id="statsBar">
      <div class="k3-stat"><span class="k">积分</span><span class="v" id="statBalance">0</span></div>
      <div class="k3-stat"><span class="k">输赢</span><span class="v" id="statWinloss">0</span></div>
      <div class="k3-stat"><span class="k">流水</span><span class="v" id="statTurnover">0</span></div>
      <div class="k3-stat"><span class="k">回水</span><span class="v" id="statRebate">0</span></div>
    </div>
  </header>

  <section class="k3-issue-card">
    <div class="k3-issue-card__top">
      <div class="k3-issue-card__left">
        <em class="k3-cur-issue__tag">当前期</em>
        <span class="k3-cur-issue" id="curIssue" title="">--------</span>
      </div>
      <div class="k3-issue-card__mid">
        <div class="k3-timer" id="countdownBox" aria-label="倒计时">
          <span class="k3-timer__lbl" id="cdLabel">距封盘</span>
          <div class="k3-timer__digits" id="cdDigits" aria-label="倒计时">
            <div class="k3-timer__group">
              <span class="k3-timer__cell">0</span>
              <span class="k3-timer__cell">0</span>
            </div>
            <span class="k3-timer__sep" aria-hidden="true">:</span>
            <div class="k3-timer__group">
              <span class="k3-timer__cell">0</span>
              <span class="k3-timer__cell">0</span>
            </div>
          </div>
          <span class="k3-timer__prep" id="cdPrep" hidden>封盘中 · 准备开奖</span>
        </div>
      </div>
      <div class="k3-issue-card__acts">
        <button type="button" class="k3-issue-btn" id="btnLong">长龙</button>
        <button type="button" class="k3-issue-btn" id="btnPredict">预测</button>
      </div>
    </div>
  </section>

  <section class="k3-draw-bar" id="drawBar">
    <button type="button" class="k3-draw-bar__main" id="drawToggle" aria-expanded="false">
      <span class="k3-draw-bar__issue"><em class="k3-draw-bar__issue-tag">上期</em><span id="barIssue">--------</span></span>
      <span class="k3-draw-bar__balls" id="barBalls"></span>
      <span class="k3-draw-bar__gy" id="barGy">---</span>
      <span class="k3-draw-bar__lh" id="barLh">---</span>
      <span class="k3-draw-bar__arrow" id="drawArrow">▼</span>
    </button>
    <div class="k3-draw-panel" id="drawPanel">
      <div class="k3-draw-table-wrap">
        <table class="k3-draw-table">
          <colgroup>
            <col class="col-issue">
            <col class="col-ball" span="3">
            <col class="col-gy">
            <col class="col-lh">
          </colgroup>
          <thead>
            <tr>
              <th>期数</th>
              <th>骰1</th><th>骰2</th><th>骰3</th>
              <th>和值</th>
              <th>形态</th>
            </tr>
          </thead>
          <tbody id="drawTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 聊天主栏：全房间下注信息 -->
  <main class="k3-chat" id="chatFeed" role="log" aria-live="polite"></main>
  <div class="k3-chat-dock" id="chatDock" hidden></div>

    <!-- 右侧浮钮：梯子收起 / 展开 客服·规则·记录·玩法 -->
  <aside class="k3-rail" aria-label="快捷操作">
    <button
      type="button"
      class="k3-rail-ladder"
      id="btnRailToggle"
      title="展开菜单"
      aria-expanded="false"
      aria-controls="k3RailStack"
    >
      <span class="k3-rail-ladder__arrow" aria-hidden="true">▼</span>
    </button>
    <div class="k3-rail-stack" id="k3RailStack">
      <button type="button" class="k3-rail-btn" id="btnCs" title="客服">
        <img class="k3-rail-ic" src="/images/chat-rail/cs.webp?v=1" alt="" draggable="false">
        <span class="k3-rail-lb">客服</span>
      </button>
      <button type="button" class="k3-rail-btn" id="btnRules" title="规则">
        <img class="k3-rail-ic" src="/images/chat-rail/rules.webp?v=1" alt="" draggable="false">
        <span class="k3-rail-lb">规则</span>
      </button>
      <button type="button" class="k3-rail-btn" id="btnRecords" title="记录">
        <img class="k3-rail-ic" src="/images/chat-rail/records.webp?v=1" alt="" draggable="false">
        <span class="k3-rail-lb">记录</span>
      </button>
      <button type="button" class="k3-rail-btn k3-rail-btn--play" id="btnExpand" title="玩法">
        <img class="k3-rail-ic k3-rail-ic--play" src="/images/chat-rail/play.webp?v=1" alt="" draggable="false">
        <span class="k3-rail-lb">玩法</span>
      </button>
    </div>
  </aside>

    <!-- 底部输入：输入框 + / 玩法 -->
  <footer class="k3-composer">
    <input type="text" class="k3-input" id="chatInput" placeholder="输入玩法/金额，如 大/100、二同3/50、长牌12/100" autocomplete="off" enterkeyhint="send">
    <button type="button" class="k3-composer-btn" id="plusBtn" aria-label="更多">
      <img class="k3-composer-btn__img" id="plusBtnImg" src="/images/chat-rail/plus.webp?v=1" alt="" draggable="false">
    </button>
    <button type="button" class="k3-composer-btn k3-composer-btn--play" id="btnComposerPlay" title="玩法" aria-label="玩法">
      <img class="k3-composer-btn__img k3-composer-btn__img--play" src="/images/chat-rail/play.webp?v=1" alt="" draggable="false">
    </button>
  </footer>

  <div class="k3-keypad" id="keypad" hidden>
    <div class="k3-keypad__tools">
      <button type="button" data-cmd="topup">上分</button>
      <button type="button" data-cmd="cancel">取消</button>
      <button type="button" data-cmd="allin">梭哈</button>
      <button type="button" data-cmd="repeat">重复</button>
      <button type="button" data-cmd="withdraw">下分</button>
    </div>
    <div class="k3-keypad__grid" id="keyGrid"></div>
  </div>

  <div class="k3-menu-mask" id="menuMask" hidden></div>
  <div class="k3-plus-menu" id="plusMenu" hidden>
    <button type="button" data-link="recharge">上下分</button>
    <button type="button" data-link="apply-records">申请记录</button>
    <button type="button" data-link="bet-records">竞猜报表</button>
    <button type="button" data-link="rebate">自助回水</button>
    <button type="button" data-link="activities">福利活动</button>
    <button type="button" data-link="settings">我的账户</button>
  </div>

  <div class="k3-play-mask" id="playMask" hidden></div>
  <div class="k3-play-sheet" id="playSheet" hidden>
    <div class="k3-play-sheet__head">
      <span>全部玩法</span>
      <div class="k3-play-sheet__head-actions">
        <button type="button" class="k3-play-sheet__rules" id="playSheetRules" title="游戏规则">
          <span class="k3-play-sheet__rules-ic" aria-hidden="true">i</span>
          <span>游戏规则</span>
        </button>
        <button type="button" id="playSheetClose" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="k3-play-sheet__main">
      <nav class="k3-play-nav" id="playNav" aria-label="玩法分类"></nav>
      <div class="k3-play-panel">
        <p class="k3-play-panel__hint" id="playHint"></p>
        <div class="k3-play-panel__sub" id="playSub" hidden></div>
        <div class="k3-play-panel__grid" id="playGrid"></div>
      </div>
    </div>
    <footer class="k3-play-sheet__foot">
      <div class="k3-play-foot__chiprow">
        <div class="k3-play-foot__chips" id="playAmountChips"></div>
        <input type="number" class="k3-play-foot__input" id="playAmount" value="100" min="1" inputmode="numeric" aria-label="单注金额">
        <button type="button" class="k3-play-foot__allin" id="playAmountAllin">梭哈</button>
      </div>
      <div class="k3-play-foot__action">
        <button type="button" class="k3-play-foot__clear" id="playClear">清空</button>
        <div class="k3-play-foot__summary">
          <div class="k3-play-foot__total">投注金额: <strong id="playBetTotal">0</strong></div>
          <div class="k3-play-foot__bal">账户余额: <strong id="playFootBalance">0</strong></div>
        </div>
        <button type="button" class="k3-play-foot__repeat" id="playRepeat">重复</button>
        <button type="button" class="k3-play-foot__submit" id="playSubmit">投注</button>
      </div>
      <div class="k3-play-foot__tip" id="playSelected" hidden></div>
    </footer>
  </div>

  <div class="k3-long-mask" id="longMask" hidden></div>
  <div class="k3-long-sheet" id="longSheet" hidden>
    <div class="k3-long-sheet__handle" aria-hidden="true"></div>
    <div class="k3-long-sheet__head">
      <div class="k3-long-sheet__title-wrap">
        <span class="k3-long-sheet__title">长龙统计</span>
        <span class="k3-long-sheet__sub" id="longSummary">连续 2 期及以上</span>
      </div>
      <button type="button" id="longSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="k3-long-sheet__tabs" id="longTabs">
      <button type="button" class="is-active" data-tab="side">和值两面</button>
      <button type="button" data-tab="shape">形态</button>
      <button type="button" data-tab="sum">和值</button>
    </div>
    <div class="k3-long-sheet__body" id="longBody"></div>
  </div>

  <div class="k3-long-mask" id="predictMask" hidden></div>
  <div class="k3-long-sheet k3-predict-sheet" id="predictSheet" hidden>
    <div class="k3-long-sheet__handle" aria-hidden="true"></div>
    <div class="k3-long-sheet__head">
      <div class="k3-long-sheet__title-wrap">
        <span class="k3-long-sheet__title">智能预测</span>
        <span class="k3-predict-sheet__issue" id="predictSummary">下一期 · --------</span>
      </div>
      <button type="button" id="predictSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="k3-long-sheet__tabs" id="predictTabs">
      <button type="button" class="is-active" data-tab="side">双面</button>
      <button type="button" data-tab="sum">和值</button>
      <button type="button" data-tab="dice">骰点</button>
    </div>
    <div class="k3-long-sheet__body" id="predictBody"></div>
    <div class="k3-predict-foot">基于近期开奖走势统计，仅供参考</div>
  </div>

  <!-- 游戏规则（底部金黑面板，与时时彩同款） -->
  <div class="k3-rules-mask" id="rulesMask" hidden></div>
  <div class="k3-rules-sheet" id="rulesSheet" hidden>
    <div class="k3-rules-sheet__head">
      <span id="rulesTitle">游戏规则</span>
      <button type="button" id="rulesSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="k3-rules-sheet__body" id="rulesBody"></div>
  </div>
</div>

<script src="/legacy/js/jquery-3.7.1.min.js"></script>
<script src="/legacy/js/games-common.js?v=35"></script>
<script src="/games-assets/_lottery-common/room-chat.js?v=31"></script>
<link rel="stylesheet" href="/games-assets/_lottery-common/hold-drawing-tip.css?v=4">
<script src="/games-assets/_lottery-common/hold-drawing-tip.js?v=4"></script>
<link rel="stylesheet" href="/games-assets/_lottery-common/card-sfx-toggle.css?v=8">
<script src="/games-assets/_lottery-common/app-audio-level.js?v=1"></script>
<script src="/games-assets/_lottery-common/card-sfx-toggle.js?v=5"></script>
<script src="/games-assets/_lottery-common/server-clock.js?v=1"></script>
<script src="./js/result-card.js?v=11"></script>
<script src="./js/k3-audio.js?v=6"></script>
<script src="./js/k3.js?v=148"></script>
<script>
(function () {
  function boot() {
    if (!window.LotteryCardSfx) return;
    LotteryCardSfx.install({
      audio: window.K3Audio,
      cardSelector: '.k3-video-card',
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
