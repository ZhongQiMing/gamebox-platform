  <script>
    (function () {
      if (window.parent !== window) document.documentElement.classList.add('zjh-in-iframe');
      var DESIGN_W = 1024, DESIGN_H = 1536;
      function applyScale() {
        var head = document.querySelector('.zjh-head');
        var headH = head ? head.offsetHeight : 56;
        var availW = window.innerWidth;
        var availH = Math.max(120, window.innerHeight - headH);
        var s = Math.min(1, availW / DESIGN_W, availH / DESIGN_H);
        document.documentElement.style.setProperty('--zjh-scale', String(s));
      }
      window.addEventListener('resize', applyScale);
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyScale);
      } else {
        applyScale();
      }
    })();

<script>
(function () {
  /* 防重复注入：已启动则整段跳过（勿先清 timer 再 return，否则心跳被打死） */
  if (window.__zjhBooted) return;
  if (window.__zjhTickTimer) { clearInterval(window.__zjhTickTimer); window.__zjhTickTimer = null; }
  if (window.__zjhPlayersTimer) { clearInterval(window.__zjhPlayersTimer); window.__zjhPlayersTimer = null; }
  if (window.__zjhSnapTimer) { clearInterval(window.__zjhSnapTimer); window.__zjhSnapTimer = null; }

  /* 总周期 60s：下注 + 开奖流程(发牌翻牌报牌≈13s) + 派奖 4s */
  /* 下注统一 45s；发牌/派奖时长本游戏不变；整局 = 45+13+4=62s */
  var BETTING_SEC = 45;
  var DRAW_EST_SEC = 13;
  var PAYOUT_SECS = 4;
  var ROUND_SEC = BETTING_SEC + DRAW_EST_SEC + PAYOUT_SECS;
  var TOTAL = BETTING_SEC;
  var SERVER_GAME = 'zhajinhua';
  var alignWaitTimer = null;
  var alignWaiting = false;
  /* 与服务端 alignedBettingEndsAt 一致：Unix epoch 60s 网格 */
  function getAlignedBetRemain() {
    var cycleMs = ROUND_SEC * 1000;
    var bettingMs = TOTAL * 1000;
    var now = Date.now();
    var cycleStart = Math.floor(now / cycleMs) * cycleMs;
    var end = cycleStart + bettingMs;
    if (now >= end) return 0;
    return (end - now) / 1000;
  }
  function getAlignedWaitRemain() {
    var cycleMs = ROUND_SEC * 1000;
    var bettingMs = TOTAL * 1000;
    var now = Date.now();
    var cycleStart = Math.floor(now / cycleMs) * cycleMs;
    var end = cycleStart + bettingMs;
    if (now < end) return 0;
    return (cycleStart + cycleMs - now) / 1000;
  }
  function clearAlignWait() {
    if (alignWaitTimer) {
      clearTimeout(alignWaitTimer);
      alignWaitTimer = null;
    }
  }

  var serverClock = (window.TableShell && TableShell.createServerClock)
    ? TableShell.createServerClock()
    : { phase: '', secondsLeft: 0, syncedAt: 0, roundNo: '', timing: null };

  var atmosphereRobotCount = 14;

  function applyAtmosphereFromSnap(snap) {
    if (!snap || snap.robotCount == null) return;
    var next = window.TableShell && TableShell.normalizeRobotCount
      ? TableShell.normalizeRobotCount(snap.robotCount)
      : Math.min(50, Math.max(0, Math.floor(Number(snap.robotCount) || 0)));
    if (next === atmosphereRobotCount) return;
    atmosphereRobotCount = next;
    if (typeof onlinePlayers === 'number' && window.TableShell && TableShell.atmospherePlayersBase) {
      onlinePlayers = TableShell.atmospherePlayersBase(atmosphereRobotCount) + Math.floor(Math.random() * 5);
      if (typeof paintPlayers === 'function') paintPlayers();
    }
  }

  function applyServerSnap(snap) {
    if (!snap) return;
    if (window.TableShell && TableShell.applyServerSnap) {
      TableShell.applyServerSnap(serverClock, snap);
    } else {
      serverClock.phase = String(snap.phase || '');
      serverClock.secondsLeft = Number(snap.secondsLeft) || 0;
      serverClock.syncedAt = Date.now();
      serverClock.roundNo = snap.roundNo ? String(snap.roundNo) : '';
    }
    applyAtmosphereFromSnap(snap);
    if (snap.timing && snap.timing.bettingMs) {
      BETTING_SEC = Math.max(1, Math.round(snap.timing.bettingMs / 1000));
      DRAW_EST_SEC = Math.max(1, Math.round((snap.timing.drawMs || DRAW_EST_SEC * 1000) / 1000));
      PAYOUT_SECS = Math.max(1, Math.round((snap.timing.settleMs || PAYOUT_SECS * 1000) / 1000));
      ROUND_SEC = BETTING_SEC + DRAW_EST_SEC + PAYOUT_SECS;
      TOTAL = BETTING_SEC;
    }
    if (snap.roundNo && typeof setRoundNoLabel === 'function') {
      setRoundNoLabel(snap.roundNo);
    }
  }

  function getBetRemainSec() {
    if (window.TableShell && TableShell.bettingLeftSec) {
      return TableShell.bettingLeftSec(serverClock, getAlignedBetRemain);
    }
    return getAlignedBetRemain();
  }
  var BANNER_MS = 1500;
  var FLY_MS = 360;
  var GAP_MS = 140;
  var FLIP_MS = 420;
  var FLIP_GAP_MS = 80;
  var DEAL_HOLD_MS = 240;
  var COLLECT_MS = 420;

  function buildDeck() {
    var deck = [];
    for (var s = 0; s < SUITS.length; s++) {
      for (var r = 0; r < RANKS.length; r++) {
        deck.push({ suit: SUITS[s], rank: RANKS[r] });
      }
    }
    for (var i = deck.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = deck[i];
      deck[i] = deck[j];
      deck[j] = t;
    }
    return deck;
  }

  function cardValue(rank) {
    if (rank === 'A') return 14;
    if (rank === 'K') return 13;
    if (rank === 'Q') return 12;
    if (rank === 'J') return 11;
    return parseInt(rank, 10);
  }

  function evalHand(cards) {
    var vals = cards.map(function (c) { return cardValue(c.rank); }).sort(function (a, b) { return b - a; });
    var suits = cards.map(function (c) { return c.suit; });
    var isFlush = suits[0] === suits[1] && suits[1] === suits[2];
    var uniq = [];
    for (var i = 0; i < vals.length; i++) {
      if (uniq.indexOf(vals[i]) < 0) uniq.push(vals[i]);
    }
    var sorted = vals.slice().sort(function (a, b) { return a - b; });
    var isStraight = false;
    if (uniq.length === 3) {
      isStraight = sorted[2] - sorted[1] === 1 && sorted[1] - sorted[0] === 1;
      if (!isStraight && sorted.join(',') === '2,3,14') isStraight = true;
    }
    if (uniq.length === 1) return { type: 'leopard', label: '豹子', score: 6, vals: vals };
    if (isFlush && isStraight) return { type: 'straight-flush', label: '顺金', score: 5, vals: vals };
    if (isFlush) return { type: 'flush', label: '金花', score: 4, vals: vals };
    if (isStraight) {
      var svals = (sorted.join(',') === '2,3,14') ? [3, 2, 1] : vals;
      return { type: 'straight', label: '顺子', score: 3, vals: svals };
    }
    if (uniq.length === 2) {
      var pairVal = (vals[0] === vals[1]) ? vals[0] : vals[1];
      var kicker = (vals[0] === vals[1]) ? vals[2] : vals[0];
      return { type: 'pair', label: '对子', score: 2, vals: [pairVal, kicker, 0] };
    }
    return { type: 'high', label: '散牌', score: 1, vals: vals };
  }

  var SUIT_POWER = { spade: 4, heart: 3, club: 2, diamond: 1 };

  function valToRankNum(v) { return v === 1 ? 14 : v; }

  function bestSuitAtValue(cards, val) {
    var best = 0;
    for (var i = 0; i < cards.length; i++) {
      if (cardValue(cards[i].rank) === val) {
        var p = SUIT_POWER[cards[i].suit] || 0;
        if (p > best) best = p;
      }
    }
    return best;
  }

  function compareBySuit(aCards, bCards, evalA) {
    if (evalA.type === 'pair') {
      var pairVal = evalA.vals[0];
      var kicker = evalA.vals[1];
      var pa = bestSuitAtValue(aCards, pairVal);
      var pb = bestSuitAtValue(bCards, pairVal);
      if (pa !== pb) return pa > pb ? 1 : -1;
      var ka = bestSuitAtValue(aCards, kicker);
      var kb = bestSuitAtValue(bCards, kicker);
      if (ka !== kb) return ka > kb ? 1 : -1;
      return 0;
    }
    for (var i = 0; i < 3; i++) {
      var v = evalA.vals[i];
      if (!v) continue;
      var rv = valToRankNum(v);
      var sa = bestSuitAtValue(aCards, rv);
      var sb = bestSuitAtValue(bCards, rv);
      if (sa !== sb) return sa > sb ? 1 : -1;
    }
    return 0;
  }

  /** 点数相同比花色（黑桃>红心>梅花>方块），保证无和局 */
  function compareHands(a, b, aCards, bCards) {
    if (a.score !== b.score) return a.score > b.score ? 1 : -1;
    for (var i = 0; i < 3; i++) {
      if (a.vals[i] !== b.vals[i]) return a.vals[i] > b.vals[i] ? 1 : -1;
    }
    if (aCards && bCards) {
      var bySuit = compareBySuit(aCards, bCards, a);
      if (bySuit !== 0) return bySuit;
    }
    return 1;
  }

  function pad3(n) { return n < 10 ? '00' + n : (n < 100 ? '0' + n : '' + n); }

  function findBetGroup(log, issue) {
    for (var i = 0; i < log.length; i++) { if (log[i].issue === issue) return log[i]; }
    return null;

  function appendBetLog(playKey, amount) {
    if (!currentBetIssue) currentBetIssue = nextBetIssue();
    var log = loadBetLog();
    var group = findBetGroup(log, currentBetIssue);
    if (!group) {
      group = {
        game: 'zhajinhua', issue: currentBetIssue, createdAt: new Date().toISOString(),
        settled: false, bets: [], totalAmount: 0, totalProfit: 0
      };
      log.unshift(group);
    }
    group.bets.push({
      play: PLAY_LABELS[playKey] || playKey, key: playKey,
      amount: amount, status: 'PENDING', profit: 0, winAmount: 0, hit: ''
    });
    group.totalAmount += amount;
    saveBetLog(log);
  }
  function settleBetLog(issue, result, bankerCards, playerCards) {
    if (!issue) return;
    var log = loadBetLog();
    var group = findBetGroup(log, issue);
    if (!group || group.settled) return;
    var bt = evalHand(bankerCards);
    var pt = evalHand(playerCards);
    var resName = result === 'player' ? '闲赢' : '庄赢';
    group.drawSummary = '庄 ' + bt.label + ' · 闲 ' + pt.label + ' · ' + resName;
    var totalProfit = 0;
    for (var i = 0; i < group.bets.length; i++) {
      var b = group.bets[i];
      var key = b.key;
      var odds = BET_ODDS[key];
      var win = false;
      if (key === 'banker') win = result === 'banker';
      else if (key === 'player') win = result === 'player';
      else win = sideBetHit(key, bt, pt, result);
      var ret = 0;
      if (win && typeof odds === 'number') ret = b.amount + Math.floor(b.amount * odds);
      b.winAmount = ret;
      b.profit = ret - b.amount;
      if (win) { b.status = 'WON'; b.hit = (PLAY_LABELS[key] || '') + ' 中'; }
      else { b.status = 'LOST'; b.hit = ''; }
      totalProfit += b.profit;
    }
    group.settled = true;
    group.settledAt = new Date().toISOString();
    group.totalProfit = totalProfit;
    saveBetLog(log);
  }

  function calcSettlement(result, bankerCards, playerCards) {
    var bt = evalHand(bankerCards);
    var pt = evalHand(playerCards);
    var stakeTotal = 0;
    var returnTotal = 0;
    var keys = Object.keys(betTotals);
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var stake = betTotals[key] || 0;
      if (stake <= 0) continue;
      stakeTotal += stake;
      var odds = BET_ODDS[key];
      if (typeof odds !== 'number') continue;
      var win = false;
      if (key === 'banker') win = result === 'banker';
      else if (key === 'player') win = result === 'player';
      else win = sideBetHit(key, bt, pt, result);
      if (win) returnTotal += stake + Math.floor(stake * odds);
    }
    return {
      stakeTotal: stakeTotal,
      returnTotal: returnTotal,
      profit: returnTotal - stakeTotal
    };
  }

    if (!settlement) return;
    /* 真派彩已由大脑完成；本地只更新展示统计 */
    if (!user) return;
    var s = getStats(user.uid);
    s.turnover = (s.turnover || 0) + (settlement.stakeTotal || 0);
    s.winloss = (s.winloss || 0) + (settlement.profit || 0);
    s.rebate = (s.rebate || 0) + Math.floor((settlement.stakeTotal || 0) * 0.005);

      localStorage.setItem('zjh_stats_' + user.uid, JSON.stringify(s));

  /* 比牌后：中奖玩法按钮金框呼吸高亮（参考斗牛 is-win），开新局清除 */
  function clearWinHighlight() {

  function highlightWinningBets(result, bankerCards, playerCards) {
    clearWinHighlight();

    var pt = evalHand(playerCards);

    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      var win;
      if (key === 'banker') win = result === 'banker';
      else if (key === 'player') win = result === 'player';
            else win = sideBetHit(key, bt, pt, result);

  function chipsOn(key) {
    var btn = betBtn(key);

  function getWinLoseKeys(result) {
    var bt = lastHands ? evalHand(lastHands.banker) : { type: '' };
    var pt = lastHands ? evalHand(lastHands.player) : { type: '' };
    var all = ['banker', 'player', 'shunjin', 'baozi', 'san2', 'san3', 'san6', 'san7'];
    var win = [];
    var lose = [];
    /* 主胜区始终作为飞入目标（即使该区暂无筹码） */
    if (result === 'banker') win.push('banker');
    else if (result === 'player') win.push('player');
    for (var i = 0; i < all.length; i++) {
      var k = all[i];
      var has = chipsOn(k).length > 0;
      var isWin = false;
      if (k === 'banker') isWin = result === 'banker';
      else if (k === 'player') isWin = result === 'player';
      else isWin = sideBetHit(k, bt, pt, result);
      if (isWin) {
        if (win.indexOf(k) < 0 && (has || k === 'banker' || k === 'player')) win.push(k);
      } else if (has) {
        lose.push(k);
      }
    }
    return { win: win, lose: lose };
  }

  function collectPayout(result, settlement) {
    return new Promise(function (resolve) {
      stopOtherBetting();
      /* 庄赢/闲赢/和已在比牌时报过，这里不再叠播结果音，避免听成两遍 */
      if (settlement && settlement.returnTotal > 0) sfx('credit-loop-in', { vol: 0.7 });
      if (!payoutFlyLayer) {
        applySettlement(settlement);
        resolve();
        return;
      }
      payoutFlyLayer.innerHTML = '';

      var scoreEl = document.getElementById('statBalance') || statsBar;
      var playersIcon = document.querySelector('.zjh-players__icon') || document.getElementById('playersBox');
      var scoreRect = scoreEl ? layerRect(scoreEl) : null;
      var playersRect = playersIcon ? layerRect(playersIcon) : null;
      var landSize = barChipSize() * CHIP_LAND_SCALE;
      var wl = getWinLoseKeys(result);
      var winKeys = wl.win;
      var loseKeys = wl.lose;

      /* 收集输方筹码（保留归属） */
      var moving = [];
      for (var li = 0; li < loseKeys.length; li++) {
        var limgs = chipsOn(loseKeys[li]);
        for (var j = 0; j < limgs.length; j++) {
          moving.push({
            img: limgs[j],
            owner: limgs[j].getAttribute('data-owner') || 'other',
            value: parseInt(limgs[j].getAttribute('data-value'), 10) || 1,
            src: limgs[j].getAttribute('src') || CHIP_SRC[1]
          });
        }
      }

      var phase1 = [];
      if (moving.length && winKeys.length) {
        for (var mi = 0; mi < moving.length; mi++) {
          (function (chip, idx) {
            var targetKey = winKeys[idx % winKeys.length];
            var winBtn = betBtn(targetKey);
            if (!winBtn) return;
            var winBox = winBtn.querySelector('.zjh-bet-btn__chips') || winBtn;
            var winArea = layerRect(winBox);
            var src = layerRect(chip.img);
            var jx = (Math.random() - 0.5) * winArea.width * 0.55;
            var jy = (Math.random() - 0.5) * winArea.height * 0.45;
            var dst = { cx: winArea.cx + jx, cy: winArea.cy + jy, width: landSize, height: landSize };
            var slot = pickSlot(targetKey);
            phase1.push(delay(idx * 35).then(function () {
              /* 尺寸异常时勿先隐掉，否则刷新后筹码会直接消失 */
              if (src.width < 2 || src.height < 2) {
                placeChipOnBtn(winBtn, chip.value, slot, landSize,
                  (betTotals[targetKey] || 0) > 0 ? 'me' : 'other');
                chip.img.style.opacity = '0';
                return Promise.resolve();
              }
              chip.img.style.opacity = '0';
              return flyChipAbs(
                src, dst, chip.src, COLLECT_MS,
                landSize / Math.max(12, Math.min(src.width, src.height) || landSize)
              ).then(function () {
                /* 收来的筹码：自己在该赢区有注→算自己赢的；否则归他人→飞人数 */
                var potOwner = (betTotals[targetKey] || 0) > 0 ? 'me' : 'other';
                placeChipOnBtn(winBtn, chip.value, slot, landSize, potOwner);
              });
            }));
          })(moving[mi], mi);
        }
      } else if (moving.length && playersRect) {
        /* 无赢方：全部飞回人数图标消失 */
        for (var oi = 0; oi < moving.length; oi++) {
          (function (chip, idx) {
            var src = layerRect(chip.img);
            phase1.push(delay(idx * 30).then(function () {
              chip.img.style.opacity = '0';
              return flyChipAbs(src, playersRect, chip.src, TO_SCORE_MS, 0.35);
            }));
          })(moving[oi], oi);
        }
      }

      Promise.all(phase1).then(function () {
        for (var c = 0; c < loseKeys.length; c++) clearBetVisual(loseKeys[c]);

        /* 赢方区：自己的→积分，别人的→人数图标 */
        var meList = [];
        var otherList = [];
        for (var w = 0; w < winKeys.length; w++) {
          var wimgs = chipsOn(winKeys[w]);
          for (var n = 0; n < wimgs.length; n++) {
            if ((wimgs[n].getAttribute('data-owner') || 'other') === 'me') meList.push(wimgs[n]);
            else otherList.push(wimgs[n]);
          }
        }

        function trimList(arr, maxN) {
          if (arr.length <= maxN) return arr;
          var step = Math.ceil(arr.length / maxN);
          return arr.filter(function (_, i) { return i % step === 0; }).slice(0, maxN);
        }
        meList = trimList(meList, 12);
        otherList = trimList(otherList, 12);

        var phase2 = [];
        meList.forEach(function (img, idx) {
          if (!scoreRect) return;
          phase2.push(delay(idx * 38).then(function () {
            var src = layerRect(img);
            var srcUrl = img.getAttribute('src') || CHIP_SRC[1];
            img.style.opacity = '0';
            return flyChipAbs(src, scoreRect, srcUrl, TO_SCORE_MS, 0.42);
          }));
        });
        otherList.forEach(function (img, idx) {
          if (!playersRect) return;
          phase2.push(delay(idx * 38).then(function () {
            var src = layerRect(img);
            var srcUrl = img.getAttribute('src') || CHIP_SRC[1];
            img.style.opacity = '0';
            return flyChipAbs(src, playersRect, srcUrl, TO_SCORE_MS, 0.35);
          }));
        });

        return Promise.all(phase2).then(function () {
          /* 清空桌面筹码视觉，结算只计自己 */
          var allKeys = ['banker', 'player', 'shunjin', 'baozi', 'san2', 'san3', 'san6', 'san7'];
          for (var a = 0; a < allKeys.length; a++) clearBetVisual(allKeys[a]);
          if (settlement && settlement.returnTotal > 0) sfx('win', { vol: 0.85 });
          applySettlement(settlement);
          resolve();
        });
      }).catch(function () {
        applySettlement(settlement);
        resolve();
      });
    });
  }

  var roomEl = document.querySelector('.zjh-room');

  function paint(doBeat) {
    box.classList.remove('is-urgent', 'is-critical', 'is-draw', 'is-payout');
    timeEl.classList.remove('is-beat');
    if (alignWaiting) {
      box.classList.add('is-payout');

    if (phase === 'draw') {
      box.classList.add('is-draw');
      timeEl.textContent = '开奖中';

      return;

    if (phase === 'payout') {
      box.classList.add('is-payout');
      timeEl.textContent = '派奖中';

      return;

    timeEl.textContent = String(left);
    if (left <= 10) box.classList.add('is-urgent');

  function showPhaseBanner(kind) {

  function startBetRound() {
    clearAlignWait();
    var remain = getBetRemainSec();
    if (remain <= 0) {
      alignWaiting = true;
      phase = 'payout';
      roundBusy = false;
      currentBetIssue = '';
      left = 0;
      lastBeatSec = -1;
      var wait = Math.max(0.05, getAlignedWaitRemain());
      payoutDeadline = Date.now() + wait * 1000;
      stopOtherBetting();
      paint(false);
      syncActionButtons();
      alignWaitTimer = setTimeout(startBetRound, Math.ceil(wait * 1000));
      return;
    }
    alignWaiting = false;
    phase = 'bet';
    roundBusy = false;
      /* 与服务端局号对齐，便于同局刷新后还原假筹 */
    var rn = (serverClock && serverClock.roundNo) ? String(serverClock.roundNo) : '';
    currentBetIssue = rn || '';
    left = Math.max(1, Math.ceil(remain));
    payoutLeft = 0;
    lastBeatSec = -1;
    betDeadline = Date.now() + remain * 1000;
    payoutDeadline = 0;
    hideAllCards();
      /* 同局刷新：保留 session 假筹缓存；换局才清空 */
    var keepPersist = !!(rn && peekPersistedChipRound() === rn);
    commitRoundBets({ keepPersist: keepPersist });
    paint(false);
    syncActionButtons();
    if (rn) ensureChipsHydrated(rn);
    startOtherBetting();
    ensureBgm(true);
    if (remain >= TOTAL - 1.5) showPhaseBanner('start');
  }

  /* ---------- 开奖时间轴：墙上时钟 seek（进注单/刷新按服务端进度对齐） ---------- */
  var drawClock = null;

  function dealAnimTotalMs() {
    var n = DEAL_ORDER.length;
    return n * FLY_MS + Math.max(0, n - 1) * GAP_MS;
  }
  function flipAnimTotalMs() {
    var n = DEAL_ORDER.length;
    return n * FLIP_MS + Math.max(0, n - 1) * FLIP_GAP_MS;
  }
  function voiceAnimTotalMs(bt, pt, result) {
    var ms = 0;
    var bk = bt && HAND_VOICE[bt.type];
    var pk = pt && HAND_VOICE[pt.type];
    if (bk) ms += (VOICE_MS[bk] || 1400) + 400;
    if (pk) ms += (VOICE_MS[pk] || 1400) + 400;
    var rk = result === 'player' ? 'voice/player-win' : 'voice/banker-win';
    ms += (VOICE_MS[rk] || 1600) + 400;
    return ms;
  }

  /** 根据 snapshot 推算本局开奖已进行多少毫秒（相对 DRAWING 起点） */
  function drawElapsedMsFromSnap(snap) {
    if (!snap) return 0;
    var drawMs = (snap.timing && snap.timing.drawMs) || DRAW_EST_SEC * 1000;
    var settleMs = (snap.timing && snap.timing.settleMs) || PAYOUT_SECS * 1000;
    var leftMs = Math.max(0, (Number(snap.secondsLeft) || 0) * 1000);
    if (snap.phase === 'DRAWING') return Math.max(0, drawMs - leftMs);
    if (snap.phase === 'SETTLED') return drawMs + Math.max(0, settleMs - leftMs);
    return 0;
  }

  var BET_CHIP_KEYS = ['banker', 'player', 'shunjin', 'baozi', 'san2', 'san3', 'san6', 'san7'];
  var CHIP_CACHE_KEY = 'zjh_table_chips_v1';
  var chipsHydratedRound = '';
  var chipsHydratePromise = Promise.resolve();
  var persistChipsTimer = null;
  var restoringChips = false;

  function peekPersistedChipRound() {
    try {
      var data = JSON.parse(sessionStorage.getItem(CHIP_CACHE_KEY) || 'null');
      return data && data.roundNo ? String(data.roundNo) : '';
    } catch (ePeek) {
      return '';
    }
  }

  function tableHasChipVisuals() {
    for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
      if (chipsOn(BET_CHIP_KEYS[i]).length) return true;
    }
    return false;
  }

  function currentChipRoundNo() {
    if (drawClock && drawClock.roundNo) return String(drawClock.roundNo);
    if (currentBetIssue) return String(currentBetIssue);
    if (serverClock && serverClock.roundNo) return String(serverClock.roundNo);
    return '';
  }

  /** 持久化桌面筹码（含气氛假筹），刷新/进注单后可还原 */
  function persistTableChips(forceRound) {
    var rn = forceRound ? String(forceRound) : currentChipRoundNo();
    if (!rn) return;
    var chips = [];
    for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
      var key = BET_CHIP_KEYS[i];
      var imgs = chipsOn(key);
      for (var j = 0; j < imgs.length; j++) {
        var img = imgs[j];
        chips.push({
          key: key,
          value: parseInt(img.getAttribute('data-value'), 10) || 1,
          owner: img.getAttribute('data-owner') || 'other',
          x: parseFloat(img.style.getPropertyValue('--chip-x')) || 50,
          y: parseFloat(img.style.getPropertyValue('--chip-y')) || 50,
          w: parseFloat(img.style.getPropertyValue('--chip-w')) || 24,
          z: parseInt(img.style.getPropertyValue('--chip-z'), 10) || 10
        });
      }
    }
    try {
      sessionStorage.setItem(
        CHIP_CACHE_KEY,
        JSON.stringify({ roundNo: rn, chips: chips, at: Date.now() })
      );
    } catch (ePer) { /* ignore quota */ }
  }

  function schedulePersistTableChips() {
    if (persistChipsTimer) clearTimeout(persistChipsTimer);
    persistChipsTimer = setTimeout(function () {
      persistChipsTimer = null;
      persistTableChips();
    }, 80);
  }

  function clearPersistedTableChips() {
    try { sessionStorage.removeItem(CHIP_CACHE_KEY); } catch (eClr) { /* ignore */ }
  }

  function restorePersistedTableChips(roundNo) {
    var rn = roundNo ? String(roundNo) : '';
    if (!rn) return false;
    var data = null;
    try {
      data = JSON.parse(sessionStorage.getItem(CHIP_CACHE_KEY) || 'null');
    } catch (eParse) {
      return false;
    }
    if (!data || String(data.roundNo) !== rn || !data.chips || !data.chips.length) return false;
    var landSize = hydrateLandSize();
    restoringChips = true;
    try {
      for (var c = 0; c < BET_CHIP_KEYS.length; c++) clearBetVisual(BET_CHIP_KEYS[c]);
      for (var i = 0; i < data.chips.length; i++) {
        var item = data.chips[i];
        var btn = betBtn(item.key);
        if (!btn) continue;
        var slot = {
          x: Number(item.x) || 50,
          y: Number(item.y) || 50,
          layer: Math.max(0, (Number(item.z) || 10) - 10)
        };
        var w = Number(item.w) || landSize;
        placeChipOnBtn(btn, item.value, slot, Math.max(22, w), item.owner || 'other');
      }
      chipsHydratedRound = rn;
    } finally {
      restoringChips = false;
    }
    return true;
  }

  function summaryAmount(summary, key) {
    if (!summary) return 0;
    var want = String(key || '').toLowerCase();
    var total = 0;
    var keys = Object.keys(summary);
    for (var i = 0; i < keys.length; i++) {
      if (String(keys[i]).toLowerCase() === want) {
        total += Math.floor(Number(summary[keys[i]]) || 0);
      }
    }
    return Math.max(0, total);
  }

  function splitAmountToChips(amount) {
    var left = Math.max(0, Math.floor(Number(amount) || 0));
    if (left <= 0) return [];
    var dens = [2000, 1000, 500, 100, 50, 10, 5, 1];
    var out = [];
    for (var i = 0; i < dens.length; i++) {
      while (left >= dens[i] && out.length < 20) {
        out.push(dens[i]);
        left -= dens[i];
      }
    }
    if (!out.length) out.push(1);
    return out;
  }

  function hydrateLandSize() {
    var scale = typeof CHIP_LAND_SCALE === 'number' ? CHIP_LAND_SCALE : 2 / 3;
    var raw = 48;
    try {
      if (typeof barChipSize === 'function') raw = barChipSize() || 48;
    } catch (eSz) { /* ignore */ }
    return Math.max(22, raw * scale);
  }

  function paintChipsForSide(key, mineAmt, otherAmt) {
    var btn = betBtn(key);
    if (!btn) return;
    clearBetVisual(key);
    var landSize = hydrateLandSize();
    function placeList(list, owner) {
      if (!list.length) return;
      var maxN = 8;
      var step = list.length > maxN ? Math.ceil(list.length / maxN) : 1;
      var placed = 0;
      for (var i = 0; i < list.length && placed < maxN; i += step) {
        placeChipOnBtn(btn, list[i], pickSlot(key), landSize, owner);
        placed += 1;
      }
    }
    placeList(splitAmountToChips(otherAmt), 'other');
    placeList(splitAmountToChips(mineAmt), 'me');
    betTotals[key] = Math.max(0, Math.floor(Number(mineAmt) || 0));
    updateStakeUI(btn, betTotals[key]);
  }

  function fetchMineBySide(rn) {
    if (!window.App || !App.fetchMyTableBets || !rn) return Promise.resolve({});
    return App.fetchMyTableBets(SERVER_GAME, rn)
      .then(function (mine) {
        var map = {};
        var bets = (mine && mine.bets) || [];
        for (var b = 0; b < bets.length; b++) {
          var side = String(bets[b].betType || '').toLowerCase();
          if (!side) continue;
          map[side] = (map[side] || 0) + Math.floor(Number(bets[b].amount) || 0);
        }
        return map;
      })
      .catch(function () {
        return {};
      });
  }

  function applyMineTotals(mineBySide) {
    mineBySide = mineBySide || {};
    roundPlacements = [];
    for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
      var key = BET_CHIP_KEYS[i];
      var mine = Math.max(0, Math.floor(Number(mineBySide[key]) || 0));
      betTotals[key] = mine;
      if (mine > 0) roundPlacements.push({ key: key, value: mine });
      var btn = betBtn(key);
      if (btn) updateStakeUI(btn, mine);
    }
  }

  /**
   * 刷新/中途进房还原筹码：
   * 1) 优先用 session 缓存（含气氛假筹）
   * 2) 否则用 betSummary + 我的注单重建
   */
  function hydrateTableChips(snap) {
    var rn = snap && snap.roundNo ? String(snap.roundNo) : '';
    if (rn && chipsHydratedRound === rn && tableHasChipVisuals()) {
      return Promise.resolve();
    }
    var summary = (snap && snap.betSummary) || {};

    /* 先还原本局缓存的桌面（假筹+真筹），再对齐我的下注额 */
    if (rn && restorePersistedTableChips(rn)) {
      chipsHydratePromise = fetchMineBySide(rn).then(function (mineBySide) {
        applyMineTotals(mineBySide);
        schedulePersistTableChips();
      });
      return chipsHydratePromise;
    }

    function applyMineMap(mineBySide) {
      mineBySide = mineBySide || {};
      roundPlacements = [];
      var any = false;
      for (var i = 0; i < BET_CHIP_KEYS.length; i++) {
        var key = BET_CHIP_KEYS[i];
        var total = summaryAmount(summary, key);
        var mine = Math.max(0, Math.floor(Number(mineBySide[key]) || 0));
        if (mine > total) total = mine;
        var other = Math.max(0, total - mine);
        if (mine > 0) roundPlacements.push({ key: key, value: mine });
        if (total <= 0) {
          clearBetVisual(key);
          betTotals[key] = 0;
          var emptyBtn = betBtn(key);
          if (emptyBtn) updateStakeUI(emptyBtn, 0);
          continue;
        }
        any = true;
        paintChipsForSide(key, mine, other);
      }
      if (any || roundPlacements.length) chipsHydratedRound = rn || chipsHydratedRound;
      if (tableHasChipVisuals()) schedulePersistTableChips();
    }

    chipsHydratePromise = fetchMineBySide(rn).then(applyMineMap);
    return chipsHydratePromise;
  }

  function ensureChipsHydrated(roundNo, snap) {
    var rn = roundNo ? String(roundNo) : '';
    if (rn && chipsHydratedRound === rn && tableHasChipVisuals()) {
      return Promise.resolve();
    }
    if (snap) return hydrateTableChips(snap);
    if (window.App && App.fetchTableSnapshot) {
      return App.fetchTableSnapshot(SERVER_GAME).then(function (s) {
        if (s) applyServerSnap(s);
        return hydrateTableChips(s || { roundNo: rn, betSummary: {} });
      });
    }
    return hydrateTableChips({ roundNo: rn, betSummary: {} });
  }

  /**
   * 中途进入 / 从注单返回：按服务端进度进入或对齐开奖轴。
   * 避免 startBetRound 在 DRAWING 时掉进「准备中」等到下一局。
   */
  function joinOrSeekDraw(snap) {
    if (!snap || !snap.outcome) return false;
    if (snap.phase !== 'DRAWING' && snap.phase !== 'SETTLED') return false;
    var rn = snap.roundNo ? String(snap.roundNo) : '';
    var elapsed = drawElapsedMsFromSnap(snap);
    clearAlignWait();
    alignWaiting = false;
    stopOtherBetting();

    var same =
      drawClock &&
      phase === 'draw' &&
      drawClock.outcome &&
      (!rn || !drawClock.roundNo || drawClock.roundNo === rn);

    if (!same) {
      roundSeq += 1;
      roundBusy = true;
      phase = 'draw';
      hideAllCards();
      clearWinHighlight();
      drawClock = {
        seq: roundSeq,
        anchorAt: Date.now() - elapsed,
        lastAdvAt: 0,
        roundNo: rn,
        outcome: null,
        hands: null,
        compared: null,
        dealBaseAt: 0,
        voiceMs: 3000,
        dealStarted: {},
        flipStarted: {},
        flags: { compared: false, road: false, voice: false, payout: false }
      };
    } else {
      /* 已有本局时钟：按服务端进度重锚，避免暂停偏移导致整段空白 */
      drawClock.anchorAt = Date.now() - elapsed;
      if (drawClock.dealBaseAt) {
        drawClock.dealBaseAt = drawClock.anchorAt + BANNER_MS;
      }
    }

    bindDrawOutcome(snap);
    if (!drawClock.dealBaseAt) drawClock.dealBaseAt = drawClock.anchorAt + BANNER_MS;
    drawClock.dealStarted = {};
    drawClock.flipStarted = {};
    /* 先还原筹码并等一帧布局，再 seek（避免筹码宽高为 0 / 立刻被派奖清掉） */
    var seqAtJoin = drawClock.seq;
    hydrateTableChips(snap).then(function () {
      if (!drawClock || drawClock.seq !== seqAtJoin) return;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          if (!drawClock || drawClock.seq !== seqAtJoin) return;
            /* 若仍空（summary 异常），再强拉一次我的注单 */
          if (!tableHasChipVisuals()) {
            chipsHydratedRound = '';
            hydrateTableChips(snap).then(function () {
              if (!drawClock || drawClock.seq !== seqAtJoin) return;
              drawClock.forceSeek = true;
              advanceDrawClock();
            });
            return;
          }
          drawClock.forceSeek = true;
          advanceDrawClock();
        });
      });
    });
    return true;
  }

  function abortDrawAndRealign() {
    roundSeq += 1;
    drawClock = null;
    roundBusy = false;
    try { flyLayer.innerHTML = ''; } catch (e0) { /* ignore */ }
    hideAllCards();
    clearWinHighlight();
    startBetRound();
  }

  function bindDrawOutcome(snap) {
    if (!drawClock || !snap || !snap.outcome) return false;
    if (drawClock.outcome) return true;
    var rn = snap.roundNo ? String(snap.roundNo) : drawClock.roundNo;
    if (drawClock.roundNo && rn && drawClock.roundNo !== rn) {
      /* 允许空 roundNo 绑定时补齐 */
    }
    if (rn) {
      drawClock.roundNo = rn;
      currentBetIssue = rn;
      setRoundNoLabel(rn);
    }
    var forced = snap.outcome;
    var banker = (forced.banker || []).slice(0, 3);
    var player = (forced.player || []).slice(0, 3);
    if (banker.length < 3 || player.length < 3) return false;
    drawClock.outcome = forced;
    drawClock.hands = { banker: banker, player: player };
    lastHands = drawClock.hands;
    roundCards = {
      b1: banker[0], b2: banker[1], b3: banker[2],
      p1: player[0], p2: player[1], p3: player[2]
    };
    for (var i = 0; i < DEAL_ORDER.length; i++) {
      setSlotFace(DEAL_ORDER[i], roundCards[DEAL_ORDER[i]]);
    }
    /* 发牌基准锚定开奖开始+横幅；结果晚到时由 advance 按时钟 seek 追上 */
    if (!drawClock.dealBaseAt) {
      drawClock.dealBaseAt = drawClock.anchorAt + BANNER_MS;
    }
    return true;
  }

  function syncDealFlipByClock(t, jumping) {
    if (!drawClock || !drawClock.hands) return;
    var step = FLY_MS + GAP_MS;
    var i;
    var id;
    var slot;
    var start;
    var layoutOk = true;
    try {
      var shoeR = shoe.getBoundingClientRect();
      if (shoeR.width < 2 || shoeR.height < 2) layoutOk = false;
    } catch (eLay) { layoutOk = false; }
    /* 布局未恢复或跳点时禁止启动 fly，改为时钟瞬时落牌 */
    var instant = jumping || !layoutOk || document.hidden;
    for (i = 0; i < DEAL_ORDER.length; i++) {
      id = DEAL_ORDER[i];
      slot = room.querySelector('.zjh-card[data-slot="' + id + '"]');
      if (!slot) continue;
      start = i * step;
      if (t < start) {
        slot.classList.remove('is-dealt', 'is-flipped');
        continue;
      }
      if (instant || t >= start + FLY_MS || drawClock.dealStarted[id] === 'done') {
        slot.classList.add('is-dealt');
        if (t < dealAnimTotalMs() + DEAL_HOLD_MS) slot.classList.remove('is-flipped');
        drawClock.dealStarted[id] = 'done';
      } else if (!drawClock.dealStarted[id]) {
        drawClock.dealStarted[id] = 'flying';
        (function (sid) {
          flyOne(sid).then(function () {
            if (drawClock) drawClock.dealStarted[sid] = 'done';
          });
        })(id);
      }
    }
    if (t >= dealAnimTotalMs()) {
      try { flyLayer.innerHTML = ''; } catch (e1) { /* ignore */ }
    }

    var holdEnd = dealAnimTotalMs() + DEAL_HOLD_MS;
    if (t < holdEnd) return;
    var fstep = FLIP_MS + FLIP_GAP_MS;
    for (i = 0; i < DEAL_ORDER.length; i++) {
      id = DEAL_ORDER[i];
      slot = room.querySelector('.zjh-card[data-slot="' + id + '"]');
      if (!slot) continue;
      start = holdEnd + i * fstep;
      slot.classList.add('is-dealt');
      if (t < start) {
        slot.classList.remove('is-flipped');
        continue;
      }
      if (instant || t >= start + FLIP_MS || drawClock.flipStarted[id] === 'done') {
        slot.classList.add('is-flipped');
        drawClock.flipStarted[id] = 'done';
      } else if (!drawClock.flipStarted[id]) {
        drawClock.flipStarted[id] = 'flying';
        (function (sid) {
          flipOne(sid).then(function () {
            if (drawClock) drawClock.flipStarted[sid] = 'done';
          });
        })(id);
      }
    }
  }

  function beginDrawPayout(dc, jumping) {
    if (!dc || dc.flags.payout) return;
    dc.flags.payout = true;
    var result = dc.compared ? dc.compared.result : 'banker';
    var hands = dc.hands;
    var settlement = calcSettlement(result, hands.banker, hands.player);
    var roundIssue = dc.roundNo || '';

    function finishBusy() {
      if (window.App && App.refreshBalance) {
        App.refreshBalance().then(function () { refreshStats(); });
      } else if (typeof refreshStats === 'function') {
        refreshStats();
      }
      roundBusy = false;
      paint(false);
    }

    function applyMine() {
      settleBetLog(roundIssue, result, hands.banker, hands.player);
      phase = 'payout';
      var remainPayout = Math.max(0.4, PAYOUT_SECS - 0.05);
      /* 跳点对齐时派奖窗略缩短，但仍播飞筹码 */
      if (jumping) remainPayout = Math.min(Math.max(remainPayout, 2.2), PAYOUT_SECS);
      payoutLeft = Math.ceil(remainPayout);
      payoutDeadline = Date.now() + remainPayout * 1000;
      paint(false);
      syncActionButtons();
      /* 仅页面不可见时跳过飞筹码；seek/刷新后可见必须播 */
      if (document.hidden) {
        var allKeys = BET_CHIP_KEYS;
        for (var a = 0; a < allKeys.length; a++) clearBetVisual(allKeys[a]);
        applySettlement(settlement);
        finishBusy();
        return Promise.resolve();
      }
      return ensureChipsHydrated(roundIssue).then(function () {
          /* 给还原的筹码一帧可见时间，再开飞筹码 */
        return new Promise(function (resolve) {
          requestAnimationFrame(function () {
            resolve(collectPayout(result, settlement).then(finishBusy));
          });
        });
      });
    }

    var run = function () {
      if (window.App && App.fetchMyTableBets && roundIssue) {
        return App.fetchMyTableBets(SERVER_GAME, roundIssue).then(function (mine) {
          if (mine && typeof mine.totalPayout === 'number') {
            settlement.returnTotal = Math.floor(mine.totalPayout);
            if (typeof mine.totalStake === 'number') settlement.stakeTotal = mine.totalStake;
            settlement.profit = settlement.returnTotal - settlement.stakeTotal;
          }
          return applyMine();
        }).catch(function () { return applyMine(); });
      }
      return applyMine();
    };
    run().catch(function (err) {
      console.error(err);
      finishBusy();
    });
  }

  function advanceDrawClock() {
    if (!drawClock || drawClock.seq !== roundSeq) return;
    var now = Date.now();
    var elapsed = now - drawClock.anchorAt;
      /* forceSeek / 挂起后间隔过大 → 按墙上时钟跳点对齐当前时刻 */
    var jumping = !!drawClock.forceSeek ||
      (!!drawClock.lastAdvAt && (now - drawClock.lastAdvAt) > 420);
    drawClock.forceSeek = false;
    drawClock.lastAdvAt = now;

    if (elapsed > (DRAW_EST_SEC + PAYOUT_SECS + 12) * 1000) {
      abortDrawAndRealign();
      return;
    }

      /* 服务端已进入下一局下注：本局仪式应结束 */
    if (
      drawClock.outcome &&
      serverClock.phase === 'BETTING' &&
      Number(serverClock.secondsLeft) > 0 &&
      elapsed > BANNER_MS + dealAnimTotalMs() + 500
    ) {
      var tCheck = now - drawClock.dealBaseAt;
      var ceremonyEnd = dealAnimTotalMs() + DEAL_HOLD_MS + flipAnimTotalMs() + (drawClock.voiceMs || 2500);
      if (tCheck >= ceremonyEnd || elapsed > (DRAW_EST_SEC + 2) * 1000) {
        if (!drawClock.flags.payout) beginDrawPayout(drawClock, true);
        if (phase === 'payout' || drawClock.flags.payout) {
          /* 交给 payout tick 收尾进下一局 */
        }
      }
    }

    if (!drawClock.outcome) {
      paint(false);
      return;
    }

    var t = now - drawClock.dealBaseAt;
    if (t < 0) {
      paint(false);
      return;
    }

    var dealEnd = dealAnimTotalMs();
    var holdEnd = dealEnd + DEAL_HOLD_MS;
    var flipEnd = holdEnd + flipAnimTotalMs();
    syncDealFlipByClock(t, jumping);

    if (t >= holdEnd && !drawClock.flags.compared) {
      drawClock.compared = showCompare(drawClock.hands.banker, drawClock.hands.player, drawClock.outcome);
      lastRoundResult = drawClock.compared.result;
      if (drawClock.roundNo) lastSettledRoundNo = String(drawClock.roundNo);
      drawClock.voiceMs = voiceAnimTotalMs(
        drawClock.compared.bankerType,
        drawClock.compared.playerType,
        drawClock.compared.result
      );
      drawClock.flags.compared = true;
    }

    if (t >= flipEnd && drawClock.compared && !drawClock.flags.road) {
      pushRoad(drawClock.compared.result, drawClock.roundNo);
      highlightWinningBets(drawClock.compared.result, drawClock.hands.banker, drawClock.hands.player);
      drawClock.flags.road = true;
    }

    var voiceEnd = flipEnd + (drawClock.voiceMs || 3000);
    if (t >= flipEnd && drawClock.compared && !drawClock.flags.voice) {
      drawClock.flags.voice = true;
      if (!jumping && !document.hidden) {
        announceShowdown(
          drawClock.compared.bankerType,
          drawClock.compared.playerType,
          drawClock.compared.result
        );
      }
    }

    if (t >= voiceEnd && !drawClock.flags.payout) {
      beginDrawPayout(drawClock, jumping);
    }

    paint(false);
    syncActionButtons();
  }

  function startDrawRound() {
    /* 立刻锁局，防止 tick 重入 */
    if (roundBusy || phase !== 'bet') return;
    roundBusy = true;
    phase = 'draw';
    var seq = ++roundSeq;
    var roundIssue = currentBetIssue || '';
    stopOtherBetting();
    /* 封盘瞬间落盘（含气氛假筹），刷新开奖中也能还原 */
    persistTableChips(roundIssue || currentChipRoundNo());
    paint(false);
    syncActionButtons();
    hideAllCards();

    drawClock = {
      seq: seq,
      anchorAt: Date.now(),
      lastAdvAt: 0,
      roundNo: roundIssue,
      outcome: null,
      hands: null,
      compared: null,
      dealBaseAt: 0,
      voiceMs: 3000,
      dealStarted: {},
      flipStarted: {},
      flags: { compared: false, road: false, voice: false, payout: false }
    };

    /* 横幅不阻塞时间轴；发牌基准至少在横幅之后 */
    showPhaseBanner('stop');

    if (!window.App || !App.waitTableOutcome) {
      if (window.App && App.toast) App.toast('请从大厅进入游戏');
      abortDrawAndRealign();
      return;
    }

    var expectedRound = roundIssue;
    var prep = expectedRound
      ? Promise.resolve(expectedRound)
      : (App.fetchTableSnapshot
        ? App.fetchTableSnapshot(SERVER_GAME).then(function (pre) {
            return pre && pre.roundNo ? String(pre.roundNo) : '';
          }).catch(function () { return ''; })
        : Promise.resolve(''));

    prep.then(function (rn) {
      if (!drawClock || drawClock.seq !== seq) return null;
      expectedRound = rn || expectedRound;
      if (expectedRound) drawClock.roundNo = expectedRound;
      return App.waitTableOutcome(SERVER_GAME, {
        timeoutMs: 25000,
        roundNo: expectedRound || undefined,
      });
    }).then(function (snap) {
      if (!drawClock || drawClock.seq !== seq) return;
      if (!snap || !snap.outcome) throw new Error('开奖结果缺失');
      bindDrawOutcome(snap);
      advanceDrawClock();
    }).catch(function (err) {
      console.error(err);
      if (!drawClock || drawClock.seq !== seq) return;
      if (window.App && App.toast) App.toast((err && err.message) || '开奖失败，请稍候');
      clearBets();
      currentBetIssue = '';
      if (window.App && App.refreshBalance) {
        App.refreshBalance().then(function () { refreshStats(); });
      }
      abortDrawAndRealign();
    });
  }

  function tick() {
    var now = Date.now();
    if (phase === 'draw') {
      advanceDrawClock();
      return;
    }
    if (phase === 'payout' || alignWaiting) {
      payoutLeft = Math.max(0, Math.ceil((payoutDeadline - now) / 1000));
      if (alignWaiting && (now >= payoutDeadline || getBetRemainSec() > 0)) {
        startBetRound();
        return;
      }
      if (!alignWaiting && payoutLeft <= 0) {
        drawClock = null;
        startBetRound();
        return;
      }
      paint(false);
      return;
    }
    if (roundBusy) return;
    left = Math.max(0, Math.ceil(getBetRemainSec()));
    var doBeat = left !== lastBeatSec;
    if (doBeat) lastBeatSec = left;
    paint(doBeat);
    if (left <= 0) startDrawRound();
  }

  /* 定时器改到全文末尾、startBetRound 之后再启动 */

  /* ---------- 筹码选择 + 下注飞入 ---------- */
  var CHIP_FLY_MS = 420;
  var CHIP_LAND_SCALE = 2 / 3;
  var CHIP_SRC = {
    1: './assets/ui/chips/chip-1.png?v=4',
    5: './assets/ui/chips/chip-5.png?v=4',

  };

  ];
  var chipPage = 0;
  /* 落点数量：庄/闲/顺金/豹子=20，散牌/对子/顺子/金花=10 */
  var SLOT_COUNT = {

  var lastRoundPlacements = []; /* 仅上一局，不能隔局 */
  var rebetting = false;

  function buildSlots(count) {
    /* 真正散落：随机撒点 + 最小间距，避免网格感 */
    var slots = [];
    var minDist = count >= 20 ? 14 : 18;
    var padX = 8;
    var padY = 10;
    var tries = 0;
    var maxTries = count * 80;
    while (slots.length < count && tries < maxTries) {
      tries++;
      var x = padX + Math.random() * (100 - padX * 2);
      var y = padY + Math.random() * (100 - padY * 2);
      var ok = true;
      for (var i = 0; i < slots.length; i++) {
        var dx = x - slots[i].x;
        var dy = y - slots[i].y;
        if (dx * dx + dy * dy < minDist * minDist) {
          ok = false;
          break;
        }
      }
      if (ok) slots.push({ x: x, y: y });
    }
    /* 若随机不够，放宽间距补齐 */
    while (slots.length < count) {
      minDist *= 0.85;
      var filled = false;
      for (var t = 0; t < 40 && slots.length < count; t++) {
        var x2 = padX + Math.random() * (100 - padX * 2);
        var y2 = padY + Math.random() * (100 - padY * 2);
        var ok2 = true;
        for (var j = 0; j < slots.length; j++) {
          var dx2 = x2 - slots[j].x;
          var dy2 = y2 - slots[j].y;
          if (dx2 * dx2 + dy2 * dy2 < minDist * minDist) {
            ok2 = false;
            break;
          }
        }
        if (ok2) {
          slots.push({ x: x2, y: y2 });
          filled = true;
        }
      }
      if (!filled) {
        slots.push({
          x: padX + Math.random() * (100 - padX * 2),
          y: padY + Math.random() * (100 - padY * 2)
        });
      }
    }
    return slots;
  }

  function getSlots(key) {
    if (!slotCache[key]) {
      slotCache[key] = buildSlots(SLOT_COUNT[key] || 10);
    }
    return slotCache[key];
  }

  function pickSlot(key) {
    var slots = getSlots(key);
    var idx = Math.floor(Math.random() * slots.length);
    if (!slotStacks[key]) slotStacks[key] = [];
    var stack = slotStacks[key];
    var layer = stack[idx] || 0;
    stack[idx] = layer + 1;
    var base = slots[idx];
    /* 每次再抖一点，同点叠层也更自然 */
    var rx = (Math.random() - 0.5) * 6;
    var ry = (Math.random() - 0.5) * 5;
    return {
      idx: idx,
      layer: layer,
      x: Math.max(5, Math.min(95, base.x + rx + (layer % 3) * 0.9)),
      y: Math.max(6, Math.min(94, base.y + ry - layer * 2.1))
    };
  }

  function fmtStake(n) {
    /* 千分位完整数字，避免「0.1万」这种难看增幅 */

  function clearBets(opts) {
    betTotals = {};
    slotStacks = {};
    roundPlacements = [];
    chipsHydratedRound = '';
    /* 同局刷新传 keepPersist，避免把气氛假筹缓存清掉 */
    if (!opts || !opts.keepPersist) clearPersistedTableChips();

  function canRebet() {
    /* 上一局有注、本局还没下过、当局未用过续押 */

      lastRoundPlacements.length > 0 && roundPlacements.length === 0;

  /* 开奖结束进入新一轮：只记本局为上一局（没下过则清空，不能隔局） */
  function commitRoundBets(opts) {
    lastRoundPlacements = roundPlacements.map(function (p) {
      return { key: p.key, value: p.value };

  function rebetLastRound() {
    if (!canRebet()) return;
    var list = lastRoundPlacements.slice();
    var n = list.length;
    var need = 0;
    for (var t = 0; t < n; t++) need += list[t].value;
    if (window.App && App.getBalance && user) {
      if (App.getBalance(user.uid) < need) {
        if (App.toast) App.toast('积分不足');
        return;
      }
    }
    if (!window.App || !App.placeTableBet) {
      if (window.App && App.toast) App.toast('请从大厅进入游戏');
      return;
    }
    usedRebet = true;
    rebetting = true;
    syncActionButtons();
    var landSize = barChipSize() * CHIP_LAND_SCALE;
    var flyMs = n <= 1 ? 360 : Math.min(320, Math.floor(700 / Math.max(1, Math.ceil(n / 6))));
    var gap = n <= 1 ? 0 : Math.max(12, Math.floor((1000 - flyMs) / (n - 1)));
    var chain = Promise.resolve();
    list.forEach(function (p) {
      chain = chain.then(function () {
        return App.placeTableBet(SERVER_GAME, p.key, p.value).then(function () {
          var btn = betArea.querySelector('.zjh-bet-btn[data-bet="' + p.key + '"]');
          if (btn) {
            var slot = pickSlot(p.key);
            betTotals[p.key] = (betTotals[p.key] || 0) + p.value;
            roundPlacements.push({ key: p.key, value: p.value });
            appendBetLog(p.key, p.value);
            updateStakeUI(btn, betTotals[p.key]);
            flyChipToBet(btn, p.value, slot, landSize, flyMs, 'me');
            sfx('bet', { vol: 0.75 });
          }
          return delay(gap);
        });
      });
    });
    chain.then(function () {
      rebetting = false;
      refreshStats();
      if (window.App && App.refreshBalance) App.refreshBalance().then(function () { refreshStats(); });
      syncActionButtons();
    }).catch(function (e) {
      rebetting = false;
      if (window.App && App.toast) App.toast((e && e.message) || '续押失败');
      refreshStats();
      if (window.App && App.refreshBalance) App.refreshBalance().then(function () { refreshStats(); });
      syncActionButtons();
    });
  }

  function flyChipToBet(btn, value, slot, landSize, flyMs, owner) {
    var srcChip = chipBar.querySelector('.zjh-chip[data-chip="' + value + '"]') ||
      chipBar.querySelector('.zjh-chip.is-selected');
    if (!srcChip || !btn) return;
    var duration = typeof flyMs === 'number' ? flyMs : CHIP_FLY_MS;
    var who = owner || 'me';

    var from = localRect(srcChip);
    var chipBox = btn.querySelector('.zjh-bet-btn__chips');
    var area = chipBox ? localRect(chipBox) : localRect(btn);

    var size = Math.min(from.width, from.height);
    var startX = from.left + from.width / 2 - size / 2;
    var startY = from.top + from.height / 2 - size / 2;
    var endCX = area.left + area.width * (slot.x / 100);
    var endCY = area.top + area.height * (slot.y / 100);
    var endX = endCX - size / 2;
    var endY = endCY - size / 2;
    var dx = endX - startX;
    var dy = endY - startY;
    var scale = landSize / size;

    var fly = document.createElement('div');
    fly.className = 'zjh-fly-chip';
    fly.style.width = size + 'px';
    fly.style.height = size + 'px';
    fly.style.left = startX + 'px';
    fly.style.top = startY + 'px';
    fly.style.transitionDuration = duration + 'ms';
    fly.style.setProperty('--fly-x', dx + 'px');
    fly.style.setProperty('--fly-y', dy + 'px');
    fly.style.setProperty('--fly-scale', String(scale));
    fly.innerHTML = '<img src="' + (CHIP_SRC[value] || CHIP_SRC[1]) + '" alt="" draggable="false">';
    flyLayer.appendChild(fly);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        fly.classList.add('is-flying');
      });
    });

    setTimeout(function () {
      fly.remove();
      placeChipOnBtn(btn, value, slot, landSize, who);
    }, duration);

  var OTHER_BET_KEYS = ['banker', 'player', 'shunjin', 'baozi', 'san2', 'san3', 'san6', 'san7'];

  function spawnOtherBet() {
    if (phase !== 'bet' || roundBusy) return;
    var pace = otherBetPace();
    var key = OTHER_BET_KEYS[Math.floor(Math.random() * OTHER_BET_KEYS.length)];
    if (Math.random() < 0.58) key = Math.random() < 0.5 ? 'banker' : 'player';

    var value = OTHER_CHIP_VALUES[Math.floor(Math.random() * OTHER_CHIP_VALUES.length)];
    var slot = pickSlot(key);

  function startOtherBetting() {
    stopOtherBetting();
    function schedule() {
      if (phase !== 'bet') return;
      var pace = otherBetPace();
      if (pace.burstMax <= 0) {
        otherBetTimer = setTimeout(schedule, pace.minWait + Math.random() * pace.spanWait);
        return;
      }
      var wait = pace.minWait + Math.random() * pace.spanWait;
      otherBetTimer = setTimeout(function () {
        if (phase !== 'bet') return;
        var span = Math.max(0, pace.burstMax - pace.burstMin);
        var n = pace.burstMin + Math.floor(Math.random() * (span + 1));
        for (var i = 0; i < n; i++) {
          setTimeout(spawnOtherBet, i * 120);
        }
        schedule();
      }, wait);
    }
    schedule();
  }

  /* ---------- 路单：珠盘路 + 大路 ---------- */
  var ROAD_ROWS = 6;
  var ROAD_LABELS = { banker: '庄', player: '闲' };
  var ROAD_NAMES = { banker: '庄', player: '闲' };
  var ROAD_ALLOWED = { banker: 1, player: 1 };
  var roadHistory = [];
  var roadRoundNos = {};
  /* 统计以服务端 history 为准；本会话内随开奖累加 */
  var roadStats = { banker: 0, player: 0 };
  var beadGrid = document.getElementById('beadGrid');
  var bigGrid = document.getElementById('bigGrid');

  var bigScroll = document.getElementById('bigScroll');

  function loadRoad() {
    roadHistory = [];
    roadStats = { banker: 0, player: 0 };
    roadRoundNos = {};
    if (window.TableShell && TableShell.hydrateRoad) {
      TableShell.hydrateRoad(SERVER_GAME, ROAD_ALLOWED, function (packed) {
        applyServerRoad(packed);
        if (packed && packed.snap && packed.snap.roundNo) {
          setRoundNoLabel(packed.snap.roundNo);
        }
      });
    }
  }

  function applyServerRoad(packed) {
    if (!packed) return;
    var incoming = packed.seq || [];
    if (roadHistory.length > incoming.length) return;
    roadHistory = incoming.slice();
    roadStats = { banker: 0, player: 0 };
    var st = packed.stats || {};
    Object.keys(roadStats).forEach(function (k) {
      roadStats[k] = st[k] || 0;
    });
    roadRoundNos = {};
    (packed.roundNos || []).forEach(function (rn) {
      if (rn) roadRoundNos[String(rn)] = 1;
    });
    renderRoad();
  }

  function countRoad(hist) {
    var c = { banker: 0, player: 0 };
    for (var i = 0; i < hist.length; i++) {
      if (c[hist[i]] != null) c[hist[i]] += 1;
    }
    return c;
  }

  function rollRoundResult() {
    /* 保留备用；正式开奖已改为比牌结果 pushRoad */
    return Math.random() < 0.5 ? 'banker' : 'player';
  }

  function pct(n, total) {
    if (!total) return '0%';
    return Math.round(n * 100 / total) + '%';
  }

  function setText(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  /** 大路：同色连下，换色新列；和局挂在上一颗上 */
  function buildBigRoad(history) {
    var cols = [];
    var lastSide = null;
    var pendingTies = 0;

    function place(side, ties) {
      var col = cols.length ? cols[cols.length - 1] : null;
      var canDown = col && col.side === side && col.cells.length < ROAD_ROWS && !col.dragon;
      if (!canDown) {
        col = { side: side, cells: [], dragon: false };
        cols.push(col);
      }
      if (col.cells.length >= ROAD_ROWS) {
        col.dragon = true;
        cols.push({ side: side, cells: [{ side: side, ties: ties }], dragon: true });
        return;
      }
      col.cells.push({ side: side, ties: ties });
    }

    for (var i = 0; i < history.length; i++) {
      var r = history[i];
      if (r === 'tie') {
        if (!cols.length) {
          pendingTies += 1;
        } else {
          var lastCol = cols[cols.length - 1];
          var lastCell = lastCol.cells[lastCol.cells.length - 1];
          lastCell.ties += 1;
        }
        continue;
      }
      place(r, pendingTies);
      pendingTies = 0;
      lastSide = r;
    }
    return cols;
  }

  function measureRoadViewCols(scrollEl) {
    if (window.TableShell && TableShell.measureRoadViewCols) {
      return TableShell.measureRoadViewCols(scrollEl, ROAD_ROWS);
    }
    return 12;
  }

  function resetRoadForNewDay(roundNo) {
    if (!roundNo || !window.TableShell) return;
    var ymd = TableShell.roundNoYmd(roundNo);
    if (!ymd) return;
    var keys = Object.keys(roadRoundNos);
    if (!keys.length) return;
    var prev = TableShell.roundNoYmd(keys[0]);
    if (prev && prev !== ymd) {
      roadHistory = [];
      roadRoundNos = {};
      roadStats = { banker: 0, player: 0 };
    }
  }

  function renderBead() {
    if (!beadGrid) return;
    var viewCols = measureRoadViewCols(beadScroll);
    var viewSeq = window.TableShell
      ? TableShell.roadBeadViewSeq(roadHistory, viewCols, ROAD_ROWS)
      : roadHistory.slice();
    var filledCols = Math.ceil(viewSeq.length / ROAD_ROWS) || 0;
    var cols = viewCols;
    var lastIdx = viewSeq.length - 1;
    var html = '';
    for (var c = 0; c < cols; c++) {
      for (var r = 0; r < ROAD_ROWS; r++) {
        var idx = c * ROAD_ROWS + r;
        if (idx < viewSeq.length) {
          var kind = viewSeq[idx];
          var latest = idx === lastIdx ? ' is-latest' : '';
          html += '<span class="zjh-bead zjh-bead--' + kind + latest + '" role="listitem" title="' + ROAD_NAMES[kind] + '" aria-label="' + ROAD_NAMES[kind] + '">' +
            ROAD_LABELS[kind] + '</span>';
        } else {
          html += '<span class="zjh-bead zjh-bead--empty" aria-hidden="true"></span>';
        }
      }
    }
    beadGrid.innerHTML = html;
    beadGrid.style.setProperty('--road-cols', String(cols));
    beadGrid.setAttribute('data-filled-cols', String(filledCols));
    syncRoadGridWidth(beadGrid, cols);
    if (beadScroll) beadScroll.scrollLeft = 0;
  }

  function renderBig() {
    if (!bigGrid) return;
    var viewCols = measureRoadViewCols(bigScroll);
    var colsData = buildBigRoad(roadHistory);
    if (window.TableShell) colsData = TableShell.roadBigViewCols(colsData, viewCols);
    var filledCols = colsData.length;
    var cols = viewCols;
    var html = '';
    var lastCol = filledCols - 1;
    var lastRow = lastCol >= 0 ? colsData[lastCol].cells.length - 1 : -1;

    for (var c = 0; c < cols; c++) {
      var col = colsData[c];
      for (var r = 0; r < ROAD_ROWS; r++) {
        if (col && r < col.cells.length) {
          var cell = col.cells[r];
          var latest = (c === lastCol && r === lastRow) ? ' is-latest' : '';
          var tieHtml = '';
          if (cell.ties > 0) {
            var n = cell.ties > 9 ? 9 : cell.ties;
            var label = n > 1 ? String(n) : '';
            tieHtml = '<i class="zjh-big__tie" data-n="' + n + '">' + label + '</i>';
          }
          html += '<span class="zjh-big zjh-big--' + cell.side + latest + '" role="listitem">' +
            tieHtml + '</span>';
        } else {
          html += '<span class="zjh-big zjh-big--empty" aria-hidden="true"></span>';
        }
      }
    }
    bigGrid.innerHTML = html;
    bigGrid.style.setProperty('--road-cols', String(cols));
    bigGrid.setAttribute('data-filled-cols', String(filledCols));
    syncRoadGridWidth(bigGrid, cols);
    if (bigScroll) bigScroll.scrollLeft = 0;
  }

  /** 按列数写死宽度 */
  function syncRoadGridWidth(grid, cols) {
    if (!grid || !cols) return;
    var sample = grid.querySelector('.zjh-bead, .zjh-big');
    var gap = 2;
    var cell = sample ? sample.getBoundingClientRect().width : 0;
    if (!(cell > 4)) {
      var sc = grid.closest('.zjh-roadmap__scroll');
      var h = sc ? sc.clientHeight : 0;
      cell = h > 8 ? (h - 6 - 5 * gap) / 6 : 22;
    }
    grid.style.width = (cols * (cell + gap) - gap) + 'px';
  }

    setText('roadBpct', pct(roadStats.banker, total));

  function pushRoad(result, roundNo) {
    if (!ROAD_LABELS[result]) return;
    if (roundNo && roadRoundNos[roundNo]) return;
    resetRoadForNewDay(roundNo);
    if (roundNo) roadRoundNos[roundNo] = 1;
    if (roadStats[result] != null) roadStats[result] += 1;
    roadHistory.push(result);
    renderRoad();
  }

  refreshStats();
  window.addEventListener('gamebox-balance', function () { refreshStats(); });

  /* ---------- 右侧快捷按钮 + 弹层（客服/历史/记录/玩法/设置） ---------- */
  (function initRail() {
    var mask = document.getElementById('zjhSheetMask');
    var sheet = document.getElementById('zjhSheet');
    var sheetTitle = document.getElementById('zjhSheetTitle');
    var sheetBody = document.getElementById('zjhSheetBody');
    var closeBtn = document.getElementById('zjhSheetClose');

    function openSheet(title, html) {
      if (!sheet) return;
      sheetTitle.textContent = title;
      sheetBody.innerHTML = html;
      mask.hidden = false;
      sheet.hidden = false;
      sheet.setAttribute('aria-hidden', 'false');
    }
    function closeSheet() {
      if (!sheet) return;
      sheet.hidden = true;
      sheet.setAttribute('aria-hidden', 'true');
      mask.hidden = true;
      sheetBody.innerHTML = '';
    }
    if (mask) mask.addEventListener('click', closeSheet);
    if (closeBtn) closeBtn.addEventListener('click', closeSheet);

    function nav(path) {
      if (window.App && App.go) App.go(path);
      else if (window.parent !== window) window.parent.postMessage({ type: 'assets-game-nav', path: path }, location.origin);
    }

    var csBtn = document.getElementById('railCs');
    if (csBtn) csBtn.addEventListener('click', function () {
      nav('../../client-app/pages/cs/cs.html' + q);
    });

    var recBtn = document.getElementById('railRecords');
    if (recBtn) recBtn.addEventListener('click', function () {
      var sep = q.indexOf('?') >= 0 ? '&' : '?';
      nav('../../client-app/pages/bet-records/bet-records.html' + q + sep + 'game=zhajinhua');
    });

    /* 历史记录：整个路单（珠盘 + 大路，全部记录） */
    function buildBeadCells(history) {
      var rows = ROAD_ROWS;
      var cols = Math.max(1, Math.ceil(history.length / rows));
      var last = history.length - 1;
      var html = '';
      for (var c = 0; c < cols; c++) {
        for (var r = 0; r < rows; r++) {
          var idx = c * rows + r;
          if (idx < history.length) {
            var kind = history[idx];
            var latest = idx === last ? ' is-latest' : '';
            html += '<span class="zjh-bead zjh-bead--' + kind + latest + '" title="' + ROAD_NAMES[kind] + '">' + ROAD_LABELS[kind] + '</span>';
          } else {
            html += '<span class="zjh-bead zjh-bead--empty"></span>';
          }
        }
      }
      return html;
    }
    function buildBigCells(history) {
      var data = buildBigRoad(history);
      var cols = Math.max(1, data.length);
      var lastCol = data.length - 1;
      var lastRow = lastCol >= 0 ? data[lastCol].cells.length - 1 : -1;
      var html = '';
      for (var c = 0; c < cols; c++) {
        var col = data[c];
        for (var r = 0; r < ROAD_ROWS; r++) {
          if (col && r < col.cells.length) {
            var cell = col.cells[r];
            var latest = (c === lastCol && r === lastRow) ? ' is-latest' : '';
            var tie = '';
            if (cell.ties > 0) {
              var n = cell.ties > 9 ? 9 : cell.ties;
              tie = '<i class="zjh-big__tie" data-n="' + n + '">' + (n > 1 ? n : '') + '</i>';
            }
            html += '<span class="zjh-big zjh-big--' + cell.side + latest + '">' + tie + '</span>';
          } else {
            html += '<span class="zjh-big zjh-big--empty"></span>';
          }
        }
      }
      return html;
    }
    var histBtn = document.getElementById('railHistory');
    if (histBtn) histBtn.addEventListener('click', function () {
      var total = roadStats.banker + roadStats.player;
      var html =
        '<div class="zjh-sheet-road__stats">' +
          '<span class="banker">庄 <b>' + roadStats.banker + '</b></span>' +
          '<span class="player">闲 <b>' + roadStats.player + '</b></span>' +
          '<span>总局 <b>' + total + '</b></span>' +
        '</div>' +
        '<div class="zjh-sheet-road__label">珠盘路（今日 ' + roadHistory.length + ' 局）</div>' +
        '<div class="zjh-sheet-road__scroll"><div class="zjh-sheet-road__grid">' + buildBeadCells(roadHistory) + '</div></div>' +
        '<div class="zjh-sheet-road__label">大路</div>' +
        '<div class="zjh-sheet-road__scroll"><div class="zjh-sheet-road__grid">' + buildBigCells(roadHistory) + '</div></div>';
      openSheet('历史记录', html);
      var scrolls = sheetBody.querySelectorAll('.zjh-sheet-road__scroll');
      for (var i = 0; i < scrolls.length; i++) scrolls[i].scrollLeft = scrolls[i].scrollWidth;
    });

    /* 玩法规则 */
    var rulesBtn = document.getElementById('railRules');
    if (rulesBtn) rulesBtn.addEventListener('click', function () {
      var html = window.TableShell
        ? TableShell.buildFormalRulesHtml({
            sections: [
              {
                title: '一、游戏简介',
                paragraphs: [
                  '本桌为三张牌比大小玩法。每局为庄、闲各发三张牌，比牌后确定胜负；玩家可押庄或闲，亦可对赢方牌型单独投注。',
                ],
              },
              {
                title: '二、牌型等级',
                paragraphs: ['牌型由大到小依次为：'],
                list: [
                  '豹子：三张同点',
                  '顺金：同花且连续（如黑桃 A、K、Q）',
                  '金花：三张同花色、非顺子',
                  '顺子：三张连续、非同花',
                  '对子：两张同点',
                  '散牌：其余牌型',
                ],
              },
              {
                title: '三、比牌规则',
                list: [
                  '先比牌型等级，高等级胜出',
                  '牌型相同则比点数；点数再相同则比最大单牌花色',
                  '花色大小：黑桃 &gt; 红心 &gt; 梅花 &gt; 方块',
                  '本玩法无和局，每局必有一方胜出',
                ],
              },
              {
                title: '四、结算说明',
                paragraphs: [
                  '下注期内可投注；封盘后停止接受注单，开牌后按结果结算。',
                  '路单展示本桌近期开奖走势，仅供参考。',
                ],
              },
            ],
            oddsRows: [
              ['庄 / 闲', '押中牌型更大的一方', '1 : ' + BET_ODDS.banker],
              ['顺金', '赢方牌型为同花顺', '1 : ' + BET_ODDS.shunjin],
              ['豹子', '赢方牌型为豹子', '1 : ' + BET_ODDS.baozi],
              ['顺子', '赢方牌型为顺子', '1 : ' + BET_ODDS.san6],
              ['金花', '赢方牌型为同花', '1 : ' + BET_ODDS.san7],
              ['对子', '赢方牌型为对子', '1 : ' + BET_ODDS.san3],
              ['散牌', '赢方牌型为散牌', '1 : ' + BET_ODDS.san2],
            ],
            notes: [
              '请理性投注，量力而行。',
              '最终以当局开牌结果与系统结算为准。',
            ],
          })
        : '<p>玩法规则加载失败，请刷新重试。</p>';
      openSheet('玩法规则', html);
    });

    /* 设置：背景音乐 / 音效开关 */
    var setBtn = document.getElementById('railSettings');
    if (setBtn) setBtn.addEventListener('click', function () {
      var html = window.TableShell
        ? TableShell.buildAudioSettingsHtml(audioPref)
        : '<p>设置加载失败</p>';
      openSheet('设置', html);
      if (window.TableShell) {
        TableShell.bindAudioSettings({
          onMusic: function (on) { if (typeof unlockAudio === 'function') unlockAudio(); setMusicOn(on); },
          onSfx: function (on) { if (typeof unlockAudio === 'function') unlockAudio(); setSfxOn(on); },
        });
      }
    });

      /* 右侧五钮：默认收起，点三角展开/收起（固定右侧，勿跟假人 JS 定位） */
    (function initRailLadder() {
      var KEY = 'zjh_rail_collapsed';
      var rail = document.getElementById('zjhRail');
      var btn = document.getElementById('btnRailToggle');
      if (!rail || !btn) return;
      /* 清掉旧版假人定位残留的 inline 样式 */
      rail.style.left = '';
      rail.style.top = '';
      rail.style.transform = '';
      var collapsed = true;
      try {
        var saved = localStorage.getItem(KEY);
        if (saved === '0') collapsed = false;
        if (saved === '1') collapsed = true;
      } catch (e) { /* ignore */ }
      function apply() {
        rail.classList.toggle('is-rail-collapsed', collapsed);
        btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        btn.title = collapsed ? '展开菜单' : '收起菜单';
        var arrow = btn.querySelector('.zjh-rail-ladder__arrow');
        if (arrow) arrow.textContent = collapsed ? '▼' : '▲';
        try { localStorage.setItem(KEY, collapsed ? '1' : '0'); } catch (e2) { /* ignore */ }
      }
      apply();
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        collapsed = !collapsed;
        apply();
      });
    })();
  })();

  /* ---------- 气氛人数（桌边右侧，非实时在线） ---------- */
  var playersBox = document.getElementById('playersBox');
  if (playersBox) {
    playersBox.setAttribute('aria-label', '气氛人数（非实时在线）');
    playersBox.setAttribute('title', '桌面气氛人数，非实时在线');
  }
  var playersCountEl = document.getElementById('playersCount');
  var onlinePlayers = 36 + Math.floor(Math.random() * 28);

  function paintPlayers() {
    if (playersCountEl) playersCountEl.textContent = String(onlinePlayers);
  }

  function tickPlayers() {
    var d = Math.floor(Math.random() * 5) - 2;
    onlinePlayers = Math.max(18, Math.min(99, onlinePlayers + d));
    paintPlayers();
  }

  paintPlayers();
  if (window.__zjhPlayersTimer) clearInterval(window.__zjhPlayersTimer);
  window.__zjhPlayersTimer = setInterval(tickPlayers, 8000);

  /* 全部变量就绪后再开局 + 启动唯一倒计时 */
  hideAllCards();
  /* 先拉 snapshot：开奖中刷新/重进应 join 开奖轴，勿直接 startBetRound 卡「准备中」 */
  function bootFromServer() {
    if (!window.App || !App.fetchTableSnapshot) {
      startBetRound();
      return;
    }
    App.fetchTableSnapshot(SERVER_GAME).then(function (snap) {
      if (!snap) {
        startBetRound();
        return;
      }
      applyServerSnap(snap);
      if (joinOrSeekDraw(snap)) return;
      startBetRound();
    }).catch(function () {
      startBetRound();
    });
  }
  bootFromServer();
  if (window.__zjhTickTimer) clearInterval(window.__zjhTickTimer);
  window.__zjhTickTimer = setInterval(tick, 200);
  if (window.TableShell && TableShell.startSnapshotPoll) {
    window.__zjhSnapTimer = TableShell.startSnapshotPoll(SERVER_GAME, function (snap) {
      applyServerSnap(snap);
      if (alignWaiting) {
        if (joinOrSeekDraw(snap)) return;
        if (snap.phase === 'BETTING' && Number(snap.secondsLeft) > 0) {
          startBetRound();
          return;
        }
      }
      if (phase === 'draw' && drawClock) {
        if (snap.phase === 'BETTING' && Number(snap.secondsLeft) > 0) {
          if (drawClock.outcome && !drawClock.flags.payout) beginDrawPayout(drawClock, true);
          else {
            drawClock = null;
            roundBusy = false;
            startBetRound();
          }
          return;
        }
        if (snap && snap.outcome) bindDrawOutcome(snap);
        advanceDrawClock();
        return;
      }
        /* 下注态却发现服务端已开奖：立刻切入开奖轴（防漏切） */
      if (phase === 'bet' && !roundBusy && joinOrSeekDraw(snap)) return;
      if (phase === 'bet' && !roundBusy) {
        left = Math.max(0, Math.ceil(getBetRemainSec()));
        paint(false);
      }
    }, {
      intervalMs: 1000,
      shouldPoll: function () {
        return (phase === 'bet' && !roundBusy) || alignWaiting || phase === 'draw';
      },
    });
  }

  function onShellResume() {
    try { flyLayer.innerHTML = ''; } catch (eR) { /* ignore */ }
    if (!window.App || !App.fetchTableSnapshot) {
      if (phase === 'draw' && drawClock) {
        drawClock.dealStarted = {};
        drawClock.flipStarted = {};
        drawClock.forceSeek = true;
        advanceDrawClock();
      }
      return;
    }
    App.fetchTableSnapshot(SERVER_GAME).then(function (snap) {
      if (!snap) return;
      applyServerSnap(snap);
      if (snap.phase === 'BETTING' && Number(snap.secondsLeft) > 0) {
        if (phase === 'draw' || alignWaiting || (phase === 'payout' && drawClock)) {
          if (drawClock && drawClock.outcome && !drawClock.flags.payout) {
            beginDrawPayout(drawClock, true);
          }
          drawClock = null;
          roundBusy = false;
          startBetRound();
          return;
        }
      }
      if (joinOrSeekDraw(snap)) return;
      if (phase === 'draw' && drawClock) {
        if (snap.outcome) bindDrawOutcome(snap);
        drawClock.dealStarted = {};
        drawClock.flipStarted = {};
        drawClock.forceSeek = true;
        advanceDrawClock();
      } else if (alignWaiting && snap.phase === 'BETTING' && Number(snap.secondsLeft) > 0) {
        startBetRound();
      }
    }).catch(function () { /* ignore */ });
  }

  /* 父壳 keep-alive：visibility 不一定变，靠 postMessage 通知回来对齐 */
  window.addEventListener('message', function (ev) {
    if (!ev || !ev.origin || ev.origin !== location.origin) return;
    var data = ev && ev.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === 'assets-game-pause') {
      try { flyLayer.innerHTML = ''; } catch (eP) { /* ignore */ }
      persistTableChips();
      return;
    }
    if (data.type === 'assets-game-resume') {
      onShellResume();
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      try { flyLayer.innerHTML = ''; } catch (eH) { /* ignore */ }
      persistTableChips();
      return;
    }
    onShellResume();
  });

  window.addEventListener('pagehide', function () { persistTableChips(); });
  window.addEventListener('beforeunload', function () { persistTableChips(); });

  window.__zjhBooted = true;

})();
</script>
