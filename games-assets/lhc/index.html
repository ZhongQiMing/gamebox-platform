<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/fonts/gamebox-fonts.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>幸运六合彩</title>
  <link rel="stylesheet" href="/legacy/css/common.css">
  <link rel="stylesheet" href="./css/lhc.css?v=49">
  <script>
    (function () {
      if (window.parent !== window) {
        document.documentElement.classList.add('lhc-in-iframe');
      }
    })();
  </script>
</head>
<body class="lhc-body lhc-bg">

<div class="lhc-room">
  <div class="lhc-room-glow" aria-hidden="true"></div>
  <header class="lhc-head">
    <div class="lhc-head__brand">
      <button type="button" class="lhc-head-back" id="backBtn" aria-label="返回"></button>
      <h1 class="lhc-head-title">幸运六合彩</h1>
    </div>
    <div class="lhc-stats" id="statsBar">
      <div class="lhc-stat"><span class="k">积分</span><span class="v" id="statBalance">0</span></div>
      <div class="lhc-stat"><span class="k">输赢</span><span class="v" id="statWinloss">0</span></div>
      <div class="lhc-stat"><span class="k">流水</span><span class="v" id="statTurnover">0</span></div>
      <div class="lhc-stat"><span class="k">回水</span><span class="v" id="statRebate">0</span></div>
    </div>
  </header>

  <section class="lhc-issue-card">
    <div class="lhc-issue-card__left">
      <em class="lhc-cur-issue__tag">当前期</em>
      <span class="val lhc-cur-issue" id="curIssue">00000000</span>
    </div>
    <div class="lhc-issue-card__mid">
      <div class="lhc-timer" id="countdownBox" aria-label="倒计时">
        <span class="lhc-timer__lbl" id="cdLabel">距封盘</span>
        <div class="lhc-timer__digits" id="cdDigits">
          <div class="lhc-timer__group">
            <span class="lhc-timer__cell">0</span>
            <span class="lhc-timer__cell">0</span>
          </div>
          <span class="lhc-timer__sep" aria-hidden="true">:</span>
          <div class="lhc-timer__group">
            <span class="lhc-timer__cell">0</span>
            <span class="lhc-timer__cell">0</span>
          </div>
        </div>
        <span class="lhc-timer__prep" id="cdPrep" hidden>封盘中 · 准备开奖</span>
      </div>
    </div>
    <div class="lhc-issue-card__acts">
      <button type="button" class="lhc-issue-btn" id="btnLong">长龙</button>
      <button type="button" class="lhc-issue-btn" id="btnPredict">预测</button>
    </div>
  </section>

  <section class="lhc-draw-bar" id="drawBar">
    <button type="button" class="lhc-draw-bar__main" id="drawToggle" aria-expanded="false">
      <span class="lhc-draw-bar__issue-wrap">
        <em class="lhc-draw-bar__issue-tag">上期</em>
        <span class="lhc-draw-bar__issue" id="barIssue">00000000</span>
      </span>
      <span class="lhc-draw-bar__balls" id="barBalls"></span>
      <span class="lhc-draw-bar__gy" id="barGy">特码 —</span>
      <span class="lhc-draw-bar__arrow" id="drawArrow">▾</span>
    </button>
    <div class="lhc-draw-panel" id="drawPanel">
      <div class="lhc-draw-table-wrap">
        <table class="lhc-draw-table">
          <colgroup>
            <col class="col-issue">
            <col class="col-ball" span="7">
            <col class="col-meta" span="2">
          </colgroup>
          <thead>
            <tr>
              <th>期数</th>
              <th>正</th><th>正</th><th>正</th><th>正</th><th>正</th><th>正</th>
              <th>特</th>
              <th>总和</th>
              <th>两面</th>
            </tr>
          </thead>
          <tbody id="drawTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <div class="lhc-chat-wrap">
    <main class="lhc-chat" id="chatFeed" role="log" aria-live="polite"></main>
    <div class="lhc-chat-dock" id="chatDock" hidden></div>
  </div>

    <!-- 右侧浮钮：梯子收起 / 展开 客服·规则·记录·玩法 -->
  <aside class="lhc-rail" aria-label="快捷操作">
    <button
      type="button"
      class="lhc-rail-ladder"
      id="btnRailToggle"
      title="展开菜单"
      aria-expanded="false"
      aria-controls="lhcRailStack"
    >
      <span class="lhc-rail-ladder__arrow" aria-hidden="true">▼</span>
    </button>
    <div class="lhc-rail-stack" id="lhcRailStack">
      <button type="button" class="lhc-rail-btn" id="btnCs" title="客服">
        <img class="lhc-rail-ic" src="/images/chat-rail/cs.png?v=1" alt="" draggable="false">
        <span class="lhc-rail-lb">客服</span>
      </button>
      <button type="button" class="lhc-rail-btn" id="btnRules" title="规则">
        <img class="lhc-rail-ic" src="/images/chat-rail/rules.png?v=1" alt="" draggable="false">
        <span class="lhc-rail-lb">规则</span>
      </button>
      <button type="button" class="lhc-rail-btn" id="btnRecords" title="记录">
        <img class="lhc-rail-ic" src="/images/chat-rail/records.png?v=1" alt="" draggable="false">
        <span class="lhc-rail-lb">记录</span>
      </button>
      <button type="button" class="lhc-rail-btn lhc-rail-btn--play" id="btnExpand" title="玩法">
        <img class="lhc-rail-ic lhc-rail-ic--play" src="/images/chat-rail/play.png?v=1" alt="" draggable="false">
        <span class="lhc-rail-lb">玩法</span>
      </button>
    </div>
  </aside>

  <footer class="lhc-composer">
    <input type="text" class="lhc-input" id="chatInput" placeholder="例：特码08/100 或 特码大/50" autocomplete="off" enterkeyhint="send">
    <button type="button" class="lhc-composer-btn" id="plusBtn" aria-label="更多">
      <img class="lhc-composer-btn__img" id="plusBtnImg" src="/images/chat-rail/plus.png?v=1" alt="" draggable="false">
    </button>
    <button type="button" class="lhc-composer-btn lhc-composer-btn--play" id="btnComposerPlay" title="玩法" aria-label="玩法">
      <img class="lhc-composer-btn__img lhc-composer-btn__img--play" src="/images/chat-rail/play.png?v=1" alt="" draggable="false">
    </button>
  </footer>

  <div class="lhc-keypad" id="keypad" hidden>
    <div class="lhc-keypad__tools">
      <button type="button" data-cmd="topup">上分</button>
      <button type="button" data-cmd="cancel">取消</button>
      <button type="button" data-cmd="allin">梭哈</button>
      <button type="button" data-cmd="repeat">重复</button>
      <button type="button" data-cmd="withdraw">下分</button>
    </div>
    <div class="lhc-keypad__grid" id="keyGrid"></div>
  </div>

  <div class="lhc-menu-mask" id="menuMask" hidden></div>
  <div class="lhc-plus-menu" id="plusMenu" hidden>
    <button type="button" data-link="recharge">上下分</button>
    <button type="button" data-link="apply-records">申请记录</button>
    <button type="button" data-link="bet-records">竞猜报表</button>
    <button type="button" data-link="rebate">自助回水</button>
    <button type="button" data-link="activities">福利活动</button>
    <button type="button" data-link="settings">我的账户</button>
  </div>

  <div class="lhc-play-mask" id="playMask" hidden></div>
  <div class="lhc-play-sheet" id="playSheet" hidden>
    <div class="lhc-play-sheet__head">
      <span>全部玩法</span>
      <div class="lhc-play-sheet__head-actions">
        <button type="button" class="lhc-play-sheet__rules" id="playSheetRules" title="游戏规则">
          <span class="lhc-play-sheet__rules-ic" aria-hidden="true">i</span>
          <span>游戏规则</span>
        </button>
        <button type="button" id="playSheetClose" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="lhc-play-sheet__main">
      <nav class="lhc-play-nav" id="playNav" aria-label="玩法分类"></nav>
      <div class="lhc-play-panel">
        <p class="lhc-play-panel__hint" id="playHint"></p>
        <div class="lhc-play-panel__sub" id="playSub" hidden></div>
        <div class="lhc-play-panel__grid" id="playGrid"></div>
      </div>
    </div>
    <footer class="lhc-play-sheet__foot">
      <div class="lhc-play-foot__chiprow">
        <div class="lhc-play-foot__chips" id="playAmountChips"></div>
        <input type="number" class="lhc-play-foot__input" id="playAmount" value="100" min="1" inputmode="numeric" aria-label="单注金额">
        <button type="button" class="lhc-play-foot__allin" id="playAmountAllin">梭哈</button>
      </div>
      <div class="lhc-play-foot__action">
        <button type="button" class="lhc-play-foot__clear" id="playClear">清空</button>
        <div class="lhc-play-foot__summary">
          <div class="lhc-play-foot__total">投注金额: <strong id="playBetTotal">0</strong></div>
          <div class="lhc-play-foot__bal">账户余额: <strong id="playFootBalance">0</strong></div>
        </div>
        <button type="button" class="lhc-play-foot__repeat" id="playRepeat">重复</button>
        <button type="button" class="lhc-play-foot__submit" id="playSubmit">投注</button>
      </div>
      <div class="lhc-play-foot__tip" id="playSelected" hidden></div>
    </footer>
  </div>
</div>

    <!-- 游戏规则（底部金黑面板，与时时彩同款） -->
  <div class="lhc-rules-mask" id="rulesMask" hidden></div>
  <div class="lhc-rules-sheet" id="rulesSheet" hidden>
    <div class="lhc-rules-sheet__head">
      <span id="rulesTitle">游戏规则</span>
      <button type="button" id="rulesSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="lhc-rules-sheet__body" id="rulesBody"></div>
  </div>

  <div class="lhc-long-mask" id="longMask" hidden></div>
  <div class="lhc-long-sheet" id="longSheet" hidden>
    <div class="lhc-long-sheet__handle" aria-hidden="true"></div>
    <div class="lhc-long-sheet__head">
      <div>
        <b>长龙统计</b>
        <small id="longSummary">连续 2 期及以上</small>
      </div>
      <button type="button" id="longSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="lhc-long-sheet__tabs" id="longTabs">
      <button type="button" class="is-active" data-tab="side">两面</button>
      <button type="button" data-tab="color">色波</button>
      <button type="button" data-tab="zodiac">生肖</button>
    </div>
    <div class="lhc-long-sheet__body" id="longBody"></div>
  </div>

  <div class="lhc-long-mask" id="predictMask" hidden></div>
  <div class="lhc-long-sheet lhc-predict-sheet" id="predictSheet" hidden>
    <div class="lhc-long-sheet__handle" aria-hidden="true"></div>
    <div class="lhc-long-sheet__head">
      <div>
        <b>智能预测</b>
        <small id="predictSummary">下一期 · --------</small>
      </div>
      <button type="button" id="predictSheetClose" aria-label="关闭">×</button>
    </div>
    <div class="lhc-long-sheet__tabs" id="predictTabs">
      <button type="button" class="is-active" data-tab="side">两面</button>
      <button type="button" data-tab="color">色波</button>
      <button type="button" data-tab="zodiac">生肖</button>
      <button type="button" data-tab="hot">热冷</button>
    </div>
    <div class="lhc-long-sheet__body" id="predictBody"></div>
    <div class="lhc-predict-foot">基于近期开奖走势统计，仅供参考</div>
  </div>

<script src="/legacy/js/jquery-3.7.1.min.js"></script>
<script src="/legacy/js/games-common.js?v=32"></script>
<script src="/games-assets/_lottery-common/room-chat.js?v=29"></script>
<link rel="stylesheet" href="/games-assets/_lottery-common/hold-drawing-tip.css?v=4">
<script src="/games-assets/_lottery-common/hold-drawing-tip.js?v=4"></script>
<link rel="stylesheet" href="/games-assets/_lottery-common/card-sfx-toggle.css?v=8">
<script src="/games-assets/_lottery-common/app-audio-level.js?v=1"></script>
<script src="/games-assets/_lottery-common/card-sfx-toggle.js?v=4"></script>
<script src="./js/lhc-audio.js?v=5"></script>
<script src="./js/result-card.js?v=25"></script>
<script src="./js/lhc.js?v=183"></script>
<script>
(function () {
  function boot() {
    if (!window.LotteryCardSfx) return;
    LotteryCardSfx.install({
      audio: window.LhcAudio,
      cardSelector: '.lhc-video-card',
      headSelector: '.lhc-video-card__head',
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
