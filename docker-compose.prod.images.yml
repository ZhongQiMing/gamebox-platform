# 路2：本机构建镜像后上传到服务器使用（不含 build，只引用已 load 的镜像）
# 服务器：docker load -i gamebox-images-<版本>.tar.gz
#         docker compose -f docker-compose.prod.images.yml --env-file .env.prod up -d
#
# 跑哪个版本由 .env.prod 里的 GAMEBOX_VERSION 决定，两个应用镜像必须同版本。
# 别把它改回 latest：latest 是同名覆盖，load 新镜像会把旧镜像的标签摘掉，
# 服务器上就再也找不到上一版，出事只能回本机重新构建（十几分钟起）。

# 日志轮转：Docker 默认 json-file 无上限，一个刷屏的报错能在几天里吃掉整块盘，
# 而磁盘满会先把 Postgres 写挂。所有服务共用这一份配置。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    container_name: gamebox-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: gamebox
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gamebox
      # 容器默认 UTC，日志和 psql 里的时间会跟业务（上海时区）对不上，排障时很误导
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - gamebox_pgdata:/var/lib/postgresql/data
    networks: [gamebox]
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-1g}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamebox -d gamebox']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: gamebox-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - gamebox_redisdata:/data
    networks: [gamebox]
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512m}
    healthcheck:
      # 须与上面 command 的分支一致：设了 requirepass 裸 ping 返回 NOAUTH，
      # 没设时带 -a "" 又会返回 ERR no password is set，两种都会卡死健康检查
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping;
          else redis-cli ping; fi | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    # 默认值 latest 只为兼容「打版本号之前」的老部署，正常流程一定带版本号
    image: gamebox-server:${GAMEBOX_VERSION:-latest}
    container_name: gamebox-server
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - server/.env.production
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [gamebox]
    volumes:
      - gamebox_uploads:/repo/server/uploads
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEM_LIMIT:-1g}
    healthcheck:
      # 运行镜像基于 node:20-slim，不含 wget/curl；探针走 Node 内置 fetch，端口跟随 PORT
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: gamebox-web:${GAMEBOX_VERSION:-latest}
    container_name: gamebox-web
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 只开本机：TLS 由宿主机 Nginx 终止后反代到 127.0.0.1:8080，容器不直面公网
      - "127.0.0.1:8080:80"
    networks: [gamebox]
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-256m}

networks:
  gamebox:
    driver: bridge

volumes:
  gamebox_pgdata:
  gamebox_redisdata:
  gamebox_uploads:
