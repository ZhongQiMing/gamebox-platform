# ⚠️ 本文件只用于「在服务器上现场构建」这种应急场景，正式发版不要用它。
#
# 它引用的是 :latest 标签。latest 是同名覆盖：新镜像一 build 就把旧镜像的标签摘掉，
# 服务器上再也找不到上一版，出事只能回本机重新构建（十几分钟起）。
# 正式发版一律走 docker-compose.prod.images.yml + scripts/deploy-on-server.sh，
# 那条路径的镜像带不可变版本号，能一键回滚，也有日志轮转/资源上限/时区。
#
# 本机构建：docker compose -f docker-compose.prod.yml --env-file .env.prod build
# 服务器运行：docker load 导入镜像后 docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# .env.prod 只需提供 DB_PASSWORD，其余后端环境变量在 server/.env.production 中配置
services:
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: gamebox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamebox
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gamebox
    volumes:
      - gamebox_pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamebox -d gamebox']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: gamebox-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - gamebox_redisdata:/data
    networks: [backend]
    healthcheck:
      # 须与上面 command 的分支一致：设了 requirepass 裸 ping 返回 NOAUTH，
      # 没设时带 -a "" 又会返回 ERR no password is set，两种都会卡死健康检查
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping;
          else redis-cli ping; fi | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    image: gamebox-server:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: gamebox-server
    restart: unless-stopped
    env_file:
      - server/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [frontend, backend]
    volumes:
      - gamebox_uploads:/repo/server/uploads
      - gamebox_private_uploads:/repo/server/private-uploads
    user: "1000:1000"
    read_only: true
    init: true
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    healthcheck:
      # 运行镜像基于 node:22-slim，不含 wget/curl；探针走 Node 内置 fetch，端口跟随 PORT
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    image: gamebox-web:latest
    build:
      context: .
      dockerfile: client-app/Dockerfile
    container_name: gamebox-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 三个独立 Origin 均只开本机，由宿主机 TLS Nginx 分域名转发。
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    networks: [frontend]
    user: "101:101"
    read_only: true
    init: true
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    healthcheck:
      # 应急变体也必须同时验证玩家、管理、游戏三个 HTTP 入口。
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8080/
          && wget -q -O /dev/null http://127.0.0.1:8081/
          && wget -q -O /dev/null http://127.0.0.1:8082/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  gamebox_pgdata:
  gamebox_redisdata:
  gamebox_uploads:
  gamebox_private_uploads:
